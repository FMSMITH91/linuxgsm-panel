# SonarCloud's Automatic Analysis reads this file (from the default branch). Each line answers one of
# the analysis warnings it raised on main (2026-10-01).

# "Your code is analyzed as compatible with Python versions 3.10 through 3.14 by default": the panel
# supports exactly that range, one per Ubuntu LTS it runs on (22.04: 3.10 ... 26.04: 3.14), and CI
# tests each end of it. Said, not assumed.
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# "SonarPython detected files that look like test code but 'sonar.tests' is not configured": the
# suites, the fuzz harnesses and their corpus are test code. Read as tests, they get the rules written
# for tests instead of production rules. Sources are everything else.
sonar.sources=.
sonar.tests=tests
# static/vendor/ is third-party code this project does not write (minified bundles, fonts). Images
# and fonts are binary: read as source they are what "There are problems with file encoding" was
# about. After static/vendor/ alone was excluded (#382) the warning stayed, and the only non-UTF-8
# files left in the sources were docs/screenshots/*.png. They are excluded by type, wherever they
# are; tests/unit/part19.py fails the build if any non-UTF-8 file is left in the sources.
sonar.exclusions=tests/**,static/vendor/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf

# Every text file is UTF-8.
sonar.sourceEncoding=UTF-8
