# SonarCloud's Automatic Analysis reads this file (from the default branch). Each line answers one of
# the analysis warnings it raised on main (2026-10-01).

# "Your code is analyzed as compatible with Python versions 3.10 through 3.14 by default": the panel
# supports exactly that range, one per Ubuntu LTS it runs on (22.04: 3.10 ... 26.04: 3.14), and CI
# tests each end of it. Said, not assumed.
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# "SonarPython detected files that look like test code but 'sonar.tests' is not configured": the
# suites, the fuzz harnesses and their corpus are test code. Read as tests, they get the rules written
# for tests instead of production rules. Sources are everything else.
sonar.sources=.
sonar.tests=tests
# static/vendor/ is third-party code this project does not write (minified bundles, fonts), and
# images and fonts are binary, not source: neither is analysed.
sonar.exclusions=tests/**,static/vendor/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf

# The fuzz corpus is input data for the harnesses, not test code.
sonar.test.exclusions=tests/fuzz/corpus/**

# "There are problems with file encoding": every file is UTF-8, and that warning was two LITERAL
# U+FFFD replacement characters in tests (part01, part13), which the scanner reports as an invalid
# character in any file. Found by running the scanner locally ("Invalid character encountered in
# file tests/unit/part01.py at line 1019"), after three guesses (#382 vendor, #383 images, #384 the
# corpus) left it standing. Such a test writes "\ufffd". tests/unit/part19.py fails the build on a
# file the scanner reads that is not UTF-8, or that holds a U+FFFD or a NUL.
sonar.sourceEncoding=UTF-8
