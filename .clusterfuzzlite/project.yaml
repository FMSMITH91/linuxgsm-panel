# ClusterFuzzLite project configuration. `language` is the only required key; the rest are the
# fields an upstream OSS-Fuzz submission also wants, kept here so the two stay in sync.
language: python
homepage: "https://github.com/FMSMITH91/linuxgsm-panel"
main_repo: "https://github.com/FMSMITH91/linuxgsm-panel"
fuzzing_engines:
  - libfuzzer
sanitizers:
  - address
  - undefined
# Build and fuzz on Ubuntu 24.04. Without it ClusterFuzzLite keeps the legacy Ubuntu 20.04 images
# (OSS-Fuzz docs/getting-started/continuous_integration.md, "Ubuntu 24.04 Support"). The Dockerfile's
# FROM and .github/actions/cflite-* pin the 24.04 images by digest; part242 holds the three to it.
base_os_version: ubuntu-24-04
