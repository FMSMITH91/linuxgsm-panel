# Gitleaks config for linuxgsm-panel.
# Uses the full default ruleset, plus an allowlist for the UI's token *placeholders*
# (example strings shown to the user in input hints) so they don't trip a false
# positive. Real secrets (SSH creds, secret_key, config.json, panel.db) live in the
# gitignored data/ directory and are never committed.

title = "linuxgsm-panel gitleaks"

[extend]
useDefault = true

# `[[allowlists]]`, an array of tables: gitleaks v8.25.0 replaced the single `[allowlist]` table with
# it (README, v8.30.1). The old table still loads through a deprecated compatibility shim, and a
# release that dropped the shim and ignored the table would start firing on every placeholder below.
# The keys are the same. Measured with the pinned 8.30.1 over the full history (986 commits): no
# findings under either spelling, and with the entries removed one at a time, each spelling reports
# exactly the same findings back, so the array table is read as the old one was.
[[allowlists]]
description = "Non-secret UI placeholders and example values"
# Match against the detected secret text.
regexTarget = "match"
# Commits whose every finding is exempt. Only for a commit reviewed line by line, whose findings
# cannot be exempted by a match regex without also clearing what a gate needs gitleaks to find.
#   12d1466 (PR #366): the part06 gate for the entry below wrote its two negative-control probes
#   as literals (another value in the Ubuntu Pro field; this value in another field). The tree
#   builds them now; a regex clearing their text would clear the probes the gate relies on.
commits = ["12d1466321fa6c95f85dede160785208829b69b8"]
regexes = [
  '''tskey-auth-\.{2,}''',          # Tailscale auth-key input placeholder (e.g. "tskey-auth-...")
  '''tskey-auth-\.\.\.''',
  '''C1a[.…]''',                    # Ubuntu Pro token input placeholder (e.g. "C1a…")
  '''~/\.ssh/id_rsa''',             # default SSH key *path* shown in the add-remote form
  '''tskey-[A-Za-z0-9]{0,6}\.\.\.''',
  '''maxBytes=\d+''',               # false positive: the auth.log RotatingFileHandler size — the
                                    # generic-api-key rule keys off "AUTH" in AUTH_LOG_PATH; not a secret
  # An eighteen-digit run IS a Discord snowflake by shape, so discord-client-id is right to flag
  # one — this is the obviously-sequential placeholder in a unit-test fixture. The working tree
  # builds it ("9" * 18) instead; this entry exists only because gitleaks scans the full HISTORY
  # and the literal is still in commit 6c75748. Matched against the whole `_DISCORD_CHANNEL_RE`
  # assignment, because regexTarget = "match" above compares the MATCH, not the secret alone —
  # anchoring on the digits matched nothing and left the gate red.
  '''_DISCORD_CHANNEL_RE": "123456789012345678"''',
  # xterm.js's own `FourKeyMap` enum, in the vendored minified bundle. generic-api-key keys off
  # the `...Key...=` shape and takes the next token as the secret; the token is an array literal
  # in a 289KB single line. Allowlisted by this exact identifier rather than by allowlisting the
  # whole vendor path, so a DIFFERENT finding in a future xterm bump still turns the gate red and
  # gets looked at. Reproduced locally with gitleaks 8.30.1 — the pinned version — before and
  # after, because an allowlist that does not actually match is indistinguishable from a fixed
  # gate until CI says otherwise.
  '''FourKeyMap=''',
  # NodeSource's PUBLIC signing-key fingerprint, pinned in install.sh so the apt key is verified
  # before it is trusted. generic-api-key reads `..._KEY_FPR="<40 hex>"` as a credential. A
  # fingerprint is published by design; exempted as the whole assignment with this exact value
  # (regexTarget = "match"), because the literal is in branch history from commit 4bc9cba on and
  # history is not rewritten. A key rotation changes the value, the gate goes red, and the new
  # fingerprint gets looked at — a unit gate ties this entry to install.sh so that happens there.
  '''NODESOURCE_KEY_FPR="6F71F525282841EEDAF851B42F59B5F99B1BE0B4"''',
  # The JS coverage walk's stand-in Ubuntu Pro token, typed into the attach form to drive its
  # "not a valid token" path. It is a sequential placeholder, not a credential, and the working
  # tree now types 'not-a-real-pro-token', which no rule reads as a secret; this entry exists only
  # because the PR range still carries the old literal (commit 13e3441, flows.py). Matched with
  # its field name so a real token typed into any other field still turns the gate red.
  '''upro-token', 'C1234567890abcdef''',
  # part13's pin write-lock gate traces _persist_host_key by assigning a wrapper function to it.
  # generic-api-key reads `..._key = <identifier>` as a credential and the identifier's entropy as
  # a secret's; the value is a test function's name. Matched as that exact assignment, so any other
  # value assigned to the name (and every real key anywhere) still turns the gate red.
  '''_persist_host_key = _pl_traced_persist10''',
]
# No `paths` exemptions. There was one — '''README\.md''' — and gitleaks' path patterns are
# unanchored searches, so it took every README in the repo (the root one, static/js/,
# tests/fuzz/, .clusterfuzzlite/) out of the scan entirely, for placeholders the regexes above
# already cover. A README is exactly where a real token gets pasted while documenting a setup,
# which is why security.yml refuses to be path-filtered. A unit gate keeps any future path
# exemption anchored to one named file and off every README.
