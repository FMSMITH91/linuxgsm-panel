# Scope: everything but docs/ (prose and screenshots, no code).
#
# tests/ IS analysed (security-and-quality, like the application). It used to be ignored as "not
# shipped", but the suites are where the panel's security properties are pinned, and a mistake in a
# test - a comparison that is always true, a result that is never asserted, a path outside the
# test's temp dir - makes a check pass while proving nothing, which nothing else would notice.
# A test's deliberate stand-ins are fixed or triaged where they are reported, not hidden here.
#
# tools/panel-helper (the root-run end of the sudo boundary) is Python with a shebang and no .py
# extension. The Python extractor still takes it: its traverser accepts a file with no extension
# whose first line is a Python shebang (semmle/traverser.py base_filter, modules.is_script). That is
# not taken on trust: codeql.yml fails the analysis, and uploads nothing, when the helper is missing
# from the database it analysed.
#
# The smoke suite is analysed too, as tests/smoke_test.py (its runner) and tests/smoke/part*.py.
# It used to be one 1 MB module, almost all of it inside a single try, and this file left it out
# for time alone: the Python extractor took 1,446 s (24 minutes) on that one file, measured by a
# probe run with no time limit (the whole Python analysis took 50 minutes with it and 9.5
# without), while tests/unit/part06.py (about 800 KB) takes about 2 minutes. It was split into parts
# of about 200 KB each, and codeql.yml checks every part is in the database, as it does the helper.
name: "linuxgsm-panel CodeQL config"

paths-ignore:
  - docs

# Exclude py/partial-ssrf. Its one finding (alert #309, notifications._post) is a false positive: the
# Telegram bot token goes into the URL PATH of a request whose host is a constant. _tg_api_url rebuilds
# the token from its regex-captured groups and takes the method from a fixed tuple, but the query
# does not accept that as a sanitizer (reworking _tg_api_url did not clear it).
#
# The exclusion is repo-wide, so it also hides any FUTURE partial-SSRF finding. This used to say _post
# was the only outbound-HTTP sink; that stopped being true when other modules started making requests.
# What the exclusion covers is therefore pinned instead. These are every outbound-HTTP call site in the
# shipped code (raw TCP probes such as hosts._tcp_reachable are not HTTP and are not listed), and
# tests/unit/part37.py fails on any new one until it is reviewed and listed here:
#   notifications._post               POST. Telegram or Discord: a URL on a constant host (the
#                                      _ALLOWED_PREFIXES check runs at the call), with the id and token
#                                      rebuilt from regex groups. ntfy (allow_configured_host): the
#                                      server an ADMIN configured, which must match _NTFY_URL_RE, i.e.
#                                      https://<host>[:port]/<topic> and nothing else.
#   notifications.telegram_get_updates GET on api.telegram.org via _tg_api_url, int-only query.
#   notifications.telegram_get_me      GET on api.telegram.org via _tg_api_url.
#   notifications._gateway_connector   The Discord command bot's WebSocket (websocket-client), to the
#                                      constant DISCORD_GATEWAY_URL, wss://gateway.discord.gg.
#   system_ops._ci_get_json            GET on api.github.com: the owner/repo of this checkout's own
#                                      origin remote, and a commit sha (its check runs, and the
#                                      workflow runs a schedule started on it).
#   lgsm_data._download                GET on raw.githubusercontent.com/GameServerManagers/LinuxGSM,
#                                      with a validated release tag and a LinuxGSM data filename.
#   lgsm_releases._open                GET on the fixed https://api.github.com/repos/GameServerManagers/
#                                      LinuxGSM/releases?per_page=20 (LinuxGSM's release notes), at most
#                                      once a day in the background. A size cap and a timeout.
#   game_icons._cmpd_http_get          GET on https://linuxgsm.com only (_cmpd_allowed_url runs at the
#                                      call: https, that one host, port 443, no userinfo), for the
#                                      servers index page and the game pictures under
#                                      /wp-content/uploads/ that it links. A size cap, a timeout, and
#                                      an opener that refuses every redirect.
#   modrinth._mdr_http_get             GET on https://api.modrinth.com (search, a project and its
#                                      versions, each id checked as eight base62 characters) and on
#                                      https://cdn.modrinth.com (a plugin file whose URL the API gave);
#                                      _mdr_allowed runs at the call (https, those hosts, port 443, no
#                                      userinfo). A size cap, a timeout, and an opener that refuses every
#                                      redirect; a file is kept only when its sha512 is the API's.
#   steam_workshop._wsc_http_post      POST on the fixed https://api.steampowered.com/ISteamRemoteStorage/
#                                      GetPublishedFileDetails/v1/ or GetCollectionDetails/v1/ (the method
#                                      from a fixed pair), a form of at most 100 ids of 1-20 digits. A
#                                      size cap, a timeout, and an opener that refuses every redirect.
#   breached_passwords._fetch_range    GET on the fixed https://api.pwnedpasswords.com/range/ plus the
#                                      first five hex characters of a SHA-1 (sha1_parts), never more.
#                                      Only when breach_check_online is not off. A size cap, a 3 s
#                                      timeout, and an opener that refuses every redirect.
#   geoip._get                         GET on https://db-ip.com (its download page) and
#                                      https://download.db-ip.com (the month's country database the page
#                                      links); _allowed runs at the call (https, those two hosts, port 443,
#                                      no userinfo), and the opener's handlers are public_https's. Only
#                                      while outside_dbip is not off, for a B3 add-on set to offline
#                                      geolocation. A size cap, a timeout; the file is kept only when its
#                                      SHA1 is the page's and it is an MMDB file.
#   addons_bluemap._get                GET on https://piston-meta.mojang.com only (Mojang's fixed version
#                                      list, then the version detail URL the list names, matched to
#                                      /v1/packages/<sha1>/<id>.json); _allowed runs at the call (https,
#                                      that host, port 443, no userinfo), and the opener's handlers are
#                                      public_https's. Only on a BlueMap install or update whose admin
#                                      accepted Mojang's EULA. A size cap, a timeout; the detail is used
#                                      only when its SHA-1 is the list's.
#   public_https.handlers              The handlers geoip._get and addons_bluemap._get build their opener
#                                      with: every redirect refused, no proxy, and a connect only when every
#                                      address the host name resolves to is public (webpush._connect_checked).
#   webpush._post                      POST (http.client, a _PushConnection) of an encrypted web-push
#                                      message to the endpoint a signed-in user's browser subscribed
#                                      with: https only, a host that parse_endpoint matched against the
#                                      fixed push services (PUSH_HOSTS and their suffixes), its path and
#                                      query rebuilt from that match. _connect_checked resolves the host
#                                      once and refuses the connect when any answer is not a public
#                                      unicast address (address_refused). No redirect is followed.
# One more speaks HTTP over a raw stream rather than through an HTTP client, so the query never sees it:
#   addon_web (routes/addon_web.py      The add-on page proxy: a request of a signed-in user's browser,
#   _ask, services/addon_web_http       relayed as HTTP/1.1 to 127.0.0.1 on the add-on's
#   send_request)                      host only, at the port its record names when the link is made, in
#                                      the server's own window of add-on ports (never one from the request).
#                                      The request target is the browser's path and query after
#                                      upstream_target refused anything but URL characters; only GET, HEAD
#                                      and POST are passed on, with the headers upstream_headers allows.
#                                      Its streams, tests/unit/part37.py's raw-stream list, all to that
#                                      loopback address: tunnel._local (socket.create_connection on the
#                                      panel's own host), tunnel._paramiko (an SSH direct-tcpip channel)
#                                      and tunnel._ssh_cli_argv (ssh -W, Tailscale hosts). Not HTTP and
#                                      sending nothing: hosts._tcp_reachable, the SSH-address reach test.
#   websites_egress.handle             A website's egress proxy (run as the site's own account, not by
#                                      the panel): a TCP connect to port 443 of a host on its fixed
#                                      list only, after every resolved address passed address_ok
#                                      (public unicast; no private, mapped or NAT64); TLS passes
#                                      through untouched, the proxy writes no request of its own.
# The three HTTP requests in notifications and the ones in game_icons, modrinth, steam_workshop,
# breached_passwords, webpush, geoip and addons_bluemap refuse every redirect (geoip and addons_bluemap, like
# webpush, connect only when every address the name resolves to is public: services/public_https.py).
# The three others use urlopen, which follows one, but only from GitHub's own fixed hosts. Of the fourteen, only webpush takes a host and path from a
# request (the add-on page proxy above takes a path, never a host), and only one parse_endpoint accepts as a known push service. The ntfy server is the one host
# an admin chooses: it is stored in config.json and read back later, a flow neither SSRF query traces,
# so _NTFY_URL_RE bounds it.
query-filters:
  - exclude:
      id: py/partial-ssrf

# Exclude py/cyclic-import: app.py imports panel/routes/*.py inside register_routes(), and those
# modules import names back from app.py at their top. That IS a cycle, reported 39 times, and it
# is deliberate rather than accidental — the route modules are imported LAZILY, after app.py's own
# body has finished, so nothing resolves early and no import order is fragile. It is what let 162
# handlers move with their bodies unchanged, which is what made the URL-map snapshot able to prove
# the move changed no route.
#
# It is a note-level QUALITY rule, not a security one, and excluding it costs no coverage of
# anything that could hurt. The cycle is thinning on its own as shared state moves to
# panel/routes/_shared.py, and the honest end state is app.py holding the
# factory and little else — at which point this exclusion should go.
  - exclude:
      id: py/cyclic-import
