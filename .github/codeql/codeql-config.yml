# Scope: everything but docs/ (prose and screenshots, no code) and one test file (below).
#
# tests/ IS analysed (security-and-quality, like the application). It used to be ignored as "not
# shipped", but the suites are where the panel's security properties are pinned, and a mistake in a
# test - a comparison that is always true, a result that is never asserted, a path outside the
# test's temp dir - makes a check pass while proving nothing, which nothing else would notice.
# A test's deliberate stand-ins are fixed or triaged where they are reported, not hidden here.
#
# tools/panel-helper (the root-run end of the sudo boundary) is Python with a shebang and no .py
# extension. The Python extractor still takes it: its traverser accepts a file with no extension
# whose first line is a Python shebang (semmle/traverser.py base_filter, modules.is_script). That is
# not taken on trust: codeql.yml fails the Python analysis when the helper is missing from the
# database it analysed.
#
# One test file is left out, tests/smoke_test.py, for time alone. It is a single 1 MB module of
# top-level code, and the Python extractor took 1,446 s (24 minutes) on it alone, measured by a
# probe run with no time limit: the whole Python analysis took 50 minutes with it and 9.5 without.
# The next largest file, the 750 KB tests/unit/part06.py, takes about 2 minutes. Bandit, Semgrep
# (which reads it whole: see security-code.yml) and SonarCloud still analyse it.
name: "linuxgsm-panel CodeQL config"

paths-ignore:
  - docs
  - tests/smoke_test.py

# Exclude py/partial-ssrf. Its one finding (alert #309, notifications._post) is a false positive: the
# Telegram bot token goes into the URL PATH of a request whose host is a constant. _tg_api_url rebuilds
# the token from its regex-captured groups and takes the method from a fixed tuple, but the query
# does not accept that as a sanitizer (reworking _tg_api_url did not clear it).
#
# The exclusion is repo-wide, so it also hides any FUTURE partial-SSRF finding. This used to say _post
# was the only outbound-HTTP sink; that stopped being true when other modules started making requests.
# What the exclusion covers is therefore pinned instead. These are every outbound-HTTP call site in the
# shipped code (raw TCP probes such as hosts._tcp_reachable are not HTTP and are not listed), and
# tests/unit/part37.py fails on any new one until it is reviewed and listed here:
#   notifications._post               POST. Telegram or Discord: a URL on a constant host (the
#                                      _ALLOWED_PREFIXES check runs at the call), with the id and token
#                                      rebuilt from regex groups. ntfy (allow_configured_host): the
#                                      server an ADMIN configured, which must match _NTFY_URL_RE, i.e.
#                                      https://<host>[:port]/<topic> and nothing else.
#   notifications.telegram_get_updates GET on api.telegram.org via _tg_api_url, int-only query.
#   notifications.telegram_get_me      GET on api.telegram.org via _tg_api_url.
#   notifications._gateway_connector   The Discord command bot's WebSocket (websocket-client), to the
#                                      constant DISCORD_GATEWAY_URL, wss://gateway.discord.gg.
#   system_ops._ci_fetch_page          GET on api.github.com: the owner/repo of this checkout's own
#                                      origin remote, and a commit sha.
#   lgsm_data._download                GET on raw.githubusercontent.com/GameServerManagers/LinuxGSM,
#                                      with a validated release tag and a LinuxGSM data filename.
# The three HTTP requests in notifications go through _OPENER, which refuses every redirect. The two
# others use urlopen, which follows one, but only from GitHub's own fixed hosts. None of the six takes
# a host or a path from a request. The ntfy server is the one host anyone chooses: it is stored in
# config.json and read back later, a flow neither SSRF query traces, so _NTFY_URL_RE bounds it.
query-filters:
  - exclude:
      id: py/partial-ssrf

# Exclude py/cyclic-import: app.py imports panel/routes/*.py inside register_routes(), and those
# modules import names back from app.py at their top. That IS a cycle, reported 39 times, and it
# is deliberate rather than accidental — the route modules are imported LAZILY, after app.py's own
# body has finished, so nothing resolves early and no import order is fragile. It is what let 162
# handlers move with their bodies unchanged, which is what made the URL-map snapshot able to prove
# the move changed no route.
#
# It is a note-level QUALITY rule, not a security one, and excluding it costs no coverage of
# anything that could hurt. The cycle is thinning on its own as shared state moves to
# panel/routes/_shared.py (six globals already), and the honest end state is app.py holding the
# factory and little else — at which point this exclusion should go.
  - exclude:
      id: py/cyclic-import
