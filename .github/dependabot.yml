version: 2
updates:
  # Python dependencies in requirements.txt — opens a PR when a newer (or
  # security-patched) version is available.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Batch all Python bumps into ONE weekly PR instead of one per package, so they
      # don't trickle in and hit the open-PR limit.
      python-dependencies:
        patterns: ["*"]
    # Dependabot resolves as the Python named by the `python_version >= "3.10"` marker on flask in
    # requirements.txt, and so never proposes a release that cannot install on Ubuntu 22.04 (3.10).
    # The ignore below is a backstop for the release that prompted it: bidict 0.24 needs 3.11.
    # Drop both when 3.10 support ends.
    ignore:
      - dependency-name: "bidict"
        versions: [">=0.24"]

  # Keep the GitHub Actions themselves current (this is what clears the
  # "Node.js 20 is deprecated" runner warning once new majors ship).
  # The CI tool pins (hash-locked): the Bandit job holds security-events: write, so its tools are
  # pinned, and bumped here like everything else rather than floating to whatever is newest.
  # Resolved as the Python of the `python_version` marker on bandit in bandit.txt: the job's 3.11.
  - package-ecosystem: "pip"
    directory: "/.github/ci-requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["ci"]
    groups:
      ci-python-tools:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
    groups:
      github-actions:
        patterns: ["*"]
