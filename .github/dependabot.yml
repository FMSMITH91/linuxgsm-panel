version: 2
updates:
  # Python dependencies — opens a PR when a newer (or security-patched) version is available.
  # requirements.txt is pip-compile's hashed lockfile for requirements.in beside it, so Dependabot
  # updates it by re-running pip-compile: the whole set resolved together, hashes regenerated.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Batch all Python bumps into ONE weekly PR instead of one per package, so they
      # don't trickle in and hit the open-PR limit.
      python-dependencies:
        patterns: ["*"]
    # It compiles on the Python the lockfile's header names (3.10, the oldest supported), and so
    # never proposes a release that cannot install on Ubuntu 22.04. The ignore below is a backstop
    # for the release that prompted it: bidict 0.24 needs 3.11. Drop it, and recompile on the new
    # oldest Python, when 3.10 support ends.
    ignore:
      - dependency-name: "bidict"
        versions: [">=0.24"]

  # Keep the GitHub Actions themselves current (this is what clears the
  # "Node.js 20 is deprecated" runner warning once new majors ship).
  # The CI tool pins (hash-locked): the Bandit job holds security-events: write, so its tools are
  # pinned, and bumped here like everything else rather than floating to whatever is newest.
  # Each .txt here is pip-compile's lockfile for the .in beside it, so Dependabot updates it by
  # re-running pip-compile — resolving the whole set, on the Python the header names (3.11) — rather
  # than bumping pins one by one past what the tool itself allows (semgrep pins click, for one).
  - package-ecosystem: "pip"
    directory: "/.github/ci-requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["ci"]
    groups:
      ci-python-tools:
        patterns: ["*"]

  # The test matrix's tools (flake8, esprima), which run on 3.10 as well: pip-compile lockfiles
  # like the above, compiled on 3.10. A sibling of ci-requirements, not inside it, because a
  # directory's Dependabot scan also reads the files one level below it.
  - package-ecosystem: "pip"
    directory: "/.github/ci-requirements-checks"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["ci"]
    groups:
      ci-check-tools:
        patterns: ["*"]

  # gamedig, the player-query tool every host runs. tools/gamedig/package-lock.json is the whole
  # tree, with a sha512 per package that `npm ci` checks (install-gamedig.sh), and it moves ONLY
  # through these pull requests — the hosts no longer fetch whatever the registry serves. Version
  # updates bump gamedig itself; its dependencies move through security updates.
  #   cooldown: a release has to have been out a week before it is proposed, so one pulled in its
  #     first days (the usual shape of a hijacked package) never reaches a PR. Security updates are
  #     not delayed by it.
  #   ignore semver-major: the panel's query types (GAMEDIG_TYPE, the jq filters on its JSON) are
  #     written for gamedig 5. A 6 is a deliberate port, not a weekly bump.
  - package-ecosystem: "npm"
    directory: "/tools/gamedig"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "gamedig"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
    groups:
      github-actions:
        patterns: ["*"]
