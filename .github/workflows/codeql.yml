name: CodeQL

# GitHub's semantic code analysis — deeper than the pattern-based bandit/semgrep
# in security.yml. Finds data-flow bugs (injection, path traversal, etc.) and
# reports them in the repo's Security tab.

on:
  # Docs-only pushes/PRs skip CodeQL — it analyses code (python/js) and the workflows
  # (actions), none of which a markdown/LICENSE edit changes. Anything else still runs it.
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allow manual runs from the Actions tab
  # Weekly as well: push and PR runs only analyse code that changed hands, so newly published
  # CodeQL queries and query-pack fixes would otherwise not reach a week with no pushes.
  schedule:
    - cron: '23 5 * * 1'

# The event is part of the group: on main, the Monday scheduled run shares the ref with a push
# run, and without it the schedule CANCELLED an in-progress push run, leaving "cancelled" required
# checks on that commit, which the panel's update gate and deploy.yml read as a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the whole workflow; the analyze job escalates only the
# scopes CodeQL actually needs (security-events: write). Satisfies Scorecard's
# Token-Permissions "define a top-level permissions block" check.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Code scanning uploads only work on public repos (or private w/ GitHub Advanced
    # Security). While the repo is private these jobs are SKIPPED (grey), not failed; they
    # activate automatically once the repo is made public.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write   # init and analyze upload the results to code scanning
      actions: read            # the upload's look-up of this run, as GitHub's CodeQL template grants
      contents: read
    # FULL analysis on pull requests, not diff-informed. By default the action analyses a PR only
    # on the lines it changes ("Computing PR diff ranges..."), so an alert a PR causes on a line
    # it did NOT touch reaches main unseen: #387 removed the last use of a global it left alone,
    # its PR gate read 0 alerts, and main went red on py/unused-global-variable. The PR alert gate
    # below must judge what main will judge. Feature flag: codeql-action src/feature-flags.ts.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    strategy:
      fail-fast: false   # one language's analysis failing must not block the others
      matrix:
        include:
          - language: python
            name: python
          # JavaScript/TypeScript — covers the inline <script> in the Jinja templates and any .js.
          - language: javascript-typescript
            name: javascript
          # GitHub Actions — scans the workflow files themselves for CI security issues
          # (script injection, untrusted checkout, over-broad permissions, etc.).
          - language: actions
            name: actions
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # init and analyze take the token as an input; nothing uses it through git.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml   # tests included; see the file for its scope

      # Analysed here, uploaded below, and ONLY when the analysis is complete: the analyze step
      # succeeded, its database holds the files it must (next step), and its SARIF says every query
      # ran (the step after). `upload: never` also stops the init action's post step uploading a
      # "failed run" SARIF when this job fails or is cancelled: it reads this input and skips (its
      # source: init-action-post-helper.ts, prepareFailedSarif). Before #406 that upload ran, and
      # refs/pull/406/merge holds four Python analyses with no results and no rules from runs that
      # never finished; code scanning lists one as the commit's analysis like any other, so an
      # alert gate could have read "0 alerts" from it. The gates refuse such rows as well
      # (.github/scripts/code_scanning_analyses.py, failed_run).
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      # The extractor decides which files it reads, and an analysis that silently left a file out
      # reports it as clean. tools/panel-helper, the root-run privileged helper, has no .py extension
      # (it is taken for its shebang); tests/ was out of scope until it was added; and the smoke
      # suite was left out whole until it was split into parts small enough to extract. Each
      # language's must-have files are read back from the source archive of the database that was
      # analysed: a file missing from it fails the job, by name, and nothing is uploaded. The smoke
      # parts are globbed from the checkout, so a part added later is required too.
      - name: The analysed database holds the files it must
        id: extracted
        env:
          DB_LOCATIONS: ${{ steps.analyze.outputs.db-locations }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          # {"<language>": "<path>"}: one language per job here, so the one entry is this job's.
          db="$(jq -r 'to_entries[0].value | if type == "array" then .[0] else . end // empty' <<<"${DB_LOCATIONS}")"
          if [ -z "${db}" ] || [ ! -f "${db}/src.zip" ]; then
            echo "::error::no ${LANGUAGE} database source archive (db-locations: ${DB_LOCATIONS})"
            exit 1
          fi
          python3 - "${db}/src.zip" "${LANGUAGE}" <<'PY'
          import glob
          import sys
          import zipfile

          names = {n.rstrip("/") for n in zipfile.ZipFile(sys.argv[1]).namelist()}
          must = {
              "python": ["tools/panel-helper", "app.py", "tests/unit_test.py", "tests/unit/part01.py",
                         "tests/smoke_test.py"] + sorted(glob.glob("tests/smoke/part*.py")),
              "javascript-typescript": ["static/js/panel.js", "static/js/dashboard.js"],
              "actions": [".github/workflows/codeql.yml"],
          }[sys.argv[2]]
          missing = [p for p in must if not any(n.endswith("/" + p) for n in names)]
          print("source archive: %d files" % len(names))
          if missing:
              print("::error::not in the analysed %s database: %s" % (sys.argv[2], ", ".join(missing)))
              sys.exit(1)
          print("analysed: %s" % ", ".join(must))
          if sys.argv[2] == "python":
              print("...and %d files under tests/" % sum("/tests/" in n for n in names))
          PY

      # Two rules are dropped for tests/ ONLY, every instance of each having been read first:
      #   py/file-not-closed (311 in tests/): each one a one-shot open(...).read() or .write(...)
      #     whose file object CPython closes as the expression ends; none holds a file open.
      #   py/overly-permissive-file (39): each a chmod inside the test's own temp dir, of a stand-in
      #     program, a deliberately loose directory the code under test must refuse, or a setuid bit
      #     a restore must strip. Bandit's B103 and Semgrep's insecure-file-permissions still gate
      #     every one of those lines, each marked with its reason, so a new chmod is still read.
      # Both stay on for every other path, and every other rule stays on for tests/.
      #
      # Each SARIF must also be a COMPLETE analysis before it goes anywhere: at least one run, the
      # queries it ran listed (CodeQL lists them as rules, under tool.extensions: 170 for Python),
      # and no invocation that reports itself unsuccessful. A "failed run" SARIF has no rules.
      - name: Leave out two deliberate test patterns (tests/ only)
        id: sarif
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the analysis wrote no SARIF; nothing to upload"
            exit 1
          fi
          for f in "${files[@]}"; do
            runs="$(jq '.runs | length' "$f")"
            rules="$(jq '[.runs[].tool | (.driver.rules // [])[], (.extensions // [])[].rules[]?] | length' "$f")"
            failed="$(jq '[.runs[].invocations[]? | select(.executionSuccessful == false)] | length' "$f")"
            if [ "${runs}" = "0" ] || [ "${rules}" = "0" ] || [ "${failed}" != "0" ]; then
              echo "::error::$f is not a complete analysis (runs=${runs}, rules=${rules}, unsuccessful invocations=${failed}); not uploading it"
              exit 1
            fi
            jq '.runs |= map(.results |= map(select(
                  ((.ruleId | IN("py/file-not-closed", "py/overly-permissive-file"))
                   and (.locations[0].physicalLocation.artifactLocation.uri | startswith("tests/")))
                  | not)))' "$f" > "$f.kept"
            echo "$f: ${rules} rules; kept $(jq '[.runs[].results[]] | length' "$f.kept") of $(jq '[.runs[].results[]] | length' "$f") results"
            mv "$f.kept" "$f"
          done

      # Spelled out, though a step runs only after the ones before it succeeded: this is the line
      # that decides whether an incomplete analysis reaches code scanning, so it says so itself.
      - name: Upload the results to code scanning
        if: ${{ success() && steps.analyze.outcome == 'success' && steps.extracted.outcome == 'success' && steps.sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"

  # ── The PR half of the alert gate ────────────────────────────────────────────────────────────
  # codeql-alerts.yml already asks "does this ref carry an open alert?", and its `if:` reads as
  # though it covers pull requests. It does not: it is a workflow_run job, and a workflow_run
  # result is not posted as a check on the PR's head commit, so the check is absent from every PR.
  # Measured across #171, #175, #177 and #179 — zero of them carried it.
  #
  # That is not theoretical. #177 merged 27/27 green and turned main red minutes later on two
  # py/unused-global-variable alerts that were ALREADY on refs/pull/177/merge, uploaded before the
  # merge. The information was there; nothing on the PR asked for it.
  #
  # This job asks on the PR itself, in the same workflow as the analysis, so it lands as an
  # ordinary PR check. The main gate in codeql-alerts.yml stays as the backstop.
  #
  # It reads the alerts only once code scanning holds THIS merge commit's analysis in every category
  # that feeds them: CodeQL's three languages, Bandit and Semgrep, which upload from
  # security-code.yml, and zizmor, which uploads from zizmor.yml. `needs: analyze` orders this job
  # after CodeQL alone; nothing orders it after the other workflows. It used to poll for ANY
  # analysis of the ref, which after a PR's first push is
  # always there (the previous push's), so on #385 it read the alerts 13 s before that commit's
  # Semgrep analysis landed and passed on the old one. The categories, and the wait, are
  # .github/scripts/code_scanning_analyses.py, shared with the main gate (codeql-alerts.yml).
  pr-alerts:
    name: Open code-scanning alerts (PR)
    if: github.event_name == 'pull_request'
    needs: analyze
    runs-on: ubuntu-latest
    # The wait below allows ten minutes for the other workflows' uploads; the rest is margin.
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read   # the merge ref's code-scanning analyses and open alerts
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # nothing here pushes; gh takes the token from GH_TOKEN
          sparse-checkout: .github/scripts/code_scanning_analyses.py
          sparse-checkout-cone-mode: false

      # On pull_request, github.sha is the merge commit, the commit every upload for this run is
      # filed under. A category with no analysis of it after ten minutes fails the job, naming it:
      # "No analysis" is never treated as "no alerts", which is the failure this gate exists to
      # avoid. So does a later push's analysis being the newest: the alerts are then that push's.
      - name: Wait for this merge commit's analysis in every category
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/code_scanning_analyses.py --ref "${REF}" --sha "${SHA}" \
            --event pull_request --tries 60 --interval 10

      - name: Judge refs/pull/<n>/merge
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          alerts="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${REF}&state=open&per_page=100" \
                     --jq '[.[] | {rule: .rule.id, sev: (.rule.security_severity_level // .rule.severity // "-"), path: .most_recent_instance.location.path, line: .most_recent_instance.location.start_line}]')"
          n="$(printf '%s' "$alerts" | jq 'length')"
          {
            echo "### CodeQL alerts on \`${REF}\`"
            echo ""
            if [ "${n}" = "0" ]; then
              echo "No open alerts."
            else
              echo "| severity | rule | location |"
              echo "| --- | --- | --- |"
              printf '%s' "$alerts" | jq -r '.[] | "| \(.sev) | `\(.rule)` | \(.path):\(.line) |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${n}" != "0" ]; then
            echo "::error::this pull request carries ${n} open code-scanning alert(s) — see the job summary." >&2
            exit 1
          fi
          echo "clean: ${REF} carries no open code-scanning alerts."
