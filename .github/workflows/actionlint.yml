name: Actionlint

# Static analysis of the GitHub Actions workflow files THEMSELVES. actionlint catches shell
# injection via untrusted ${{ github.event.* }} interpolated into run: steps, invalid/deprecated
# workflow syntax, bad globs/refs, and — through its built-in shellcheck — real bugs in the
# embedded run: scripts. Complements CodeQL's semantic "actions" analysis and the standalone-.sh
# shellcheck that already runs in CI.

on:
  # actionlint only lints the workflow YAML, so only run it when a workflow actually changes —
  # no point spinning it up on a code or docs push.
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      # ...and the lint's OWN config: a malformed .github/actionlint.yaml makes actionlint
      # itself fail, so editing it must run the lint.
      - '.github/actionlint.yaml'
  # Every pull request, unfiltered: it is a required check (.github/required-checks.txt), and a
  # required check whose workflow did not run holds the pull request forever. It takes seconds.
  pull_request:
    branches: [ main ]

# Least-privilege default; the job below escalates only to post its check-run annotations.
# Supersede rather than stack: Only the newest push's workflow lint is of any interest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # no checks: write — nothing posts annotations now; the job's own exit says it
      pull-requests: read   # the scope step lists the pull request's files
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # actionlint reads local files only; no step here needs the job token.
          persist-credentials: false
      # A pull request that changes only documentation passes here without the steps below, and
      # still reports this job by its name, as a required check must: .github/scripts/pr_scope.py
      # says what counts and why. Anything else, and anything it cannot establish, runs them all.
      - name: Does this pull request change anything but documentation?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/pr_scope.py --event "$EVENT" --repo "$GITHUB_REPOSITORY"
          --pr "$PR" --head-sha "$HEAD_SHA"

      # The BINARY, pinned and checksummed, rather than a wrapper action. Two reasons, both found
      # by auditing what this gate actually proves:
      #
      #  1. reviewdog/action-actionlint's entrypoint is
      #        actionlint -oneline ${FLAGS} | while read -r r; do … done | reviewdog …
      #     with no `pipefail`. If ACTIONLINT ITSELF fails — and a malformed
      #     .github/actionlint.yaml (this repo has one) is enough — it prints nothing, reviewdog
      #     sees zero findings and exits 0, and the check is green having linted nothing.
      #     Reproduced locally with actionlint stubbed to fail: "reviewdog: 0 findings", exit 0.
      #     Pinning the action did not fix that and neither did bumping it.
      #
      #  2. v1.75.0 moved the actionlint build from rhysd/actionlint (the canonical project) to
      #     kjanat/actionlint — a fork created 2026-08-07 with 26 stars — and to a version number
      #     that does not exist upstream. That may well be a reasonable call for them; it is not a
      #     trust decision this repo needs to inherit for a gate that lints its own workflows.
      #
      # Renovate proposes each bump (.github/renovate.json): VERSION (the release tag) and SHA256
      # together, the checksum taken from the release's own actionlint_<v>_checksums.txt.
      - name: actionlint
        if: steps.scope.outputs.docs_only != 'true'
        env:
          # renovate: datasource=github-release-attachments depName=rhysd/actionlint
          VERSION: 'v1.7.12'
          SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          TARBALL="actionlint_${VERSION#v}_linux_amd64.tar.gz"
          curl --proto '=https' -sSfL -o "/tmp/${TARBALL}" \
            "https://github.com/rhysd/actionlint/releases/download/${VERSION}/${TARBALL}"
          echo "${SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xz -C /tmp -f "/tmp/${TARBALL}" actionlint
          /tmp/actionlint -version
          # The embedded run: scripts are linted by shellcheck, and only when actionlint FINDS it:
          # a failed lookup is logged under -verbose alone ('Rule "shellcheck" was disabled'), and
          # the lint goes on over YAML and expressions and exits 0 (linter.go, v1.7.12). Naming a
          # path with -shellcheck= fails the same way. So find it here, or fail.
          sc="$(command -v shellcheck)" || {
            echo "::error::shellcheck is not on this runner, so actionlint would lint no run: script and pass"
            exit 1
          }
          "${sc}" --version
          # ...and prove it is used: a workflow with a known SC2086 must fail the lint.
          ctl="$(mktemp -d)"
          mkdir -p "${ctl}/.github/workflows"
          # shellcheck disable=SC2016 # the unexpanded $1 IS the control's defect
          printf '%s\n' 'on: push' 'jobs:' '  control:' '    runs-on: ubuntu-latest' '    steps:' \
            '      - run: echo $1' > "${ctl}/.github/workflows/control.yml"
          if out="$(/tmp/actionlint -no-color -shellcheck="${sc}" "${ctl}/.github/workflows/control.yml" 2>&1)" \
              || ! grep -q 'SC2086' <<< "${out}"; then
            printf '%s\n' "${out}"
            echo "::error::actionlint did not report the control workflow's SC2086: its shellcheck pass is not running"
            exit 1
          fi
          # No pipe, so a failure in actionlint is the step's failure.
          /tmp/actionlint -color -shellcheck="${sc}"
