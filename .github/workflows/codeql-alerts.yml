name: Code-scanning alerts

# Fail a ref when it carries an open code-scanning alert — main AFTER a merge, and a pull
# request BEFORE one. See the note on the job for why the PR half exists.
#
# WHY THIS RUNS ON workflow_run AND NOT ON push
#   It used to be a job in security.yml, triggered by the same push as CodeQL — so the two ran
#   CONCURRENTLY, and this one asked the alerts API whether main was clean before CodeQL had
#   finished deciding. Measured on the commit that exposed it:
#
#       open-alerts gate   19:41:31 -> 19:41:35   (queried the API after four seconds)
#       CodeQL analyse     19:41:31 -> 19:42:57
#       the alert closed   19:42:44
#
#   The gate reported main as dirty 69 seconds before CodeQL closed the very alert that the pushed
#   commit had fixed. Both directions of that race are wrong, and the second one is worse:
#
#     * a push that FIXES an alert fails this gate, for nothing;
#     * a push that INTRODUCES one PASSES it, because CodeQL has not reported yet — and the alert
#       is then blamed on whatever lands next. That is the "an alert sits open across green
#       builds" failure this gate exists to prevent, moved along by one commit rather than fixed.
#
#   Waiting for CodeQL to complete on the same commit is the only way to read a settled answer, so
#   the trigger is CodeQL's completion. Same pattern deploy.yml uses to wait for CI.
#
#   CodeQL is path-filtered and skips docs-only pushes, so this skips them too — correctly: with no
#   code change there is nothing for the alert set to have become.
#
#   "Security scan (code)" and "Security scan (workflows)" are triggers too: Bandit and Semgrep
#   upload their SARIF to code scanning from the first, zizmor from the second, and the same race
#   applies to them. A run that finds another of the three workflows still running for the same
#   commit posts nothing; the one that finishes last judges the settled alert set (see "Wait for the
#   other uploaders").
#
# WHERE THE VERDICT LANDS
#   GitHub files a workflow_run job's check run under the default branch's NEWEST commit, not the
#   commit that triggered it. So this job's own result said nothing about the commit it judged —
#   it landed on whatever main's tip was by then — and the panel's update gate
#   (panel/ops/system_ops.py, _remote_ci_state) could offer a commit whose alerts check had not
#   even been judged. The verdict is therefore POSTED, as a check run named "Open code-scanning
#   alerts", on the head_sha of the run that triggered this — and the gate requires that check to
#   be present. The job itself is named differently, and the gate ignores it (_CI_IGNORE).
on:
  workflow_run:
    workflows: [ "CodeQL", "Security scan (code)", "Security scan (workflows)" ]
    types: [ completed ]
  workflow_dispatch:
  # zizmor: ignore[dangerous-triggers] judges main only, reads the API and runs only main's own script

permissions:
  contents: read

concurrency:
  # Keyed by WHAT is being judged: the event kind, the repository the head came from, and the
  # branch. The branch alone was not enough — a workflow_run for a FORK's pull request carries the
  # fork's branch name (deploy.yml notes the same), and a fork's default branch is main, so a fork
  # PR opened from it joined `codeql-alerts-main`. GitHub keeps one PENDING run per group and
  # cancels the older one even with cancel-in-progress: false, so that PR could cancel a queued
  # main gate: that commit's alerts were never judged, and a new one was blamed on the next push.
  group: >-
    codeql-alerts-${{ github.event.workflow_run.event || github.event_name
    }}-${{ github.event.workflow_run.head_repository.full_name || github.repository
    }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  open-alerts:
    # MAIN ONLY — the pull-request half lives in codeql.yml (`pr-alerts`).
    #   This job once also judged pull requests, at refs/pull/<n>/merge, so a PR that would turn main
    #   red turned itself red instead. It could not: a workflow_run job's check is not posted on the
    #   PR's head commit, so it was absent from every PR (codeql.yml's pr-alerts, posted on the PR
    #   itself, replaced it). What it DID do is worse. GitHub files a workflow_run job's result on
    #   the default branch's newest commit, so a PR with open alerts marked MAIN's tip failing —
    #   and the panel's update gate (panel/ops/system_ops.py, _remote_ci_state) reads every check
    #   on that commit, so every install stopped being offered main's newest version until the
    #   next merge. f21a2f2 carries two such failures, from #177's runs. So the PR arm is gone:
    #   PRs are judged on the PR, and this judges main.
    #
    #   NOT named "Open code-scanning alerts" any more: that is the name of the check this job
    #   POSTS on the commit it judged (last step). The job's own run still lands on main's tip,
    #   where it describes some other commit; the panel's gate ignores it by this name (_CI_IGNORE
    #   in system_ops.py — a unit test holds the two equal), and deploy.yml's verify step too.
    name: Code-scanning alerts gate
    #
    #   The workflow_dispatch arm is separate because on a manual run `github.event.workflow_run`
    #   is undefined: the property access yields null, `null == 'success'` is false, and the job
    #   was SKIPPED — reporting success and judging nothing. The manual entry point had never once
    #   run (173 workflow_run runs, 0 workflow_dispatch).
    #
    #   SCHEDULED runs are judged too. CodeQL's weekly run exists to apply newly published queries to
    #   code that has not changed, security-code.yml's re-runs Bandit and Semgrep, and zizmor.yml's
    #   re-runs zizmor's online audits; an alert any of them opens lands on main with no push.
    #   Skipped here, main's head kept its push-time success, the
    #   panel kept offering it, and the alert first surfaced as a red check on an unrelated PR.
    #   A scheduled run's head_branch is main and its head_sha is main's head, the commit it analysed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read   # the code-scanning analyses and alerts of the judged ref
      actions: read    # "Wait for the other uploaders" lists the other workflows' runs
      checks: write    # the verdict is posted as a check run on the judged commit
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve which ref to judge
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Falls back to this workflow's own ref on a manual run, where workflow_run is undefined
          # and WR_BRANCH would be empty — which built `ref=refs/heads/` and asked about nothing.
          WR_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          # The same name with no fallback, for the exact comparison below (deploy.yml's verify
          # step takes it the same way). With the fallback, an empty head_branch read as main.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The job's `if` compared head_branch with 'main' the way GitHub compares strings:
          # IGNORING CASE, and by SHORT name. So a branch `Main`, or a tag `main` or `MAIN`, pushed
          # with a commit carrying its own workflow named "CodeQL", passed it and was judged as
          # main. Read-only, but a gate must not report on main for a run that was not main's.
          # Compared here exactly, in bash; a manual run is not about head_branch.
          # (A tag named exactly `main` still shares main's concurrency group, which GitHub also
          # compares ignoring case, so it can replace a PENDING main gate. `queue: max` would stop
          # that, but actionlint 1.7.12, which CI pins, rejects the key; revisit when it doesn't.)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${HEAD_BRANCH:-}" != "main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::head_branch '${HEAD_BRANCH:-}' is not exactly main; nothing was judged."
            exit 0
          fi
          {
            echo "ref=refs/heads/${WR_BRANCH}"
            echo "label=\`${WR_BRANCH}\`"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      # Three workflows upload to code scanning for a push — CodeQL (codeql.yml), Bandit + Semgrep
      # (security-code.yml) and zizmor (zizmor.yml) — and each one's completion triggers this. The
      # first to finish would judge an alert set the others have not reported into yet: the race
      # this workflow exists to avoid, one uploader along. So a run that finds ANOTHER of them still
      # going for the same commit posts nothing; the last one's completion triggers the run that
      # judges. A commit one of them never ran for (none found) does not wait. A manual run judges
      # at once. The list is code_scanning_analyses.py's CATEGORIES' workflows (a unit check holds
      # the two equal).
      # The other workflows' runs are looked up for this commit under BOTH events that reach the
      # gate, push and schedule, whichever event triggered this one. Looking only under its own
      # event, a scheduled run for a commit just pushed missed another workflow's push run still
      # uploading, and judged its predecessor's analyses as this commit's (review finding E5). A
      # pull_request run never counts: its commit is a merge commit, and its completion judges
      # nothing here, so waiting on one could leave a commit unjudged.
      - name: Wait for the other uploaders
        id: settled
        if: steps.ref.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_run" ]; then
            echo "judge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for wf in codeql.yml security-code.yml zizmor.yml; do
            for ev in push schedule; do
              open="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${WR_SHA}&event=${ev}&per_page=20" \
                        --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
              if [ "${open}" != "0" ]; then
                echo "judge=false" >> "$GITHUB_OUTPUT"
                echo "::notice::${wf}'s ${ev} run is still running for ${WR_SHA} (this run was ${WR_NAME}'s ${WR_EVENT} run); its completion judges this commit."
                exit 0
              fi
            done
          done
          echo "judge=true" >> "$GITHUB_OUTPUT"

      # The category list and the wait for them, shared with codeql.yml's pr-alerts. This is main's
      # own tree: a workflow_run job runs the default branch's workflow, and checks out its head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.ref.outputs.skip != 'true' && steps.settled.outputs.judge == 'true'
        with:
          persist-credentials: false   # nothing here pushes; gh takes the token from GH_TOKEN
          sparse-checkout: .github/scripts/code_scanning_analyses.py
          sparse-checkout-cone-mode: false

      - name: Fail if that ref has open code-scanning alerts
        id: judge
        if: steps.ref.outputs.skip != 'true' && steps.settled.outputs.judge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
          LABEL: ${{ steps.ref.outputs.label }}
          # The commit being judged: the triggering run's head, or this run's own commit when run
          # by hand.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # What triggered this (push or schedule; empty on a manual run), and that run's workflow
          # file: a scheduled run re-analyses with that one workflow only.
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          # An analysis OF THIS COMMIT in every category, each the newest in its category, before
          # any alert is read. The alert list is the ref's CURRENT set, the newest analysis in each
          # category, and [] reads as clean whether or not anything was analysed. "Any analysis of
          # main" was true of every commit after the first, and the `sha=` this step once sent is
          # not a parameter of the analyses list (GitHub ignores it), so "no analysis of this
          # commit" could never fire: one category still holding the predecessor's upload was
          # judged as this commit's. The script reads each row's commit_sha itself.
          #   0  every category's newest analysis is this commit's: read the alerts.
          #   3  a later push's analysis is the newest somewhere: its alerts are that commit's,
          #      and judged on them a commit whose alert the later push fixed passed. Not judged.
          #   else  a category has no analysis of this commit after five minutes: fail.
          analyses="$(mktemp)"
          rc=0
          python3 .github/scripts/code_scanning_analyses.py --ref "${REF}" --sha "${SHA}" \
            --event "${WR_EVENT}" --workflow "${WR_PATH}" --tries 30 --interval 10 \
            > "${analyses}" || rc=$?
          cat "${analyses}"
          {
            echo "### Open code-scanning alerts on ${LABEL} at \`${SHA:0:10}\`"
            echo ""
            echo '```'
            grep -v '^::' "${analyses}" || true
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${rc}" -eq 3 ]; then
            # Neither clean nor dirty: SKIPPED. The update gate does not count a skipped check as
            # present, so the commit is simply never offered — the later one is judged on its own.
            echo ":warning: \`${REF}\` has moved on, so its alerts say nothing about this commit." >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${rc}" -ne 0 ]; then
            echo ":warning: Code scanning has no analysis of \`${SHA}\` in every category on \`${REF}\`, so this proves nothing." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no code-scanning analysis of ${SHA} on ${REF} in every category — refusing to report it clean." >&2
            exit 1
          fi
          # ?state=open and ?ref= are both server-side; ask for the rows rather than paging all.
          alerts="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=${REF}&per_page=100" \
                     --jq '[.[] | {rule: .rule.id, sev: (.rule.security_severity_level // .rule.severity // "-"), path: .most_recent_instance.location.path, line: .most_recent_instance.location.start_line}]')"
          n="$(printf '%s' "$alerts" | jq 'length')"
          {
            if [ "$n" -eq 0 ]; then
              echo "None. :white_check_mark:"
            else
              echo "| severity | rule | location |"
              echo "| --- | --- | --- |"
              printf '%s' "$alerts" | jq -r '.[] | "| \(.sev) | `\(.rule)` | \(.path):\(.line) |"'
              echo ""
              echo "A dismissed alert can reappear here UNDISMISSED if its file moved — GitHub keys"
              echo "dismissals partly on path. Check the Security tab for the same rule at the old"
              echo "path before treating it as a new finding."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -ne 0 ]; then
            echo "::error::${LABEL} has $n open code-scanning alert(s) — see the job summary." >&2
            exit 1
          fi
          echo "verdict=success" >> "$GITHUB_OUTPUT"
          echo "No open code-scanning alerts on ${LABEL}."

      # The verdict, on the commit it is about (see WHERE THE VERDICT LANDS at the top). Runs when
      # the judge step FAILED too — a failure that is never posted leaves the commit merely
      # unjudged, where a failing check says why.
      - name: Post the verdict on the judged commit
        if: >-
          always() && steps.ref.outputs.skip != 'true' && steps.settled.outputs.judge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OUTCOME: ${{ steps.judge.outcome }}
          VERDICT: ${{ steps.judge.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "${OUTCOME}:${VERDICT}" in
            success:success) conclusion=success; title="No open code-scanning alerts" ;;
            success:skipped) conclusion=skipped; title="Not judged: main has moved on" ;;
            *)               conclusion=failure; title="Open code-scanning alerts, or no analysis to judge" ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Open code-scanning alerts" -f head_sha="${SHA}" \
            -f status=completed -f conclusion="${conclusion}" \
            -f details_url="${RUN_URL}" \
            -f "output[title]=${title}" -f "output[summary]=See ${RUN_URL} for the list." >/dev/null
          echo "Posted '${conclusion}' on ${SHA}."
