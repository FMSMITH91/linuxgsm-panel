name: Code-scanning alerts

# Fail a ref when it carries an open code-scanning alert — main AFTER a merge, and a pull
# request BEFORE one. See the note on the job for why the PR half exists.
#
# WHY THIS RUNS ON workflow_run AND NOT ON push
#   It used to be a job in security.yml, triggered by the same push as CodeQL — so the two ran
#   CONCURRENTLY, and this one asked the alerts API whether main was clean before CodeQL had
#   finished deciding. Measured on the commit that exposed it:
#
#       open-alerts gate   19:41:31 -> 19:41:35   (queried the API after four seconds)
#       CodeQL analyse     19:41:31 -> 19:42:57
#       the alert closed   19:42:44
#
#   The gate reported main as dirty 69 seconds before CodeQL closed the very alert that the pushed
#   commit had fixed. Both directions of that race are wrong, and the second one is worse:
#
#     * a push that FIXES an alert fails this gate, for nothing;
#     * a push that INTRODUCES one PASSES it, because CodeQL has not reported yet — and the alert
#       is then blamed on whatever lands next. That is the "an alert sits open across green
#       builds" failure this gate exists to prevent, moved along by one commit rather than fixed.
#
#   Waiting for CodeQL to complete on the same commit is the only way to read a settled answer, so
#   the trigger is CodeQL's completion. Same pattern deploy.yml uses to wait for CI.
#
#   CodeQL is path-filtered and skips docs-only pushes, so this skips them too — correctly: with no
#   code change there is nothing for the alert set to have become.
on:
  workflow_run:
    workflows: [ "CodeQL" ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by WHAT is being judged: the event kind, the repository the head came from, and the
  # branch. The branch alone was not enough — a workflow_run for a FORK's pull request carries the
  # fork's branch name (deploy.yml notes the same), and a fork's default branch is main, so a fork
  # PR opened from it joined `codeql-alerts-main`. GitHub keeps one PENDING run per group and
  # cancels the older one even with cancel-in-progress: false, so that PR could cancel a queued
  # main gate: that commit's alerts were never judged, and a new one was blamed on the next push.
  group: >-
    codeql-alerts-${{ github.event.workflow_run.event || github.event_name
    }}-${{ github.event.workflow_run.head_repository.full_name || github.repository
    }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  open-alerts:
    # MAIN ONLY — the pull-request half lives in codeql.yml (`pr-alerts`).
    #   This job once also judged pull requests, at refs/pull/<n>/merge, so a PR that would turn main
    #   red turned itself red instead. It could not: a workflow_run job's check is not posted on the
    #   PR's head commit, so it was absent from every PR (codeql.yml's pr-alerts, posted on the PR
    #   itself, replaced it). What it DID do is worse. GitHub files a workflow_run job's result on
    #   the default branch's newest commit, so a PR with open alerts marked MAIN's tip failing —
    #   and the panel's update gate (panel/ops/system_ops.py, _remote_ci_state) reads every check
    #   on that commit, so every install stopped being offered main's newest version until the
    #   next merge. f21a2f2 carries two such failures, from #177's runs. So the PR arm is gone:
    #   PRs are judged on the PR, and this judges main.
    name: Open code-scanning alerts
    #
    #   The workflow_dispatch arm is separate because on a manual run `github.event.workflow_run`
    #   is undefined: the property access yields null, `null == 'success'` is false, and the job
    #   was SKIPPED — reporting success and judging nothing. The manual entry point had never once
    #   run (173 workflow_run runs, 0 workflow_dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Resolve which ref to judge
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Falls back to this workflow's own ref on a manual run, where workflow_run is undefined
          # and WR_BRANCH would be empty — which built `ref=refs/heads/` and asked about nothing.
          WR_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          # The same name with no fallback, for the exact comparison below (deploy.yml's verify
          # step takes it the same way). With the fallback, an empty head_branch read as main.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The job's `if` compared head_branch with 'main' the way GitHub compares strings:
          # IGNORING CASE, and by SHORT name. So a branch `Main`, or a tag `main` or `MAIN`, pushed
          # with a commit carrying its own workflow named "CodeQL", passed it and was judged as
          # main. Read-only, but a gate must not report on main for a run that was not main's.
          # Compared here exactly, in bash; a manual run is not about head_branch.
          # (A tag named exactly `main` still shares main's concurrency group, which GitHub also
          # compares ignoring case, so it can replace a PENDING main gate. `queue: max` would stop
          # that, but actionlint 1.7.12, which CI pins, rejects the key; revisit when it doesn't.)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${HEAD_BRANCH:-}" != "main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::head_branch '${HEAD_BRANCH:-}' is not exactly main; nothing was judged."
            exit 0
          fi
          echo "ref=refs/heads/${WR_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "label=\`${WR_BRANCH}\`" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Fail if that ref has open code-scanning alerts
        if: steps.ref.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
          LABEL: ${{ steps.ref.outputs.label }}
        run: |
          set -euo pipefail
          # ?state=open and ?ref= are both server-side; ask for the rows rather than paging all.
          # A ref CodeQL has not uploaded results for returns [], which reads as "clean" — so the
          # guard below refuses to pass on an answer that could equally mean "not analysed".
          alerts="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=${REF}&per_page=100" \
                     --jq '[.[] | {rule: .rule.id, sev: (.rule.security_severity_level // .rule.severity // "-"), path: .most_recent_instance.location.path, line: .most_recent_instance.location.start_line}]')"
          n="$(printf '%s' "$alerts" | jq 'length')"
          total="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=${REF}&per_page=1" --jq 'length' || echo 0)"
          {
            echo "### Open code-scanning alerts on ${LABEL}"
            echo ""
            if [ "${total}" -eq 0 ]; then
              echo ":warning: CodeQL has uploaded no analysis for \`${REF}\`, so this proves nothing."
            elif [ "$n" -eq 0 ]; then
              echo "None. :white_check_mark:"
            else
              echo "| severity | rule | location |"
              echo "| --- | --- | --- |"
              printf '%s' "$alerts" | jq -r '.[] | "| \(.sev) | `\(.rule)` | \(.path):\(.line) |"'
              echo ""
              echo "A dismissed alert can reappear here UNDISMISSED if its file moved — GitHub keys"
              echo "dismissals partly on path. Check the Security tab for the same rule at the old"
              echo "path before treating it as a new finding."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${total}" -eq 0 ]; then
            echo "::error::no CodeQL analysis for ${REF} — refusing to report it clean." >&2
            exit 1
          fi
          if [ "$n" -ne 0 ]; then
            echo "::error::${LABEL} has $n open code-scanning alert(s) — see the job summary." >&2
            exit 1
          fi
          echo "No open code-scanning alerts on ${LABEL}."
