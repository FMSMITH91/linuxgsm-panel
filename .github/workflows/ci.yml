name: CI

on:
  # Skip a run when a push/PR touches ONLY docs/meta the tests don't exercise — a README or
  # LICENSE edit shouldn't spin up the whole matrix. Any code, template, test, requirements,
  # install.sh, or workflow change still triggers CI (those all affect what the tests check).
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least-privilege GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

# Newer push to the same ref cancels an in-progress run (faster feedback, fewer minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # report BOTH LTS results even if one fails, so a version-specific break is obvious
      matrix:
        include:
          # The Ubuntu LTS releases LinuxGSM supports, each paired with the Python it ships, so the
          # suite is proven on the versions the panel will actually run on — not just ubuntu-latest.
          # (20.04 is EOL and its Python 3.8 is below the dependency floor, so it isn't targeted.)
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # esprima: tests/template_actions_test.py parses static/js — without it that gate skips.
        run: python -m pip install --quiet -r requirements.txt flake8 esprima

      - name: Run all checks (compile, lint, unit, smoke, shellcheck)
        # Same script developers run locally via ./tools/run-tests.sh, so green here == green there.
        # shellcheck is pre-installed on the ubuntu runners.
        run: PYTHON=python bash tools/run-tests.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    # Informational, and deliberately a SEPARATE job: it re-runs the suites under tracing, which is
    # slower, and the gate above should stay the fast answer. Codacy has a 60% coverage goal that
    # has always read as "not reported" because nothing ever produced a report.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt coverage

      - name: Measure
        # --parallel-mode + combine: each suite is its own process, and smoke/rbac fork threads.
        # || true on the suites themselves — the gate job decides pass/fail, this one only measures.
        run: |
          for suite in unit template_actions smoke rbac manage; do
            rm -f data/panel.db data/panel.db-shm data/panel.db-wal data/panel.db.backup
            python -m coverage run --parallel-mode --source=. \
              --omit="./tests/*,./tools/*,./.venv/*" "tests/${suite}_test.py" >/dev/null 2>&1 || true
          done
          python -m coverage combine
          python -m coverage xml -o coverage.xml
          python -m coverage report --sort=miss > coverage.txt
          {
            echo '### Coverage'
            echo ''
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt

      # Codacy's coverage goal only lights up once a report is uploaded. This step is live but
      # self-disabling: with no CODACY_PROJECT_TOKEN secret it is skipped, and it starts working by
      # itself the moment one is added — no second PR to remember. Use a REPOSITORY token (Codacy →
      # the repo → Settings → Integrations), not an account token: it is scoped to this repo alone,
      # so a leak cannot reach anything else.
      - name: Send coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
