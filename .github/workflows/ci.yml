name: CI

on:
  # Skip a run when a push/PR touches ONLY docs/meta the tests don't exercise — a README or
  # LICENSE edit shouldn't spin up the whole matrix. Any code, template, test, requirements,
  # install.sh, or workflow change still triggers CI (those all affect what the tests check).
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least-privilege GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

# Newer push to the same ref cancels an in-progress run (faster feedback, fewer minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # 30, not 20: before the root step below the slowest leg (22.04) took 971-1003 s in the last 15
    # green runs, and the root step runs the unit suite once more (169-186 s of the job log), which
    # left about a minute under 20. A timed-out leg is a failed required check, and on main a
    # failure the panel's update gate and deploy.yml read. The root step prints its own duration.
    timeout-minutes: 30
    strategy:
      fail-fast: false   # report EVERY LTS result even if one fails, so a version-specific break is obvious
      matrix:
        include:
          # Each Ubuntu LTS the panel is expected to run on, paired with the Python that release
          # actually ships, so the suite is proven on the real combination rather than on
          # ubuntu-latest. (20.04 is EOL and its Python 3.8 is below the dependency floor.)
          #
          # 22.04: its runner image begins deprecation on 2026-09-17 and is fully unsupported from
          # 2027-04-17 (actions/runner-images#14254). Kept while it still runs, because Ubuntu
          # 22.04 itself has standard support until April 2027 and someone will install onto it.
          # When the image goes, keep the 3.10 column by running it on ubuntu-24.04 rather than
          # dropping it — the floor that matters is the Python version, not the image.
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          # 26.04 ships Python 3.14. The runner image is still a public preview
          # (actions/runner-images#14226), so treat a failure here as information about the image
          # as much as about the panel — fail-fast is off precisely so it cannot mask the others.
          - os: ubuntu-26.04
            python: "3.14"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The suites and their pip dependencies run here, and none needs the job token.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # esprima: tests/template_actions_test.py parses static/js — without it that gate skips.
        # Everything is hash-pinned: requirements.txt is the panel's own lockfile (requirements.in),
        # and the tools' are in .github/ci-requirements-checks. esprima is an sdist, so its build
        # tools go in first and it builds against those, not against a fetched setuptools.
        # Wheels only for everything else: esprima is the ONE package allowed to build from source.
        # pip applies the two flags in order, so `--no-binary=esprima` comes after
        # `--only-binary :all:` (the other way round makes esprima wheel-only, and the install
        # fails). Drop the exemption if esprima ever ships a wheel.
        # requirements-bootstrap.txt first: the pip install.sh puts in every panel venv, installed
        # the way install.sh installs it, so a Dependabot bump of it is proved on each Python here,
        # and the requirements below go in through the same pip the hosts use.
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r requirements-bootstrap.txt
          python -m pip install --quiet --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-requirements-checks/build.txt
          python -m pip install --quiet --require-hashes --only-binary :all: --no-binary=esprima \
            --no-build-isolation -r .github/ci-requirements-checks/checks.txt

      - name: Run all checks (compile, lint, unit, smoke, shellcheck)
        # Same script developers run locally via ./tools/run-tests.sh, so green here == green there.
        # shellcheck is pre-installed on the ubuntu runners.
        # REQUIRE_TOOLS=1: a linter that is missing OR broken must fail this job rather than be
        # skipped. The probes in run-tests.sh cannot tell the two apart, and both printed
        # "skipping" before the script went on to say "All checks passed" — shown by execution,
        # with flake8 made to raise, an injected undefined name reported as a clean run.
        # shellcheck is pre-installed on the ubuntu runners and flake8 is installed above, so this
        # only ever fires when the runner image changes under us.
        # UNIT_LOG: the unit run's output, which the next step compares its root run against.
        run: PYTHON=python REQUIRE_TOOLS=1 UNIT_LOG="${RUNNER_TEMP}/unit-user.txt" bash tools/run-tests.sh

      - name: Run the root-only unit checks, as root
        # The checks above run as the runner's own account, so every check that needs root SKIPS
        # there, and a skip does not fail the unit suite: visudo -cf on the sudoers grant install.sh
        # writes, _chown_panel_tree, panel_port read as the tree's owner, the remote content grant
        # driven through a link, and the update's snapshot and rollback as the tree's owner. They
        # had never run in CI, and 26.04's visudo is sudo-rs, which refuses settings classic sudo
        # accepts. GitHub's Linux runners have passwordless sudo, so this runs the suite again as
        # root. A step, not a job: the required checks are these jobs' names.
        #
        # The suite as a whole does not pass as root, and that is not this step's question: about
        # 60 checks are written for an unprivileged account (they create the "panel's" files and
        # expect them not to be root's), and they are judged by the run above. This step judges the
        # checks that ran ONLY here: every one must pass, every check the run above skipped for
        # want of root must have run, and there must be some. Measured in throwaway ubuntu:22.04,
        # 24.04 and 26.04 containers before landing: nothing outside the checkout and /tmp changed.
        #
        # sudo exports SUDO_UID, SUDO_USER and the rest, and the privileged helper reads SUDO_UID
        # (who invoked it); the suite's stand-in `pwd` has no getpwuid, so with them set it died in
        # part05 before reaching a single root check. They are unset; nothing else changes.
        run: |
          set -uo pipefail
          root_log="${RUNNER_TEMP}/unit-root.txt"
          # SC2016: ${!SUDO_@} is the root shell's to expand. SC2024: the log is written by this
          # shell, as the runner, on purpose; only the suite runs as root.
          started="${SECONDS}"
          # shellcheck disable=SC2016,SC2024
          sudo -E env PATH="$PATH" bash -c 'unset "${!SUDO_@}"; exec python tests/unit_test.py' \
            > "${root_log}" 2>&1 || true
          echo "the unit suite as root took $((SECONDS - started))s"
          python - "${RUNNER_TEMP}/unit-user.txt" "${root_log}" <<'EOF'
          import re
          import sys

          LINE = re.compile(r"^\s*(PASS|FAIL|SKIP)  (.+?)(?:   \[(.*))?$")


          def read(path):
              seen, why, tally = {}, {}, None
              with open(path, encoding="utf-8", errors="replace") as fh:
                  for ln in fh:
                      m = LINE.match(ln.rstrip("\n"))
                      if m:
                          seen.setdefault(m.group(2), set()).add(m.group(1))
                          if m.group(1) == "SKIP":
                              why[m.group(2)] = m.group(3) or ""
                      if re.match(r"\d+ / \d+ checks passed$", ln.strip()):
                          tally = ln.strip()
              return seen, why, tally


          def fail(why):
              print("::error::" + why)   # stdout: where the runner reads workflow commands
              sys.exit(1)


          user, user_why, user_tally = read(sys.argv[1])
          root, _, root_tally = read(sys.argv[2])
          if user_tally is None or root_tally is None:
              fail("a unit run left no tally (as the runner: %s; as root: %s), so nothing can be "
                   "judged" % (user_tally, root_tally))
          gates = sorted(n for n, w in user_why.items() if re.search(r"\broot\b", w))
          shut = [n for n in gates if "SKIP" in root.get(n, set())]
          only = sorted(n for n, st in root.items()
                        if st & {"PASS", "FAIL"} and not user.get(n, set()) & {"PASS", "FAIL"})
          bad = [n for n in only if "FAIL" in root[n]]
          print("as the runner: %s; as root: %s" % (user_tally, root_tally))
          print("skipped for want of root: %d; ran only as root: %d" % (len(gates), len(only)))
          for n in only:
              print("  %s  %s" % ("FAIL" if n in bad else "PASS", n))
          if not gates or not only:
              fail("no check was skipped for want of root, or none ran only as root: this step "
                   "judged nothing")
          if shut:
              fail("still skipped as root: %s" % "; ".join(shut))
          if bad:
              fail("failed as root: %s" % "; ".join(bad))
          EOF

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DELIBERATELY NOT `needs: checks`. Gating this on the matrix was a mistake worth recording:
    # it saved runner-minutes on the rare red run by adding this job's full duration to the WALL
    # CLOCK of every green one, because `needs` serialises. Measured: the matrix finished at
    # 18:02:15 and this started at 18:02:17, where it used to overlap.
    #
    # This repository is PUBLIC, so Actions minutes are free. There is nothing to save on the red
    # path, and the only cost that is actually paid is how long a green PR takes to report — which
    # `needs` roughly doubled. Running in parallel is strictly better here. Re-add `needs` only if
    # this repo ever goes private and minutes start being billed.
    env:
      COVERAGE_CORE: sysmon
    # Informational, and deliberately a SEPARATE job: it re-runs the suites under tracing, which is
    # slower, and the gate above should stay the fast answer. Codacy has a 60% coverage goal that
    # has always read as "not reported" because nothing ever produced a report.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes or fetches with the job token: do not leave it in .git/config.
          persist-credentials: false

      # 3.14, not 3.12, and COVERAGE_CORE pinned — this job was 88% ONE SUITE because of it.
      #
      # The instrumentation added alongside this said so outright: unit_test took 904s of the
      # job's 1030s, while smoke took 95s and combine/xml/report together took 2s. The same suite
      # takes 9s locally under coverage. The difference is the interpreter: on 3.12 coverage
      # traces through the C trace function, which disables CPython's specialising interpreter,
      # and unit_test is the worst possible workload for that — it AST-parses every module in the
      # repo and reads every line of every file, in hot pure-Python loops. Measured locally on
      # 3.14: 8.9s under sysmon, 9.9s under ctrace — both fine, so it is the version that matters.
      #
      # sys.monitoring (PEP 669) is what makes it cheap, and it is the default from 3.14. Named
      # explicitly anyway so a future default change cannot quietly put the 904s back.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        # coverage is hash-pinned, like every CI tool. (This job used to hold CODACY_PROJECT_TOKEN in
        # a later step; the upload is codacy-coverage.yml's now, and this job holds no secret.)
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-requirements/coverage.txt

      - name: Measure
        # --parallel-mode + combine: each suite is its own process, and smoke/rbac fork threads.
        # || true on the suites themselves — the gate job decides pass/fail, this one only measures.
        #
        # TIMED PER SUITE, and that is not decoration. This job runs 328-1021s while the matrix
        # runs the same five suites in ~130s, and the spread between those two numbers is as
        # unexplained as the gap. Tracing is NOT the cause — measured at 8.8s vs 8.8s for unit_test
        # with and without `coverage run`. `|| true` means a suite that hangs here looks identical
        # to one that is merely slow, so without a per-suite number there is nothing to reason
        # from. The totals land in the step summary next to the coverage report.
        run: |
          echo "| suite | seconds |" > /tmp/suite_times.md
          echo "| --- | ---: |" >> /tmp/suite_times.md
          for suite in unit template_actions smoke rbac manage setup_wizard perf_budget input_validation; do
            _t0=$SECONDS
            rm -f data/panel.db data/panel.db-shm data/panel.db-wal data/panel.db.backup
            python -m coverage run --parallel-mode --source=. \
              --omit="./tests/*,./tools/*,./.venv/*" "tests/${suite}_test.py" >/dev/null 2>&1 || true
            # Both places on purpose: the step summary is for a human skimming the run, the
            # stdout copy is what `gh run view --log` can actually retrieve. The first version of
            # this wrote only the summary, and the numbers turned out to be unreadable from the
            # API — which is the one way I needed to read them.
            echo "| \`${suite}\` | $((SECONDS - _t0)) |" | tee -a /tmp/suite_times.md
          done
          # Timed as well, and separately from the suites. Locally the five suites total 94s
          # (measured plain AND under coverage — identical, tracing costs nothing here) while this
          # job takes 697s on a runner. If the suites are not where it goes, it is in these three,
          # and combine/xml/report over 13k statements with several parallel data files is the
          # obvious candidate. Guessing which has been wrong twice today; measure it.
          _c0=$SECONDS; python -m coverage combine
          echo "| \`combine\` | $((SECONDS - _c0)) |" | tee -a /tmp/suite_times.md
          _c0=$SECONDS; python -m coverage xml -o coverage.xml
          echo "| \`xml\` | $((SECONDS - _c0)) |" | tee -a /tmp/suite_times.md
          _c0=$SECONDS; python -m coverage report --sort=miss > coverage.txt
          echo "| \`report\` | $((SECONDS - _c0)) |" | tee -a /tmp/suite_times.md
          {
            echo '### Coverage'
            echo ''
            echo '#### Time per suite'
            cat /tmp/suite_times.md
            echo ''
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt

      # Sending it to Codacy is NOT done here. This job runs the code under test — a pull request's
      # own code on a pull request — and the upload needs CODACY_PROJECT_TOKEN, which as a
      # repository secret was readable by a workflow on any branch pushed here. codacy-coverage.yml
      # uploads the artifact above once this workflow completes, from main's copy of that file, in
      # an environment the owner can restrict to main (its header has the settings).

  js-coverage:
    # Line coverage of the panel's OWN JavaScript (static/js/*.js — not static/vendor), for Codacy
    # beside the Python report above: the Python suites never run a line of it, so until this job
    # every one of those files was simply absent from the coverage Codacy reports.
    #
    # tools/js_coverage/run.py boots a seeded panel in a throwaway copy of the tree, with every
    # command it would run on a host answered by a fake host and every other way out refused
    # (tools/js_coverage/serve.py), drives the runner's own Chrome through its pages and controls
    # over the DevTools protocol, and writes V8's block coverage as LCOV. Nothing is installed
    # beyond the panel's requirements.txt: the DevTools client is websocket-client, already in it,
    # and Chrome is part of the runner image. So there is no new lockfile to pin or keep current.
    #
    # It FAILS rather than uploading nothing when the panel does not boot, the sign-in does not
    # land, Chrome cannot be driven, a page the walk names does not render as itself, or no line
    # of static/js ran: an empty report would read as "0% covered", which is a measurement of
    # nothing. Like the job above it holds no secret — codacy-coverage.yml uploads its artifact.
    name: js coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r requirements.txt

      - name: Measure
        run: |
          set -euo pipefail
          chrome=""
          for c in google-chrome chromium; do
            if command -v "${c}" >/dev/null; then chrome="$(command -v "${c}")"; break; fi
          done
          if [ -z "${chrome}" ]; then
            echo "::error::no Chrome on this runner image; the JavaScript was not measured."
            exit 1
          fi
          # The summary goes on the run page whether or not the run passed — a failed one names
          # the page it could not reach or the flow that broke — and the step then exits with
          # run.py's own status, so a failure stops the upload below.
          rc=0
          python tools/js_coverage/run.py --chrome "${chrome}" \
            --out lcov.info --summary js-coverage.txt || rc=$?
          if [ -f js-coverage.txt ]; then
            {
              echo '### JavaScript coverage (static/js)'
              echo ''
              echo '```'
              cat js-coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${rc}"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-coverage
          path: |
            lcov.info
            js-coverage.txt
          if-no-files-found: error

  gamedig-lockfile:
    # tools/gamedig/package-lock.json is the tree install-gamedig.sh installs on every host, and it
    # moves only through Dependabot pull requests. This proves each change still installs from the
    # lockfile and RUNS on the Node each supported release gives it: 24.04's own 18.19, 26.04's own
    # 22, and NodeSource's 24 (install.sh's NODESOURCE_NODE_MAJOR) on 22.04. install-gamedig.sh never
    # switches to a tree that does not run, so a bump that broke one would leave existing hosts on
    # their old tree, and a fresh install on that release with no gamedig at all. The probe is the
    # script's own: loopback port 1 answers {"error":...}; a stack trace or nothing is a broken tree.
    name: gamedig lockfile (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18.19", "22", "24"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: npm ci from the lockfile, then run gamedig once
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cp tools/gamedig/package.json tools/gamedig/package-lock.json "${d}/"
          (cd "${d}" && timeout 600 npm ci --ignore-scripts --omit=dev --no-audit --no-fund)
          out="$(cd / && timeout 60 "${d}/node_modules/.bin/gamedig" --type minecraft 127.0.0.1:1 \
                   --givenPortOnly --maxRetries 1 --socketTimeout 1000 --attemptTimeout 3000 2>&1)" || true
          printf '%s\n' "${out}"
          case "${out}" in
              '{"error":'*) echo "gamedig from the lockfile runs on Node $(node -v)" ;;
              *) echo "::error::gamedig from the lockfile does not run on Node $(node -v)"; exit 1 ;;
          esac
