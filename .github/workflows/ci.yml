name: CI

on:
  # Skip a run when a push/PR touches ONLY docs/meta the tests don't exercise — a README or
  # LICENSE edit shouldn't spin up the whole matrix. Any code, template, test, requirements,
  # install.sh, or workflow change still triggers CI (those all affect what the tests check).
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least-privilege GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

# Newer push to the same ref cancels an in-progress run (faster feedback, fewer minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false   # report EVERY LTS result even if one fails, so a version-specific break is obvious
      matrix:
        include:
          # Each Ubuntu LTS the panel is expected to run on, paired with the Python that release
          # actually ships, so the suite is proven on the real combination rather than on
          # ubuntu-latest. (20.04 is EOL and its Python 3.8 is below the dependency floor.)
          #
          # 22.04: its runner image begins deprecation on 2026-09-17 and is fully unsupported from
          # 2027-04-17 (actions/runner-images#14254). Kept while it still runs, because Ubuntu
          # 22.04 itself has standard support until April 2027 and someone will install onto it.
          # When the image goes, keep the 3.10 column by running it on ubuntu-24.04 rather than
          # dropping it — the floor that matters is the Python version, not the image.
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          # 26.04 ships Python 3.14. The runner image is still a public preview
          # (actions/runner-images#14226), so treat a failure here as information about the image
          # as much as about the panel — fail-fast is off precisely so it cannot mask the others.
          - os: ubuntu-26.04
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # esprima: tests/template_actions_test.py parses static/js — without it that gate skips.
        # Everything is hash-pinned: requirements.txt is the panel's own lockfile (requirements.in),
        # and the tools' are in .github/ci-requirements-checks. esprima is an sdist, so its build
        # tools go in first and it builds against those, not against a fetched setuptools.
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-requirements-checks/build.txt
          python -m pip install --quiet --require-hashes --no-build-isolation \
            -r .github/ci-requirements-checks/checks.txt

      - name: Run all checks (compile, lint, unit, smoke, shellcheck)
        # Same script developers run locally via ./tools/run-tests.sh, so green here == green there.
        # shellcheck is pre-installed on the ubuntu runners.
        # REQUIRE_TOOLS=1: a linter that is missing OR broken must fail this job rather than be
        # skipped. The probes in run-tests.sh cannot tell the two apart, and both printed
        # "skipping" before the script went on to say "All checks passed" — shown by execution,
        # with flake8 made to raise, an injected undefined name reported as a clean run.
        # shellcheck is pre-installed on the ubuntu runners and flake8 is installed above, so this
        # only ever fires when the runner image changes under us.
        run: PYTHON=python REQUIRE_TOOLS=1 bash tools/run-tests.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DELIBERATELY NOT `needs: checks`. Gating this on the matrix was a mistake worth recording:
    # it saved runner-minutes on the rare red run by adding this job's full duration to the WALL
    # CLOCK of every green one, because `needs` serialises. Measured: the matrix finished at
    # 18:02:15 and this started at 18:02:17, where it used to overlap.
    #
    # This repository is PUBLIC, so Actions minutes are free. There is nothing to save on the red
    # path, and the only cost that is actually paid is how long a green PR takes to report — which
    # `needs` roughly doubled. Running in parallel is strictly better here. Re-add `needs` only if
    # this repo ever goes private and minutes start being billed.
    env:
      # Whether the token EXISTS, not the token. A secret cannot be named in a step's `if:`, so the
      # job used to put CODACY_PROJECT_TOKEN itself in the job env — which put it in the environment
      # of every step: the pip install of the requirements, both test suites, and the remote script
      # the upload step used to run. Only the upload step gets the token now, in its own env.
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
      COVERAGE_CORE: sysmon
    # Informational, and deliberately a SEPARATE job: it re-runs the suites under tracing, which is
    # slower, and the gate above should stay the fast answer. Codacy has a 60% coverage goal that
    # has always read as "not reported" because nothing ever produced a report.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes or fetches with the job token, and the Codacy upload runs a
          # third-party binary: do not leave the token in .git/config for it.
          persist-credentials: false

      # 3.14, not 3.12, and COVERAGE_CORE pinned — this job was 88% ONE SUITE because of it.
      #
      # The instrumentation added alongside this said so outright: unit_test took 904s of the
      # job's 1030s, while smoke took 95s and combine/xml/report together took 2s. The same suite
      # takes 9s locally under coverage. The difference is the interpreter: on 3.12 coverage
      # traces through the C trace function, which disables CPython's specialising interpreter,
      # and unit_test is the worst possible workload for that — it AST-parses every module in the
      # repo and reads every line of every file, in hot pure-Python loops. Measured locally on
      # 3.14: 8.9s under sysmon, 9.9s under ctrace — both fine, so it is the version that matters.
      #
      # sys.monitoring (PEP 669) is what makes it cheap, and it is the default from 3.14. Named
      # explicitly anyway so a future default change cannot quietly put the 904s back.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        # coverage is hash-pinned: this job holds CODACY_PROJECT_TOKEN in a later step, and a step's
        # code can reach later steps on a runner with passwordless sudo.
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-requirements/coverage.txt

      - name: Measure
        # --parallel-mode + combine: each suite is its own process, and smoke/rbac fork threads.
        # || true on the suites themselves — the gate job decides pass/fail, this one only measures.
        #
        # TIMED PER SUITE, and that is not decoration. This job runs 328-1021s while the matrix
        # runs the same five suites in ~130s, and the spread between those two numbers is as
        # unexplained as the gap. Tracing is NOT the cause — measured at 8.8s vs 8.8s for unit_test
        # with and without `coverage run`. `|| true` means a suite that hangs here looks identical
        # to one that is merely slow, so without a per-suite number there is nothing to reason
        # from. The totals land in the step summary next to the coverage report.
        run: |
          echo "| suite | seconds |" > /tmp/suite_times.md
          echo "| --- | ---: |" >> /tmp/suite_times.md
          for suite in unit template_actions smoke rbac manage setup_wizard perf_budget input_validation; do
            _t0=$SECONDS
            rm -f data/panel.db data/panel.db-shm data/panel.db-wal data/panel.db.backup
            python -m coverage run --parallel-mode --source=. \
              --omit="./tests/*,./tools/*,./.venv/*" "tests/${suite}_test.py" >/dev/null 2>&1 || true
            # Both places on purpose: the step summary is for a human skimming the run, the
            # stdout copy is what `gh run view --log` can actually retrieve. The first version of
            # this wrote only the summary, and the numbers turned out to be unreadable from the
            # API — which is the one way I needed to read them.
            echo "| \`${suite}\` | $((SECONDS - _t0)) |" | tee -a /tmp/suite_times.md
          done
          # Timed as well, and separately from the suites. Locally the five suites total 94s
          # (measured plain AND under coverage — identical, tracing costs nothing here) while this
          # job takes 697s on a runner. If the suites are not where it goes, it is in these three,
          # and combine/xml/report over 13k statements with several parallel data files is the
          # obvious candidate. Guessing which has been wrong twice today; measure it.
          _c0=$SECONDS; python -m coverage combine
          echo "| \`combine\` | $((SECONDS - _c0)) |" | tee -a /tmp/suite_times.md
          _c0=$SECONDS; python -m coverage xml -o coverage.xml
          echo "| \`xml\` | $((SECONDS - _c0)) |" | tee -a /tmp/suite_times.md
          _c0=$SECONDS; python -m coverage report --sort=miss > coverage.txt
          echo "| \`report\` | $((SECONDS - _c0)) |" | tee -a /tmp/suite_times.md
          {
            echo '### Coverage'
            echo ''
            echo '#### Time per suite'
            cat /tmp/suite_times.md
            echo ''
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt

      # Codacy's coverage goal only lights up once a report is uploaded. This step is live but
      # self-disabling: with no CODACY_PROJECT_TOKEN secret it is skipped, and it starts working by
      # itself the moment one is added — no second PR to remember. Use a REPOSITORY token (Codacy →
      # the repo → Settings → Integrations), not an account token: it is scoped to this repo alone,
      # so a leak cannot reach anything else.
      #
      # A pinned release binary, checked against its sha256 — the way actionlint and gitleaks are
      # fetched. This was `bash <(curl -Ls https://coverage.codacy.com/get.sh)`: an unversioned,
      # unchecksummed script executed on every push to main with the token in its environment, and
      # `curl -L` without -f fed an error page to bash too. Bump deliberately: VERSION and SHA256
      # together; the digest is the one GitHub records for the release asset
      # (codacy/codacy-coverage-reporter, codacy-coverage-reporter-linux).
      - name: Send coverage to Codacy
        if: env.HAS_CODACY_TOKEN == 'true'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          VERSION: '14.1.3'
          SHA256: '15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/codacy-coverage-reporter \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${VERSION}/codacy-coverage-reporter-linux"
          echo "${SHA256}  /tmp/codacy-coverage-reporter" | sha256sum -c -
          chmod +x /tmp/codacy-coverage-reporter
          /tmp/codacy-coverage-reporter report -r coverage.xml
