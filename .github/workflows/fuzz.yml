name: Fuzz

# Coverage-guided fuzzing (Atheris / libFuzzer) of the pure parsers that ingest UNTRUSTED external
# input: a remote game server's `status`/`list` reply, LinuxGSM config / apt / mod-list output,
# fail2ban log lines, and UFW status. Each harness asserts the parser never raises on ANY input —
# they are best-effort and must degrade to an empty result, not crash the player-list / firewall /
# security paths that call them. Time is bounded so PR runs stay short; the nightly schedule soaks
# longer over the committed seed corpus.
# NO `push` TRIGGER, deliberately.
#   Every push to main here is a squash of a PR that already ran this exact matrix over this exact
#   code, seconds earlier. Re-running it on the merge commit is six jobs (~460s) re-covering the
#   same ground — and it cannot even find more by luck, because the corpus is NOT persisted between
#   runs: each job starts from the committed seeds in tests/fuzz/corpus and throws away what it
#   generates (new units go to an artifact, not back into the repo). So the second run explores the
#   same seeds for the same bounded time.
#   Coverage is unchanged: a PR still fuzzes before merge, and the nightly soak runs longer over
#   the same seeds than any per-push run does. A direct push to main that bypassed a PR is covered
#   by that nightly, within the day.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'panel/ops/ssh_manager/**'
      - 'panel/ops/system_ops.py'
      - 'panel/core/terminal.py'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzz.yml'
      - 'requirements.txt'
      - '.github/ci-requirements/atheris.txt'   # a Dependabot bump of the fuzzer must run it
  schedule:
    - cron: "0 4 * * *"   # nightly 04:00 UTC — a longer soak
  workflow_dispatch:      # allow manual runs from the Actions tab

# Least-privilege: these jobs only read the repo (crash reproducers are uploaded as artifacts).
permissions:
  contents: read

# A newer push to the same ref cancels an in-progress run (faster feedback, fewer minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false   # fuzz every target even if one finds a crash, so all findings surface
      matrix:
        target: [ game_status, firewall, config, fail2ban, console, cron ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"   # Atheris ships manylinux wheels for 3.12 (the runner's Python)

      - name: Install dependencies + Atheris
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-requirements/atheris.txt

      - name: Fuzz
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ matrix.target }}
        run: |
          SECS=60
          [ "$EVENT" = "schedule" ] && SECS=600
          mkdir -p ".fuzz-corpus/$TARGET"
          # First corpus dir is writable (new units land there); the committed seeds are read-only.
          # A crash writes a crash-*/oom-*/timeout-* reproducer to the cwd and exits non-zero.
          python "tests/fuzz/fuzz_${TARGET}.py" \
            -max_total_time="$SECS" -timeout=25 -rss_limit_mb=2560 \
            ".fuzz-corpus/$TARGET" "tests/fuzz/corpus/$TARGET"

      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
