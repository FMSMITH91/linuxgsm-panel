name: Codacy coverage

# Sends the coverage reports CI made to Codacy: what Codacy's "Diff Coverage" and "Coverage
# Variation" checks on a pull request are computed from, and its coverage goal on main. Two reports,
# one per language, sent with the reporter's partial/final flow — each `report --partial`, then one
# `final` that tells Codacy the commit's coverage is complete:
#   coverage.xml   Cobertura, from the `coverage` job: the Python the suites run.
#   lcov.info      LCOV, from the `js-coverage` job: the panel's own static/js, run in a browser.
# A run whose js-coverage job failed has no lcov.info; the Python report still goes up, with a
# warning here beside the red check that job already shows.
#
# WHY THIS IS NOT A STEP OF THE COVERAGE JOB ANY MORE
#   The upload needs CODACY_PROJECT_TOKEN, and as a repository secret that was readable by a
#   workflow run on ANY branch or tag pushed here: a pushed workflow that prints it has it. A
#   deployment environment can admit only main, but not for a job that has to run on pull requests:
#   GitHub checks a pull_request run's environment rules against refs/pull/<n>/merge, so an
#   environment admitting only main refuses every PR's upload, and one admitting refs/pull/*/merge
#   hands the token to any branch that opens a PR. A workflow_run job is different. It runs MAIN'S
#   copy of this file with GITHUB_REF set to main, whatever branch the run it follows was for, so
#   it can hold the token in an environment that admits main alone and still upload a PR's report.
#   The coverage job holds no secret now; it leaves coverage.xml as an artifact, and this uploads
#   it for the commit that run tested (a PR's head commit, as the pull_request upload did).
#
#   That report is DATA from whatever code the run tested, and it reaches the job holding the
#   token, so it is treated as untrusted: never executed, and re-written before the reporter sees
#   it. The reporter's XML parser (14.1.3) stops the external DTD but not external entities
#   declared inside the file, so a report with a <!DOCTYPE> could have it read a file, its own
#   environment and the token in it included, into a request. A report declaring any DTD or entity
#   is refused, and what is uploaded is a fresh serialisation of the elements, with no DTD at all.
#   lcov.info gets the same treatment: plain ASCII text, every line one of LCOV's own records,
#   every file a static/js/<name>.js path (no directory, no `..`), and what is uploaded is rebuilt
#   from the parsed numbers alone. That also keeps it from being XML: the reporter tries each XML
#   parser on a report before its LCOV one, so an "lcov.info" carrying a DTD would meet the same
#   entity problem. Either report failing its check stops the upload of both.
#   Runs of this repository only: a fork's pull request never had the token (GitHub gives fork
#   PRs no secrets), and its report does not get to meet it here either.
#
# ── One-time setup, so the token is scoped (repository owner) ─────────────────────────────────
#  1. Settings -> Environments -> New environment, named `codacy`. Under "Deployment branches and
#     tags" choose "Selected branches and tags" and add ONE rule: branch, `main`. No tag rule.
#  2. In that environment, "Environment secrets" -> Add environment secret:
#        CODACY_PROJECT_TOKEN = a repository API token (Codacy -> this repository -> Settings ->
#                               API tokens -> Create API token; give it an expiry).
#     The current token has been readable by every branch, so create a new one for this rather
#     than moving the old value, and revoke the old one in Codacy once an upload has gone through.
#  3. Settings -> Secrets and variables -> Actions -> Repository secrets: delete
#     CODACY_PROJECT_TOKEN. Until this step the job keeps working off the repository secret (a job
#     in an environment still sees repository secrets), so there is no gap in the uploads; after
#     it, only this job, running main's copy of this file, can read the token.
#  Nothing is scoped until the rule in step 1 exists: an environment with no rules (which is what
#  GitHub creates when a job first names one) admits every branch.
# ──────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]

permissions:
  contents: read

jobs:
  upload:
    # The panel's update check ignores this job's check run BY THIS NAME (system_ops._CI_IGNORE;
    # tests/unit ties the two): GitHub files it under main's newest commit, for a pull request's
    # run too, and an upload that failed says nothing about that commit.
    name: Upload coverage to Codacy
    # A CI run of THIS repository, for a push or a pull request, that was not cancelled or skipped
    # (a failed test does not stop the coverage job: it measures, the matrix decides). A push counts
    # only when its branch is exactly main, which the step checks: this `if` compares ignoring case.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    # Where CODACY_PROJECT_TOKEN lives once the setup above is done: an environment whose only
    # deployment rule is the branch main. A workflow_run job runs with GITHUB_REF set to the default
    # branch, so this job qualifies and a workflow on any other branch or tag does not.
    # deployment: false — the environment is here for its secret and its branch rule, which still
    # apply; without it every upload would add a "deployment" to the repository's history.
    environment:
      name: codacy
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read   # to download an artifact of the CI run this follows; nothing else
    steps:
      # No checkout: nothing from the repository is needed, and nothing of the tested code is run.
      - name: Download the coverage report CI made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # continue-on-error: a CI run whose js-coverage job failed left no such artifact, and that
      # job's own red check already says so. The step below then sends the Python report alone and
      # warns; it does not pretend the JavaScript was measured.
      - name: Download the JavaScript coverage report CI made
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-coverage
          path: ${{ runner.temp }}/js-coverage-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # A pinned release binary, checked against its sha256 — the way actionlint and gitleaks are
      # fetched. Bump deliberately: VERSION and SHA256 together; the digest is the one GitHub
      # records for the release asset (codacy/codacy-coverage-reporter,
      # codacy-coverage-reporter-linux).
      - name: Send coverage to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          REPORT_DIR: ${{ runner.temp }}/coverage-artifact
          JS_REPORT_DIR: ${{ runner.temp }}/js-coverage-artifact
          VERSION: '14.1.3'
          SHA256: '15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875'
        run: |
          set -euo pipefail
          # Self-disabling, as the step in ci.yml was: a run with no token (none configured, or one
          # GitHub withholds Actions secrets from) uploads nothing and passes.
          if [ -z "${CODACY_PROJECT_TOKEN:-}" ]; then
            echo "::notice::No CODACY_PROJECT_TOKEN for this run; nothing was uploaded."
            exit 0
          fi
          # The job's `if` compared the event only. A push is main's when its branch is EXACTLY main
          # (GitHub's expressions compare ignoring case, and head_branch is a short name that a tag
          # shares), so it is compared here, the way deploy.yml's verify step does.
          if [ "${WR_EVENT}" = "push" ] && [ "${HEAD_BRANCH:-}" != "main" ]; then
            echo "::notice::head_branch '${HEAD_BRANCH:-}' is not exactly main; nothing was uploaded."
            exit 0
          fi
          # The commit the report is attached to: exactly a commit id, before any command sees it.
          # A bash match, not grep: grep -x passes a value whose FIRST line is a commit id.
          if ! [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha is not a commit id; nothing was uploaded."
            exit 1
          fi
          report="${REPORT_DIR}/coverage.xml"
          if [ ! -f "${report}" ] || [ -L "${report}" ]; then
            echo "::error::the CI run's coverage artifact holds no coverage.xml; nothing was uploaded."
            exit 1
          fi
          # Refuse any DTD or entity declaration, in whatever encoding the file claims (expat reads
          # the BOM, a byte grep would not), then write the elements back out with none.
          clean="${RUNNER_TEMP}/coverage-clean.xml"
          python3 - "${report}" "${clean}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from xml.parsers import expat

          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as fh:
              data = fh.read()


          def refuse(*_args):
              print("::error::coverage.xml declares a DTD or an entity; nothing was uploaded.")
              sys.exit(1)


          parser = expat.ParserCreate()
          parser.StartDoctypeDeclHandler = refuse
          parser.EntityDeclHandler = refuse
          parser.Parse(data, True)
          root = ET.fromstring(data)
          if root.tag != "coverage" or root.get("line-rate") is None:
              print("::error::coverage.xml is not a Cobertura report; nothing was uploaded.")
              sys.exit(1)
          ET.ElementTree(root).write(dst, encoding="utf-8", xml_declaration=True)
          PY
          # lcov.info, when the js-coverage job made one: refused unless every line is an LCOV
          # record about a static/js/<name>.js file, then rebuilt from the parsed numbers (SF, DA,
          # LF, LH), so nothing the report carried besides those numbers reaches the reporter.
          js_report="${JS_REPORT_DIR:-}/lcov.info"
          js_clean=""
          if [ -z "${JS_REPORT_DIR:-}" ] || { [ ! -e "${js_report}" ] && [ ! -L "${js_report}" ]; }; then
            echo "::warning::the CI run left no lcov.info (its js-coverage job did not finish); only the Python report is uploaded."
          elif [ ! -f "${js_report}" ] || [ -L "${js_report}" ]; then
            echo "::error::the CI run's js-coverage artifact holds no regular lcov.info; nothing was uploaded."
            exit 1
          else
            js_clean="${RUNNER_TEMP}/lcov-clean.info"
            python3 - "${js_report}" "${js_clean}" <<'PY'
          import re
          import sys

          src, dst = sys.argv[1], sys.argv[2]


          def refuse(why):
              print("::error::lcov.info %s; nothing was uploaded." % why)
              sys.exit(1)


          with open(src, "rb") as fh:
              data = fh.read(16 * 1024 * 1024 + 1)
          if len(data) > 16 * 1024 * 1024:
              refuse("is larger than 16 MB")
          try:
              text = data.decode("ascii")
          except UnicodeDecodeError:
              refuse("is not plain ASCII text")
          if re.search(r"[^\n\x20-\x7e]", text):
              refuse("holds a control character")
          path_re = re.compile(r"static/js/[A-Za-z0-9_-]+\.js")
          num = r"[0-9]{1,9}"
          name = r",[\x20-\x2b\x2d-\x7e]{1,200}"
          fields = {
              "TN": re.compile(r"[A-Za-z0-9_ .-]{0,64}"),
              "FN": re.compile(num + r"(," + num + r")?" + name),
              "FNDA": re.compile(num + name),
              "FNF": re.compile(num), "FNH": re.compile(num),
              "BRDA": re.compile(num + "," + num + "," + num + r",(" + num + r"|-)"),
              "BRF": re.compile(num), "BRH": re.compile(num),
              "DA": re.compile(r"(" + num + r"),(" + num + r")(,[A-Za-z0-9+/=_-]{1,64})?"),
              "LF": re.compile(num), "LH": re.compile(num),
          }
          files, cur = {}, None
          for no, line in enumerate(text.split("\n"), 1):
              if not line:
                  continue
              if line == "end_of_record":
                  if cur is None:
                      refuse("ends a record it never began (line %d)" % no)
                  cur = None
                  continue
              tag, sep, val = line.partition(":")
              if not sep or (tag != "SF" and tag not in fields):
                  refuse("holds a line that is not an LCOV record (line %d)" % no)
              if tag == "SF":
                  if cur is not None:
                      refuse("begins a record inside another (line %d)" % no)
                  if not path_re.fullmatch(val):
                      refuse("names a file that is not static/js/<name>.js (line %d)" % no)
                  if val in files:
                      refuse("names %s twice" % val)
                  cur = files[val] = {}
                  continue
              m = fields[tag].fullmatch(val)
              if not m:
                  refuse("holds a malformed %s record (line %d)" % (tag, no))
              if tag == "TN":
                  continue
              if cur is None:
                  refuse("holds a %s record outside any file (line %d)" % (tag, no))
              if tag == "DA":
                  ln, hits = int(m.group(1)), int(m.group(2))
                  if ln == 0 or ln in cur:
                      refuse("holds line %d of a file twice, or a line 0 (line %d)" % (ln, no))
                  cur[ln] = hits
          if cur is not None:
              refuse("ends inside a record")
          if not any(files.values()):
              refuse("holds no line of any file")
          out = []
          for path in sorted(files):
              hits = files[path]
              out.append("SF:%s" % path)
              out.extend("DA:%d,%d" % (ln, hits[ln]) for ln in sorted(hits))
              out.append("LF:%d" % len(hits))
              out.append("LH:%d" % sum(1 for h in hits.values() if h))
              out.append("end_of_record")
          with open(dst, "w", encoding="ascii") as fh:
              fh.write("\n".join(out) + "\n")
          PY
          fi
          reporter="${RUNNER_TEMP}/codacy-coverage-reporter"
          curl -sSfL -o "${reporter}" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${VERSION}/codacy-coverage-reporter-linux"
          echo "${SHA256}  ${reporter}" | sha256sum -c -
          chmod +x "${reporter}"
          # From an empty directory: the reporter walks the one it runs in and looks for a git
          # repository there, and there is neither here. Both reports' file names are already
          # relative to the repository root (coverage.py writes them so, and so does run.py), and
          # the commit is named.
          #
          # Partial, then final: one `report --partial` per language, then `final` to say the
          # commit's coverage is complete. The language is named rather than guessed from the file
          # extensions (the reporter would take only the first it found), in Codacy's own spelling,
          # and the LCOV parser is named so no XML parser is tried on that file first. A JavaScript
          # upload that fails is reported, and `final` still runs: without it Codacy never
          # processes the Python report that did go up.
          cd "$(mktemp -d)"
          "${reporter}" report --partial -l Python -r "${clean}" --commit-uuid "${HEAD_SHA}"
          js_rc=0
          if [ -n "${js_clean}" ]; then
            "${reporter}" report --partial -l Javascript --force-coverage-parser lcov \
              -r "${js_clean}" --commit-uuid "${HEAD_SHA}" || js_rc=$?
          fi
          "${reporter}" final --commit-uuid "${HEAD_SHA}"
          if [ "${js_rc}" -ne 0 ]; then
            echo "::error::the JavaScript report was not accepted (reporter exit ${js_rc}); the Python report was."
            exit 1
          fi
