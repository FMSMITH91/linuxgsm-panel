name: Security scan

# Gitleaks scans the whole commit for an accidentally-committed secret, and a secret can land in
# ANY file — a README, a doc, a .gitignore — so this workflow is deliberately NOT path-filtered.
# Filtering it by path is how one slips through.
#
# The scanners that only read code (pip-audit, Bandit, Semgrep) live in security-code.yml, which IS
# path-filtered. The open-alerts gate moved to codeql-alerts.yml, which runs AFTER CodeQL rather
# than beside it — see the note there.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC

# Cancel an in-progress run when a newer commit is pushed to the same ref, so rapid
# pushes don't queue up and waste runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # NOTE: the "fail main when it has an open code-scanning alert" gate this comment used to
  # introduce now lives in codeql-alerts.yml, because it has to run AFTER CodeQL rather than beside
  # it — see the long note at the top of that file for the race it was losing. What remains here is
  # secret scanning, which is unconditional and unfiltered by design.
  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # scan the FULL git history, not just the tip
      # Blocking gate: a committed credential is always actionable. --redact keeps the
      # secret out of the public log. Uses the OSS binary directly (free on any repo;
      # the marketplace action needs a licence for orgs). The .github/gitleaks.toml allowlist
      # excludes the UI's token *placeholders* so they don't trip a false positive.
      - name: Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # PINNED and CHECKSUMMED. Every `uses:` in this repo is SHA-pinned; the one tool that
          # actually decides the secret-scanning verdict was resolved from releases/latest at run
          # time and piped straight into tar. A behaviour change upstream (gitleaks has been
          # moving `detect` toward `git`/`dir`) would change what this gate scans with no commit
          # here. Bump deliberately: update both the version and the sha256.
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xz -C /tmp -f "/tmp/${TARBALL}" gitleaks

          # SCOPED to what is under review. `detect --source .` with fetch-depth 0 walks the whole
          # object store, so a PR was judged on commits from unrelated branches: a finding on a
          # branch this PR does not contain turned this PR red, and symmetrically a branch could
          # suppress a real finding for itself with an allowlist in its own tree. On a PR, scan the
          # range; everywhere else (main, the weekly cron) keep scanning full history.
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
            /tmp/gitleaks detect --source . --config .github/gitleaks.toml \
              --log-opts "${BASE_SHA}..${HEAD_SHA}" --redact --verbose --exit-code 1
          else
            echo "Scanning full history"
            /tmp/gitleaks detect --source . --config .github/gitleaks.toml \
              --redact --verbose --exit-code 1
          fi
