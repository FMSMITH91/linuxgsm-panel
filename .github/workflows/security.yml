name: Security scan

# Gitleaks scans the whole commit for an accidentally-committed secret, and a secret can land in
# ANY file — a README, a doc, a .gitignore — so this workflow is deliberately NOT path-filtered.
# Filtering it by path is how one slips through.
#
# The scanners that only read code (pip-audit, Bandit, Semgrep) live in security-code.yml, which IS
# path-filtered. The open-alerts gate moved to codeql-alerts.yml, which runs AFTER CodeQL rather
# than beside it — see the note there.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC

# Cancel an in-progress run when a newer commit is pushed to the same ref, so rapid
# pushes don't queue up and waste runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # NOTE: the "fail main when it has an open code-scanning alert" gate this comment used to
  # introduce now lives in codeql-alerts.yml, because it has to run AFTER CodeQL rather than beside
  # it — see the long note at the top of that file for the race it was losing. What remains here is
  # secret scanning, which is unconditional and unfiltered by design.
  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # scan the FULL git history, not just the tip
      # Blocking gate: a committed credential is always actionable. --redact keeps the
      # secret out of the public log. Uses the OSS binary directly (free on any repo;
      # the marketplace action needs a licence for orgs). The .gitleaks.toml allowlist
      # excludes the UI's token *placeholders* so they don't trip a false positive.
      - name: Gitleaks
        env:
          # Authenticate the release lookup — an anonymous api.github.com call is capped
          # at 60/hour per runner IP and intermittently 403s (rate limit). The built-in
          # token lifts that to 5000/hour, so the download stops flaking.
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
                     https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                | grep -o 'https://[^"]*linux_x64\.tar\.gz' | head -1)
          curl -sSfL "$URL" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --redact --verbose --exit-code 1
