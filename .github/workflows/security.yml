name: Security scan

# The two checks here are the ones that must see EVERY commit, so this workflow is deliberately
# NOT path-filtered:
#
#   * Gitleaks scans the whole commit for an accidentally-committed secret, and a secret can land
#     in ANY file — a README, a doc, a .gitignore. Filtering it by path is how one slips through.
#   * The open-alerts gate reports on the state of main, which is independent of what the pushed
#     commit happened to touch.
#
# The scanners that only read code (pip-audit, Bandit, Semgrep) moved to security-code.yml, which
# IS path-filtered — they cannot report anything new about a docs-only change.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC

# Cancel an in-progress run when a newer commit is pushed to the same ref, so rapid
# pushes don't queue up and waste runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CodeQL, Bandit and Semgrep all POST their findings to the Security tab rather than failing a
  # PR — the Deep SAST job in security-code.yml literally ends in `|| true`. That is a deliberate
  # choice: a false positive from a scanner should not block a merge. The cost is that "all checks
  # passed" says nothing about whether the security tools are happy, and an open alert can sit on
  # main indefinitely with every badge green.
  #
  # That is not hypothetical. An alert introduced by #93 stayed open across four subsequent green
  # PRs and was only found by querying the code-scanning API by hand.
  #
  # So: don't gate PRs on the scanners, but make main's real state loud. This runs on main only,
  # reports what is open, and fails if anything is — a red build on main after a merge, which is
  # exactly when someone should look.
  open-alerts:
    name: Open code-scanning alerts (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Fail if main has open code-scanning alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ?state=open is server-side; ask for the count rather than paging every alert.
          alerts="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
                     --jq '[.[] | {rule: .rule.id, sev: (.rule.security_severity_level // .rule.severity // "-"), path: .most_recent_instance.location.path, line: .most_recent_instance.location.start_line}]')"
          n="$(printf '%s' "$alerts" | jq 'length')"
          {
            echo "### Open code-scanning alerts on \`main\`"
            echo ""
            if [ "$n" -eq 0 ]; then
              echo "None. :white_check_mark:"
            else
              echo "| severity | rule | location |"
              echo "| --- | --- | --- |"
              printf '%s' "$alerts" | jq -r '.[] | "| \(.sev) | `\(.rule)` | \(.path):\(.line) |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -ne 0 ]; then
            echo "::error::main has $n open code-scanning alert(s) — see the job summary." >&2
            exit 1
          fi
          echo "No open code-scanning alerts."

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # scan the FULL git history, not just the tip
      # Blocking gate: a committed credential is always actionable. --redact keeps the
      # secret out of the public log. Uses the OSS binary directly (free on any repo;
      # the marketplace action needs a licence for orgs). The .gitleaks.toml allowlist
      # excludes the UI's token *placeholders* so they don't trip a false positive.
      - name: Gitleaks
        env:
          # Authenticate the release lookup — an anonymous api.github.com call is capped
          # at 60/hour per runner IP and intermittently 403s (rate limit). The built-in
          # token lifts that to 5000/hour, so the download stops flaking.
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
                     https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                | grep -o 'https://[^"]*linux_x64\.tar\.gz' | head -1)
          curl -sSfL "$URL" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --redact --verbose --exit-code 1
