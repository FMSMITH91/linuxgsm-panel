name: Codacy alerts

# Fail when main carries a Critical- or High-level Codacy issue (API levels Error and High) that
# has not been reviewed, or when Codacy stopped reporting an accepted one in a file it still reads.
#
# WHY THIS EXISTS
#   Codacy's PR check only gates issues a PR ADDS. An Error already sitting on main is reported in
#   the dashboard and blocks nothing — so nobody sees it. That is not hypothetical: Codacy's Pylint
#   had flagged system_ops.py's ufw_allow_tailscale as E1124 ("argument 'timeout' passed by position
#   and keyword") on 2026-09-09. It was a real, 100%-reproducible TypeError that made the panel's
#   anti-lockout guard dead code, and it sat there with every badge green until a human read the
#   file two days later. This is the same shape of gap codeql-alerts.yml closed for code scanning.
#
# WHY IT IS SCHEDULED RATHER THAN TRIGGERED BY A PUSH
#   codeql-alerts.yml learned this the hard way: a gate that runs on the same push as the analysis
#   races it and reports whichever answer happened to be ready. CodeQL at least emits a
#   workflow_run to wait for; Codacy does not. So instead of guessing at a settling delay, this
#   reads SETTLED state on a schedule — which cannot race, at the cost of catching a regression
#   within a day rather than within a minute. Against "never", that is the trade worth taking.
#   workflow_dispatch is there for when you want the answer now.
#
# THE ACCEPTED LIST
#   .github/codacy-accepted-errors.json names the Critical- and High-level issues that are reviewed
#   and deliberate, keyed on (filePath, patternId, lineText) — never line number, which moves with
#   every edit above it. Anything not on that list fails the run.
#
# AN ACCEPTED ENTRY CODACY STOPS REPORTING
#   Codacy Cloud does not analyse a file over 150 KB at all
#   (https://docs.codacy.com/faq/troubleshooting/why-is-my-file-over-150-kb-missing/). When
#   system_ops.py crossed 150 KB its three accepted entries stopped matching, and this gate went on
#   reporting green while listing them for removal. Now, for an accepted entry that matches nothing
#   (its file read from this checkout):
#   - the file is over 150 KB: a ::warning:: and a summary section naming each entry Codacy cannot
#     confirm, keeping it. Not a failure: this check lands on main's head, where the panel's update
#     gate and deploy.yml read it, and it would be red every day until Codacy analyses the file
#     again (client-side analysis of the files over 150 KB, the owner's switch), which nothing in
#     this repository can bring about. The pull-request side runs Prospector over such files
#     (complexity_gate.py).
#   - the line is still in a file Codacy analyses: FAILS. Codacy can see it, and stopped reporting
#     it.
#   - the line, or the file, is gone: listed for removal.

on:
  schedule:
    - cron: "40 6 * * *"   # daily, after the weekly security scans have had their slot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codacy-alerts
  cancel-in-progress: false

jobs:
  open-errors:
    name: Error-level Codacy issues (main)
    # The `codacy` environment admits only the branch main (codacy-coverage.yml's header has the
    # setup), so CODACY_API_TOKEN, if it is ever set, is an environment secret no other branch's
    # workflow can read. It is not set today: the endpoint answers anonymously for this public
    # repository. deployment: false, as in codacy-coverage.yml: no deployment record per run.
    environment:
      name: codacy
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Codacy's API takes CODACY_API_TOKEN; nothing here needs the job token.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fail if main has unreviewed Critical- or High-level issues, or Codacy went silent on an accepted one it reads
        env:
          # A repository API token is optional. The endpoint answers anonymously for a PUBLIC repo,
          # which this is; the token is read if present so the gate keeps working should the repo
          # ever go private. It is NOT required for the job to run. Should it be needed, it goes in
          # the `codacy` environment's secrets, not the repository's (see the job's note).
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: python .github/scripts/codacy_open_errors.py
