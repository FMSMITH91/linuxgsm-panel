name: Scorecard

# OpenSSF Scorecard — audits this repo's supply-chain / security posture (token
# permissions, branch protection, pinned dependencies, dangerous workflow patterns, etc.)
# and publishes a public report + badge.
#
# It intentionally does NOT upload findings into GitHub code scanning, to keep the
# code-scanning alert list focused on actual code issues. View the report via the badge
# in the README, or at https://scorecard.dev/viewer/?uri=github.com/FMSMITH91/linuxgsm-panel
# (the SARIF is also kept as a build artifact on each run).

on:
  branch_protection_rule:
  schedule:
    - cron: "25 7 * * *"   # daily 07:25 UTC
  push:
    branches: [ main ]

# NAMED rather than read-all. This is hygiene, not a behaviour change: a job-level `permissions`
# block REPLACES the top-level one, and the single job below declares its own — so its token is
# unaffected either way. It matters because read-all grants every read scope in the token to any
# future job that does not declare its own, and because scorecard's own Token-Permissions check
# reads these files and scores a top-level read-all as weaker than an explicit list. `actions: read`
# was listed here too, and nothing used it: the one job replaces this block with its own.
permissions:
  contents: read

# One group per commit and event. It was one group for the whole repository, and with
# cancel-in-progress false GitHub still keeps only ONE pending run per group: three quick pushes
# CANCELLED the middle commit's queued run, leaving a "cancelled" Scorecard check on that commit.
# (Its CI is cancelled by the same pushes, so it is never deployed; the group is per commit so each
# commit gets its own check.) Runs on different commits do not share anything to serialise.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # publish results to the OpenSSF API (this is what powers the badge)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results (build artifact, not code scanning)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
