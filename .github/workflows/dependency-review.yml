name: Dependency Review

# On every pull request, flag a NEWLY-INTRODUCED dependency that has a known vulnerability, at any
# severity, using the repo's dependency graph. This complements the other dependency layers rather
# than duplicating them: Dependabot UPDATES existing deps, and the dependency audit
# (security-code.yml: pip-audit and osv-scanner) scans the WHOLE current set of every lockfile on
# every push, pull request and week. This is the review-time gate on what a PR is about to ADD.
#
# It only runs on pull_request (the action diffs the PR base against its head), so a push straight
# to main won't trigger it; it stays dormant until a PR is opened. Skipped on a private repo
# without GitHub Advanced Security (same guard the CodeQL workflow uses).

on:
  # Every pull request, unfiltered: it is a required check (.github/required-checks.txt), and a
  # required check whose workflow did not run holds the pull request forever. A pull request that
  # changes no dependency passes in seconds.
  pull_request:
    branches: [ main ]

# Least-privilege: this only needs to read the repo + its dependency graph.
# Supersede rather than stack: Only the newest push's dependency diff is of any interest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The review action calls the API with its own token input.
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail the PR check when it would pull in a dependency with an advisory of ANY severity:
          # `low` is the action's own default (README at this SHA), and what pip-audit and
          # osv-scanner hold every lockfile to. It was `high`, so a moderate advisory a pull request
          # added (to gamedig's tree, or a CI tool's lockfile, which pip-audit never read) passed.
          fail-on-severity: low
          # Reviewed advisories with no fix, comma-separated. Each must also be an expiring,
          # reasoned [[IgnoredVulns]] entry in the osv-scanner.toml beside its lockfile, which is
          # where the triage is written; a unit check (part27) holds the two lists together, so an
          # exemption cannot be added here alone. When that entry's date passes, the dependency
          # audit fails, and the advisory is looked at again: both entries renewed or removed.
          #   GHSA-ch52-4w7c-c8xp: http-cache-semantics, gamedig's tree (tools/gamedig/osv-scanner.toml).
          allow-ghsas: GHSA-ch52-4w7c-c8xp
