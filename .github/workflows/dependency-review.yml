name: Dependency Review

# On every pull request, flag a NEWLY-INTRODUCED dependency that has a known vulnerability
# (high or above), using the repo's dependency graph. This complements the other two dependency
# layers rather than duplicating them: Dependabot UPDATES existing deps, pip-audit scans the WHOLE
# current set on every push — this is the review-time gate on what a PR is about to ADD.
#
# It only runs on pull_request (the action diffs the PR base against its head), so a push straight
# to main won't trigger it; it stays dormant until a PR is opened. Skipped on a private repo
# without GitHub Advanced Security (same guard the CodeQL workflow uses).

on:
  pull_request:
    branches: [ main ]
    # This action diffs the dependency manifest for newly-introduced vulnerable or
    # incompatibly-licensed packages. With no manifest change there is no diff to review, so the
    # run can only ever report "nothing changed".
    # ...and the workflow files, because the dependency GRAPH tracks GitHub Actions too
    # (`gh api .../dependency-graph/sbom` lists pkg:githubactions/* entries). A third-party action
    # bump is the PR that most needs this review and it matched neither path, so the workflow did
    # not trigger at all — and with no required status checks, a missing check reads as a pass.
    # Confirmed on a live action-bump PR: 17 checks, no Dependency Review among them.
    # ...and gamedig's lockfile, the tree every host installs (install-gamedig.sh): a Dependabot
    # bump there is a new set of packages root fetches and every game account runs.
    # ...and pip's own lockfile, which install.sh puts in every panel venv before anything else.
    paths:
      - 'requirements.txt'
      - 'requirements-bootstrap.txt'
      - 'tools/gamedig/package.json'
      - 'tools/gamedig/package-lock.json'
      - '.github/workflows/**'
      - '.github/actions/**'

# Least-privilege: this only needs to read the repo + its dependency graph.
# Supersede rather than stack: Only the newest push's dependency diff is of any interest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail the PR check when it would pull in a dependency with a high/critical advisory.
          fail-on-severity: high
