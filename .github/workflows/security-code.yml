name: Security scan (code)

# The half of the security suite that only reads CODE: pip-audit and osv-scanner (declared
# dependencies), Bandit (Python security lint) and Semgrep (deep SAST). Split out of security.yml so it can be
# path-filtered, which that workflow deliberately is not — see the note at the top of it.
#
# A docs-only or workflow-only change cannot alter what any of these three report, and together
# they are ~105s of runner time per pull request. The exclusion list is a paths-IGNORE rather than
# an allowlist on purpose: an unrecognised new path should fail OPEN and be scanned, never skipped.
#
# The weekly cron is the reason the dependency audit still catches things on a quiet week — a
# newly-DISCLOSED CVE changes the answer without changing any lockfile, and schedule triggers ignore
# path filters entirely.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC — catches newly-disclosed CVEs

# Cancel an in-progress run when a newer commit is pushed to the same ref, so rapid
# pushes don't queue up and waste runner minutes.
# The event is part of the group: on main, the Monday scheduled run shares the ref with a push
# run, and without it the schedule CANCELLED an in-progress push run, leaving "cancelled" required
# checks on that commit, which the panel's update gate and deploy.yml read as a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every lockfile something installs, audited at ANY severity, on every pull request, on main and
  # weekly. The job keeps its name (a required check, .github/required-checks.txt); pip-audit is its
  # first half. The second, osv-scanner, reads what pip-audit cannot: gamedig's npm tree, which
  # every host installs (tools/gamedig, `npm ci`), and the CI tools' pip lockfiles, which run in
  # jobs holding security-events: write. Until it was added the only npm check was Dependency
  # Review, which judges what a pull request ADDS, so an advisory disclosed against the tree already
  # on main (GHSA-ch52-4w7c-c8xp, 2026-10-02) turned nothing red.
  dependency-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The audits read the lockfiles; no step here needs the job token.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --quiet --require-hashes --only-binary :all:
          -r .github/ci-requirements/pip-audit.txt
      # FAILS the run if any pinned dependency has a known vulnerability: that is actionable (bump
      # the version), so it is a hard gate. requirements.txt is the panel's whole closure (a unit
      # check keeps it closed); requirements-bootstrap.txt is the pip install.sh puts in every
      # panel venv.
      #   --disable-pip: read the pins as written, with no pip run. Without it pip-audit resolves
      #     the file with `pip install --dry-run` in a fresh venv whose pip it first upgrades to the
      #     newest, so the pinned pip was "already installed" and requirements-bootstrap.txt was
      #     audited as ZERO packages whenever it pinned the current pip, which is always, right
      #     after Dependabot bumps it. `No known vulnerabilities found`, exit 0, nothing read.
      #     (--no-deps, used before, does not stop that resolution in pip-audit 2.10.)
      #   --require-hashes: both files are hashed; pip-audit's README prefers it to --no-deps.
      #   --strict: a pin pip-audit cannot audit (PyPI has no such name/version, or a URL
      #     requirement) FAILS the run. Without it the pin is listed as "skipped" and the run passes.
      #   The count: the audit must have read exactly the file's pins. A pin dropped silently (a
      #     marker false on this runner's Python, a parser change in a pip-audit bump) fails here.
      - name: Audit the panel's pins (pip-audit)
        run: |
          set -uo pipefail
          for f in requirements.txt requirements-bootstrap.txt; do
            out="${RUNNER_TEMP}/pip-audit-${f%.txt}.json"
            pins="$(grep -cE '^[A-Za-z0-9._-]+==' "${f}" || true)"
            rc=0
            pip-audit --strict --require-hashes --disable-pip -r "${f}" -f json -o "${out}" || rc=$?
            if [ -s "${out}" ]; then
              jq -r '.dependencies[] | select((.vulns // []) | length > 0)
                     | "::error::\(.name) \(.version): \([.vulns[] | "\(.id) (\(if (.fix_versions | length) > 0
                         then "fixed in " + (.fix_versions | join(", ")) else "no fix yet" end))"] | join("; "))"' \
                "${out}"
            fi
            if [ "${rc}" -ne 0 ]; then
              echo "::error::pip-audit failed on ${f} (exit ${rc}): see above."
              exit "${rc}"
            fi
            audited="$(jq '[.dependencies[] | select(has("skip_reason") | not)] | length' "${out}")"
            echo "${f}: audited ${audited} of its ${pins} pinned packages; no known vulnerabilities."
            if [ "${pins}" -lt 1 ] || [ "${audited}" != "${pins}" ]; then
              echo "::error::pip-audit audited ${audited} of the ${pins} packages pinned in ${f}: the rest were NOT checked."
              exit 1
            fi
          done
      # osv-scanner, PINNED and CHECKSUMMED like gitleaks (security.yml): a release binary fetched
      # by tag and checked against its sha256 before it runs. Renovate proposes each bump, version
      # and sha256 together (.github/renovate.json), and the bump goes through CI. The version is
      # the release TAG. Runs even when pip-audit failed, so an npm finding is never hidden by a
      # Python one.
      - name: Install osv-scanner
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=github-release-attachments depName=google/osv-scanner
          OSV_SCANNER_VERSION: 'v2.6.0'
          OSV_SCANNER_SHA256: 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108'
        run: |
          set -euo pipefail
          curl --proto '=https' -sSfL -o "${RUNNER_TEMP}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/osv-scanner"
          "${RUNNER_TEMP}/osv-scanner" --version
      # Every lockfile, at any severity. A reviewed advisory with no fix is ignored only through an
      # osv-scanner.toml BESIDE its lockfile (the config applies to its own directory and does not
      # propagate), with a reason and an ignoreUntil date, after which it fails again and is looked
      # at afresh: tools/gamedig/osv-scanner.toml.
      #   requirements.txt:<path>: osv-scanner picks a parser by file NAME, so a pip lockfile not
      #     called requirements.txt must say how to read it (docs/scan-source.md, v2.6.0).
      #   The count: osv-scanner prints `Scanned <path> file and found N packages` per lockfile.
      #     Each must have been read and have yielded packages, or the run fails: a lockfile it
      #     parsed as empty is otherwise reported clean.
      - name: Audit every lockfile (osv-scanner)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          lockfiles=(tools/gamedig/package-lock.json requirements.txt requirements-bootstrap.txt
                     .github/ci-requirements*/*.txt)
          args=()
          for f in "${lockfiles[@]}"; do
            if [ ! -f "${f}" ]; then
              echo "::error::${f}: no such lockfile."
              exit 1
            fi
            case "${f}" in
              *.json) args+=(--lockfile "${f}") ;;
              *) args+=(--lockfile "requirements.txt:${f}") ;;
            esac
          done
          log="${RUNNER_TEMP}/osv-scanner.log"
          # The runner's shell is `bash -e`: a finding must not end the step before the count below.
          rc=0
          "${RUNNER_TEMP}/osv-scanner" scan source "${args[@]}" 2>&1 | tee "${log}" || rc=$?
          unread=()
          for f in "${lockfiles[@]}"; do
            grep -qE "/${f//./\\.} file and found [1-9][0-9]* packages?\$" "${log}" || unread+=("${f}")
          done
          echo "osv-scanner read $(( ${#lockfiles[@]} - ${#unread[@]} )) of ${#lockfiles[@]} lockfiles."
          if [ "${#unread[@]}" -ne 0 ]; then
            echo "::error::osv-scanner read no packages from: ${unread[*]}. They were NOT audited."
            exit 1
          fi
          exit "${rc}"

  sast-bandit:
    name: Python security lint (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab (code scanning)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job token can write code-scanning alert state, which the open-alerts gates read
          # as the truth. Only upload-sarif needs it, and it is handed that directly; leaving it
          # in .git/config put it in reach of every tool this job installs and runs.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Exact versions and hashes, wheels only — see the header of that file for why.
      - run: >-
          python -m pip install --quiet --require-hashes --only-binary :all:
          -r .github/ci-requirements/bandit.txt
      # Emit SARIF and publish it to GitHub code scanning (the Security tab), alongside
      # CodeQL. The skips drop checks that don't apply to this app by design: assert,
      # bind-all, the subprocess/shell + paramiko command family (commands are _quote()'d
      # and shell identifiers are @validates-guarded), the auto-add host-key policy, and
      # the intentional best-effort try/except pattern. B105 (hardcoded secrets), eval,
      # unsafe deserialization, weak crypto, etc. stay ON — so real signal surfaces.
      # tests/ is excluded (its fixture passwords are not secrets; Gitleaks scans the
      # whole repo for real ones). This step does not fail on findings (`|| true`: Bandit exits 1
      # on any): they become code-scanning alerts, and an open alert fails "Open code-scanning
      # alerts" (codeql-alerts.yml, which waits for this workflow) — that is where Bandit gates.
      - name: Bandit (SARIF)
        # `-r .` walks *.py ONLY, so tools/panel-helper — Python with a shebang and no extension —
        # was invisible to it. That file is the ROOT-OWNED end of the sudo boundary: the one place
        # in the repo where a finding matters most was the one place bandit never looked. It is
        # named explicitly alongside the recursive walk. (flake8 and compileall had the same blind
        # spot; see tools/run-tests.sh.)
        run: |
          FLAGS="-r . tools/panel-helper -x ./venv,./.github,./tests"
          SKIPS="B101,B104,B404,B601,B602,B603,B604,B607,B507,B110,B112"
          # shellcheck disable=SC2086  # deliberate word-splitting of the flag list
          bandit $FLAGS --skip "$SKIPS" -f sarif -o bandit.sarif || true
          # ...and again as JSON, purely to read errors[]. A file Bandit cannot PARSE is recorded
          # there, contributes zero results, and exits 0 — so the file is reported clean and the
          # SARIF says nothing about it. Proven by execution: with a syntax error in
          # panel/ops/system_ops.py — the module holding the privilege boundary — bandit exited 0
          # with `results: 0` and one entry in errors[]. The realistic trigger is version skew,
          # not a typo: this job pins Python 3.11 while ci.yml tests the panel on 3.14, so any
          # newer syntax in a panel module silently drops that file from the scan.
          # shellcheck disable=SC2086
          bandit $FLAGS --skip "$SKIPS" -f json -o bandit.json || true
          if [ "$(jq '.errors | length' bandit.json)" != "0" ]; then
            echo "::error::Bandit could not read some files — they were NOT scanned:"
            jq -r '.errors[] | "  \(.filename): \(.reason)"' bandit.json
            exit 1
          fi
      - name: Upload Bandit results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  sast-semgrep:
    name: Deep SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab (code scanning), as Bandit does
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Semgrep scans the working tree. The job token can write code-scanning alert state;
          # only upload-sarif needs it, and it is handed that directly (see the Bandit job).
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # semgrep.txt is semgrep's whole closure, PyJWT included, each package hash-checked, and pip
      # checks it is complete: no --no-deps, so a dependency a semgrep bump adds and the lockfile
      # lacks fails here, by name, instead of as "wrote no SARIF" below. (semgrep 1.178 pinned a
      # vulnerable PyJWT, which is why there was a second file; see .github/ci-requirements/semgrep.in.)
      - run: >-
          python -m pip install --quiet --require-hashes --only-binary :all:
          -r .github/ci-requirements/semgrep.txt
      # Registry rulesets, fetched anonymously (no Semgrep account/token needed):
      # general security-audit + Python + Flask + command-injection + secrets. This
      # catches real code vulns (injection, SSRF, path traversal, unsafe redirects,
      # weak crypto, template XSS, etc.).
      #
      # GATING, through code scanning. This used to be informational: `|| true` and the findings
      # printed to the job summary only, which nothing reads — while the panel's update gate
      # (system_ops._remote_ci_state) said in its docstring that Semgrep gated. It did not. The
      # findings now go to code scanning as SARIF (category semgrep), like Bandit's, so an open
      # one fails "Open code-scanning alerts" on main (codeql-alerts.yml, which waits for this
      # workflow too) and on a PR (codeql.yml's pr-alerts), and the panel does not offer the
      # commit. A false positive is dismissed in the Security tab, or marked `nosemgrep` in the
      # code as before; it never needs the gate turned off. The summary is kept for reading.
      #
      # Every finding has been triaged: the real ones were fixed, and each false positive
      # carries a `nosemgrep: <rule> -- <reason>` comment above it, so what this prints is
      # new. One rule is excluded outright: var-in-script-tag flags EVERY value inside a
      # <script>, |tojson included — 23 findings, none real. tests/template_actions_test.py
      # enforces what it is for (|tojson, |int or a literal choice) and fails the build.
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/security-audit --config p/python --config p/flask \
            --config p/command-injection --config p/secrets \
            --exclude-rule generic.html-templates.security.var-in-script-tag.var-in-script-tag \
            --exclude venv --exclude .github --exclude data --exclude tests \
            --sarif-output=semgrep.sarif \
            --metrics=off > semgrep.txt 2>&1 || rc=$?
          {
            echo '### 🛡️ Semgrep SAST';
            echo '';
            echo '```';
            tail -c 12000 semgrep.txt 2>/dev/null || echo '(semgrep produced no output — it did not run)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          # Findings do not fail THIS step (Semgrep exits 0 on them without --error); they gate
          # through code scanning. A scan that did not complete does fail it: a missing SARIF
          # would otherwise upload nothing, and nothing reads as clean.
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep wrote no SARIF (exit ${rc:-0}) — the code was not scanned; see the summary."
            exit 1
          fi
          # Semgrep writes the findings a `nosemgrep` comment suppresses into the SARIF too, marked
          # `"suppressions": [{"kind": "inSource"}]`, and code scanning opened an alert for every one
          # of them anyway: 26 triaged false positives became open alerts on the first upload, and
          # each would have failed the alerts gate. Only unsuppressed results are uploaded; a
          # suppression is still visible in the code, next to the reason written for it.
          jq '.runs |= map(.results |= map(select((.suppressions // []) | length == 0)))' \
            semgrep.sarif > semgrep.open.sarif
          mv semgrep.open.sarif semgrep.sarif
      - name: Upload Semgrep results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
