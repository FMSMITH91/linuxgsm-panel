name: Security scan (code)

# The half of the security suite that only reads CODE: pip-audit (declared dependencies), Bandit
# (Python security lint) and Semgrep (deep SAST). Split out of security.yml so it can be
# path-filtered, which that workflow deliberately is not — see the note at the top of it.
#
# A docs-only or workflow-only change cannot alter what any of these three report, and together
# they are ~105s of runner time per pull request. The exclusion list is a paths-IGNORE rather than
# an allowlist on purpose: an unrecognised new path should fail OPEN and be scanned, never skipped.
#
# The weekly cron is the reason pip-audit still catches things on a quiet week — a newly-DISCLOSED
# CVE changes the answer without changing requirements.txt, and schedule triggers ignore path
# filters entirely.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC — catches newly-disclosed CVEs

# Cancel an in-progress run when a newer commit is pushed to the same ref, so rapid
# pushes don't queue up and waste runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # pip-audit reads the lockfiles; no step here needs the job token.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --quiet --require-hashes --only-binary :all:
          -r .github/ci-requirements/pip-audit.txt
      # FAILS the run if any declared dependency has a known vulnerability — this
      # is actionable (bump the version), so it's a hard gate.
      # --no-deps: audit exactly the pinned set, which is what a host installs. Without it,
      # pip-audit resolved a fresh environment and audited whatever was newest that day.
      # requirements.txt lists the whole closure (a unit check keeps it closed), so nothing is
      # left out by not resolving.
      - run: pip-audit --no-deps -r requirements.txt
      # ...and the pip install.sh puts in every panel venv (requirements-bootstrap.in).
      - run: pip-audit --no-deps -r requirements-bootstrap.txt

  sast-bandit:
    name: Python security lint (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab (code scanning)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job token can write code-scanning alert state, which the open-alerts gates read
          # as the truth. Only upload-sarif needs it, and it is handed that directly; leaving it
          # in .git/config put it in reach of every tool this job installs and runs.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Exact versions and hashes, wheels only — see the header of that file for why.
      - run: >-
          python -m pip install --quiet --require-hashes --only-binary :all:
          -r .github/ci-requirements/bandit.txt
      # Emit SARIF and publish it to GitHub code scanning (the Security tab), alongside
      # CodeQL. The skips drop checks that don't apply to this app by design: assert,
      # bind-all, the subprocess/shell + paramiko command family (commands are _quote()'d
      # and shell identifiers are @validates-guarded), the auto-add host-key policy, and
      # the intentional best-effort try/except pattern. B105 (hardcoded secrets), eval,
      # unsafe deserialization, weak crypto, etc. stay ON — so real signal surfaces.
      # tests/ is excluded (its fixture passwords are not secrets; Gitleaks scans the
      # whole repo for real ones). This step does not fail on findings (`|| true`: Bandit exits 1
      # on any): they become code-scanning alerts, and an open alert fails "Open code-scanning
      # alerts" (codeql-alerts.yml, which waits for this workflow) — that is where Bandit gates.
      - name: Bandit (SARIF)
        # `-r .` walks *.py ONLY, so tools/panel-helper — Python with a shebang and no extension —
        # was invisible to it. That file is the ROOT-OWNED end of the sudo boundary: the one place
        # in the repo where a finding matters most was the one place bandit never looked. It is
        # named explicitly alongside the recursive walk. (flake8 and compileall had the same blind
        # spot; see tools/run-tests.sh.)
        run: |
          FLAGS="-r . tools/panel-helper -x ./venv,./.github,./tests"
          SKIPS="B101,B104,B404,B601,B602,B603,B604,B607,B507,B110,B112"
          # shellcheck disable=SC2086  # deliberate word-splitting of the flag list
          bandit $FLAGS --skip "$SKIPS" -f sarif -o bandit.sarif || true
          # ...and again as JSON, purely to read errors[]. A file Bandit cannot PARSE is recorded
          # there, contributes zero results, and exits 0 — so the file is reported clean and the
          # SARIF says nothing about it. Proven by execution: with a syntax error in
          # panel/ops/system_ops.py — the module holding the privilege boundary — bandit exited 0
          # with `results: 0` and one entry in errors[]. The realistic trigger is version skew,
          # not a typo: this job pins Python 3.11 while ci.yml tests the panel on 3.14, so any
          # newer syntax in a panel module silently drops that file from the scan.
          # shellcheck disable=SC2086
          bandit $FLAGS --skip "$SKIPS" -f json -o bandit.json || true
          if [ "$(jq '.errors | length' bandit.json)" != "0" ]; then
            echo "::error::Bandit could not read some files — they were NOT scanned:"
            jq -r '.errors[] | "  \(.filename): \(.reason)"' bandit.json
            exit 1
          fi
      - name: Upload Bandit results to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  sast-semgrep:
    name: Deep SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab (code scanning), as Bandit does
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Semgrep scans the working tree. The job token can write code-scanning alert state;
          # only upload-sarif needs it, and it is handed that directly (see the Bandit job).
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # --no-deps: semgrep.txt is semgrep's whole closure except PyJWT, which semgrep-pyjwt.txt pins
      # past semgrep's own ~=2.13 (every 2.13 is vulnerable). Together they are every package the
      # scan needs, each hash-checked; see .github/ci-requirements/semgrep.in.
      - run: >-
          python -m pip install --quiet --require-hashes --only-binary :all: --no-deps
          -r .github/ci-requirements/semgrep.txt
          -r .github/ci-requirements/semgrep-pyjwt.txt
      # Registry rulesets, fetched anonymously (no Semgrep account/token needed):
      # general security-audit + Python + Flask + command-injection + secrets. This
      # catches real code vulns (injection, SSRF, path traversal, unsafe redirects,
      # weak crypto, template XSS, etc.).
      #
      # GATING, through code scanning. This used to be informational: `|| true` and the findings
      # printed to the job summary only, which nothing reads — while the panel's update gate
      # (system_ops._remote_ci_state) said in its docstring that Semgrep gated. It did not. The
      # findings now go to code scanning as SARIF (category semgrep), like Bandit's, so an open
      # one fails "Open code-scanning alerts" on main (codeql-alerts.yml, which waits for this
      # workflow too) and on a PR (codeql.yml's pr-alerts), and the panel does not offer the
      # commit. A false positive is dismissed in the Security tab, or marked `nosemgrep` in the
      # code as before; it never needs the gate turned off. The summary is kept for reading.
      #
      # Every finding has been triaged: the real ones were fixed, and each false positive
      # carries a `nosemgrep: <rule> -- <reason>` comment above it, so what this prints is
      # new. One rule is excluded outright: var-in-script-tag flags EVERY value inside a
      # <script>, |tojson included — 23 findings, none real. tests/template_actions_test.py
      # enforces what it is for (|tojson, |int or a literal choice) and fails the build.
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/security-audit --config p/python --config p/flask \
            --config p/command-injection --config p/secrets \
            --exclude-rule generic.html-templates.security.var-in-script-tag.var-in-script-tag \
            --exclude venv --exclude .github --exclude data --exclude tests \
            --sarif-output=semgrep.sarif \
            --metrics=off > semgrep.txt 2>&1 || rc=$?
          {
            echo '### 🛡️ Semgrep SAST';
            echo '';
            echo '```';
            tail -c 12000 semgrep.txt 2>/dev/null || echo '(semgrep produced no output — it did not run)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          # Findings do not fail THIS step (Semgrep exits 0 on them without --error); they gate
          # through code scanning. A scan that did not complete does fail it: a missing SARIF
          # would otherwise upload nothing, and nothing reads as clean.
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep wrote no SARIF (exit ${rc:-0}) — the code was not scanned; see the summary."
            exit 1
          fi
          # Semgrep writes the findings a `nosemgrep` comment suppresses into the SARIF too, marked
          # `"suppressions": [{"kind": "inSource"}]`, and code scanning opened an alert for every one
          # of them anyway: 26 triaged false positives became open alerts on the first upload, and
          # each would have failed the alerts gate. Only unsuppressed results are uploaded; a
          # suppression is still visible in the code, next to the reason written for it.
          jq '.runs |= map(.results |= map(select((.suppressions // []) | length == 0)))' \
            semgrep.sarif > semgrep.open.sarif
          mv semgrep.open.sarif semgrep.sarif
      - name: Upload Semgrep results to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
