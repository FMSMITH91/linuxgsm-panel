name: ClusterFuzzLite artifact cleanup

# Deletes every cifuzz-* artifact that provably did not come from a run of this repository's main,
# and main's own fuzz builds (cifuzz-build-*) older than 14 days, without ever downloading or
# reading one.
#
# WHY THIS EXISTS
#   ClusterFuzzLite reads back the newest artifact of each cifuzz-* name from ANY run in this
#   repository (see cflite_pr.yml), and a fork's pull request runs its own copy of a workflow and
#   can upload one. So every job that reads them first checks that each came from main here, and
#   fails if one did not: "fuzz the diff (address)", a required check, then fails on every pull
#   request that touches fuzzed code, and the nightly batch, prune and coverage jobs stop, until
#   the artifact is gone. Nothing removed it but a person, and it would otherwise sit there for the
#   whole 90-day retention. This removes it at its next scheduled run (every six hours, though GitHub may delay or
#   drop a scheduled run), or at once when run by hand.
#
# WHAT IT DELETES, AND WHAT IT DOES NOT
#   Only an artifact whose run names its branch, its head repository and this repository, and
#   whose branch is not main or whose head repository is not this one. An artifact with any of
#   those missing is listed and kept: the guards refuse it too, so it stays visible there, and if
#   GitHub ever stopped returning one of the fields, this must not read every artifact, main's
#   corpus included, as foreign and delete it. Each deletion is a ::warning:: naming the artifact,
#   its run and the repository it came from, so the record of an upload survives the upload.
#
# OLD BUILDS
#   ClusterFuzzLite's build upload has no retention setting, so each main build (about 450 MB)
#   stayed 90 days. The novelty check reads only the build of a pull request's base commit and the
#   two before it (cflite_build.yml), so a main build older than 14 days is deleted, except the
#   three newest, which stay however old they are (a quiet main keeps the builds the next pull
#   request needs). Only cifuzz-build-* from main here, with a creation time: the corpus
#   (cifuzz-corpus-*) and cifuzz-coverage-latest are the nightly state and are never aged out.
#
# ON MAIN, ON A SCHEDULE
#   Scheduled and manual runs only, never a pull request, so its token may write: actions: write
#   (delete an artifact) and nothing else, no checkout, nothing run from the tree. It NEVER fails:
#   its check lands on main's head, where the panel's update gate and deploy.yml read a failure as
#   main being broken, and a GitHub API hiccup every six hours is not that. Everything it finds or
#   cannot do is a ::warning::; the fuzz jobs' own guards still refuse a foreign artifact.
#
# EGRESS, AND A MANUAL RUN ON ANOTHER BRANCH
#   Harden-Runner blocks every host but api.github.com, the one host its runs call (github.com is
#   on every list). A host missing from it fails the run on main, so a change to it is tried first
#   by a manual run on its branch (gh workflow run cflite_cleanup.yml --ref <branch>). Such a run
#   lists and judges every artifact as main's does and deletes nothing ("would delete"): deleting
#   stays main's alone.
on:
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:
  # zizmor: ignore[concurrency-limits] its check lands on main's head, where a cancelled pending run reads as a failure

permissions: {}

jobs:
  cleanup:
    name: delete fuzz artifacts not made on main here
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: github.repository == 'FMSMITH91/linuxgsm-panel' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    permissions:
      actions: write   # list and delete artifacts; nothing is downloaded or checked out
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Delete every cifuzz-* artifact that provably came from elsewhere, and old main builds
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # A manual run on another branch deletes nothing (see EGRESS at the top).
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        run: |
          set -uo pipefail
          if ! rows="$(gh api --paginate --jq '
            .artifacts[] | select((.expired | not) and (.name | startswith("cifuzz-")))
            | [.name, .id, .workflow_run.id, .workflow_run.head_branch,
               .workflow_run.head_repository_id, .workflow_run.repository_id, .created_at] | @tsv' \
            -- "repos/${REPO}/actions/artifacts?per_page=100")"; then
            echo "::warning::could not list the repository's artifacts; nothing deleted this time."
            exit 0
          fi
          foreign="$(awk -F'\t' 'NF && $4 != "" && $5 != "" && $6 != "" && ($4 != "main" || $5 != $6)' <<< "${rows}")"
          unknown="$(awk -F'\t' 'NF && ($4 == "" || $5 == "" || $6 == "")' <<< "${rows}")"
          echo "stored cifuzz-* artifacts: $(grep -c . <<< "${rows}" || true); from elsewhere: $(grep -c . <<< "${foreign}" || true); provenance unknown, kept: $(grep -c . <<< "${unknown}" || true)"
          if [ -n "${unknown}" ]; then
            echo "::warning::Kept, as their run does not say where they came from (the fuzz jobs still refuse them; delete by hand once looked at). (name, id, run, branch, head repository id, repository id, created):"
            printf '%s\n' "${unknown}"
          fi
          # Main's own builds, newest first; the three newest are kept at any age. ISO-8601 UTC
          # times compare as text.
          if cutoff="$(date -u -d '14 days ago' '+%Y-%m-%dT%H:%M:%SZ')"; then
            old="$(awk -F'\t' 'NF && index($1, "cifuzz-build-") == 1 && $4 == "main" && $5 != "" && $5 == $6 && $7 ~ /^[0-9]{4}-/' <<< "${rows}" \
              | sort -t$'\t' -k7,7r | tail -n +4 | awk -F'\t' -v cutoff="${cutoff}" '$7 < cutoff')"
          else
            echo "::warning::could not work out the 14-day cutoff; no old build deleted this time."
            old=""
          fi
          echo "main builds older than 14 days, beyond the three newest: $(grep -c . <<< "${old}" || true)"
          while IFS=$'\t' read -r name id run branch head repo created; do
            [ -n "${name}" ] || continue
            if ! [[ "${id}" =~ ^[0-9]+$ ]]; then
              echo "::warning::artifact ${name} has no numeric id (${id}); nothing deleted for it."
              continue
            fi
            if [ "${DRY_RUN:-}" = "true" ]; then
              echo "would delete ${name} (artifact ${id}, run ${run}, branch ${branch}, head repository ${head}, created ${created}); not on main, so nothing is deleted"
              continue
            fi
            if [ "${head}" = "${repo}" ] && [ "${branch}" = "main" ]; then
              echo "deleting old main build ${name} (artifact ${id}, run ${run}, created ${created})"
            else
              echo "::warning::deleting ${name} (artifact ${id}, run ${run}, branch ${branch}, head repository ${head}; this repository is ${repo})"
            fi
            if ! gh api -X DELETE --silent -- "repos/${REPO}/actions/artifacts/${id}"; then
              # Gone already (another run, or a person) is the outcome wanted.
              if gh api --silent -- "repos/${REPO}/actions/artifacts/${id}"; then
                echo "::warning::could not delete artifact ${id} (${name}); the fuzz jobs still refuse it."
                continue
              fi
              echo "artifact ${id} was already gone"
            fi
          done < <(printf '%s\n%s\n' "${foreign}" "${old}")
