name: ClusterFuzzLite

# ClusterFuzzLite is OSS-Fuzz's engine packaged to run on any repository — same base images, same
# build contract (.clusterfuzzlite/{Dockerfile,build.sh,project.yaml}), no enrolment needed.
#
# It overlaps with fuzz.yml, deliberately and differently: fuzz.yml runs every target for a fixed
# 60s on each push, while this runs in 'code-change' mode, fuzzing only what the diff actually
# touched and reporting a crash as a SARIF finding in the Security tab next to the CodeQL and
# Bandit alerts. Keeping both is a choice — fuzz.yml is the broad sweep, this is the targeted one.
on:
  pull_request:
    branches: [ main ]

# Supersede rather than stack: ClusterFuzzLite fuzzes the DIFF, and is capped at 30m. Without this, pushing
# three times to a PR leaves three of them running at once on superseded code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-change:
    name: fuzz the diff (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload-sarif writes the crash into code scanning
      pull-requests: read      # the scope step lists the pull request's files
      actions: read            # the corpus, coverage and main's builds are Actions artifacts
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The workflow runs on EVERY pull request, so this job can be a required check: a required
      # check whose workflow did not run holds the pull request forever. A pull request that
      # changes none of `scope` passes here without fuzzing; the list is what this workflow's
      # `paths:` filter was. Anything but a pull request always fuzzes, and so does a pull request
      # whose file list cannot be read.
      - name: Does this pull request change what this job fuzzes?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            scope=(
              # A directory since the ssh_manager split: the old
              # 'panel/ops/ssh_manager.py' never matched again, and "fuzz the diff"
              # silently stopped running for the four harnesses that target it.
              'panel/ops/ssh_manager/**'
              'panel/ops/system_ops.py'
              'panel/core/terminal.py'
              'tests/fuzz/**'
              '.github/workflows/cflite_pr.yml'
              '.clusterfuzzlite/**'
              'requirements.txt'
            )
            if files="$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
                        --jq '.[] | .filename, (.previous_filename // empty)')"; then
              run=false
              while IFS= read -r f; do
                for g in "${scope[@]}"; do
                  # shellcheck disable=SC2053 # $g is a glob on purpose
                  if [[ "$f" == $g ]]; then run=true; fi
                done
              done <<< "$files"
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "this pull request changes what this job fuzzes: ${run}"
      # ClusterFuzzLite keeps its corpus, its coverage report and main's builds as Actions artifacts
      # named cifuzz-* (no storage repository is configured, so its filestore is the Actions one),
      # and reads back the newest artifact of each name from ANY run in this repository, with no
      # branch filter (oss-fuzz infra/cifuzz/filestore/github_actions/github_api.py find_artifact).
      # A fork's pull request runs its own copy of a workflow and can upload an artifact by that
      # name. The build step below then takes the coverage report from it to pick which targets to
      # keep, the run step unpacks its corpus with an unchecked tarfile.extractall (a path-traversal
      # TODO upstream) in a container holding this job's token, and a crash makes it RUN the stored
      # build to see whether the crash is new. So before either reads anything, every stored
      # cifuzz-* artifact must come from a run of this repository's main: cflite_batch.yml,
      # cflite_cron.yml and cflite_build.yml, which run nowhere else. The same block guards each of
      # them, and part29 holds the copies equal.
      #
      # A check before a read is not the read: an artifact uploaded after it passes is read
      # unchecked. So it runs three times here. Before the build, which reads the coverage report
      # at its end, minutes later. Again directly before the fuzzing step, which reads the corpus
      # within seconds of starting, so that window is seconds rather than the whole build. And
      # after fuzzing, turning the job red on anything that arrived meanwhile, including the build
      # of the base commit a crash makes the fuzzing step download and run, which no check here can
      # reach in time. What would close the race is the repository setting that has every outside
      # contributor's workflow approved before it runs (Settings > Actions > General > fork pull
      # request workflows: all outside contributors). As of 2026-10-03 it is set to first-time
      # contributors only, an owner decision; cflite_cleanup.yml deletes what a fork uploaded.
      - name: Every stored fuzz artifact was made on main here
        if: steps.scope.outputs.run == 'true'
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rows="$(gh api "repos/${REPO}/actions/artifacts?per_page=100" --paginate --jq '
            .artifacts[] | select((.expired | not) and (.name | startswith("cifuzz-")))
            | [.name, .id, .workflow_run.id, .workflow_run.head_branch,
               .workflow_run.head_repository_id, .workflow_run.repository_id] | @tsv')"
          foreign="$(awk -F'\t' 'NF && ($4 != "main" || $5 == "" || $5 != $6)' <<< "${rows}")"
          echo "stored cifuzz-* artifacts: $(grep -c . <<< "${rows}" || true)"
          if [ -n "${foreign}" ]; then
            echo "::error::A cifuzz-* artifact here was not made by a run of this repository's main. Nothing is fuzzed until it is deleted: run the ClusterFuzzLite artifact cleanup workflow (cflite_cleanup.yml, also every 6 hours), or gh api -X DELETE repos/${REPO}/actions/artifacts/<id>. (name, id, run, branch, head repository id, repository id):"
            printf '%s\n' "${foreign}"
            exit 1
          fi

      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        if: steps.scope.outputs.run == 'true'
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
          # bad-build-check is left ON (the default). These targets are PyInstaller bundles, so the
          # failure to worry about is a fuzzer that builds fine and then dies on its first import —
          # which is exactly what that check catches.

      - name: Every stored fuzz artifact was made on main here, again just before fuzzing
        if: steps.scope.outputs.run == 'true'
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rows="$(gh api "repos/${REPO}/actions/artifacts?per_page=100" --paginate --jq '
            .artifacts[] | select((.expired | not) and (.name | startswith("cifuzz-")))
            | [.name, .id, .workflow_run.id, .workflow_run.head_branch,
               .workflow_run.head_repository_id, .workflow_run.repository_id] | @tsv')"
          foreign="$(awk -F'\t' 'NF && ($4 != "main" || $5 == "" || $5 != $6)' <<< "${rows}")"
          echo "stored cifuzz-* artifacts: $(grep -c . <<< "${rows}" || true)"
          if [ -n "${foreign}" ]; then
            echo "::error::A cifuzz-* artifact here was not made by a run of this repository's main. Nothing is fuzzed until it is deleted: run the ClusterFuzzLite artifact cleanup workflow (cflite_cleanup.yml, also every 6 hours), or gh api -X DELETE repos/${REPO}/actions/artifacts/<id>. (name, id, run, branch, head repository id, repository id):"
            printf '%s\n' "${foreign}"
            exit 1
          fi

      - name: Fuzz the changed code (${{ matrix.sanitizer }})
        id: run
        if: steps.scope.outputs.run == 'true'
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python   # run_fuzzers defaults to c++ — it does not inherit the build's setting
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The vendor's PR value. It is split evenly across the targets kept: every target when
          # there is no coverage report yet, else the ones the diff touches. Each target's process
          # is killed 10s after its slice, and its start-up runs outside the slice, so a target
          # whose imports take longer than that was killed every run ("process timed out") before
          # it finished: at 180s over six targets the four ssh_manager ones were, after ~27s of
          # Atheris instrumenting SQLAlchemy and Flask. The harnesses now pre-load those
          # uninstrumented (fuzz_game_status says how), and part29 holds both.
          fuzz-seconds: 600
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true

      - name: Report a crash as a code-scanning finding
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif

      # The checks above ran before the build and before fuzzing; an artifact uploaded after them
      # was read without one. Looking again afterwards cannot undo that read, but it turns this
      # check red rather than leaving it green over it.
      - name: Every stored fuzz artifact was made on main here, after fuzzing too
        if: always() && steps.scope.outputs.run == 'true'
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rows="$(gh api "repos/${REPO}/actions/artifacts?per_page=100" --paginate --jq '
            .artifacts[] | select((.expired | not) and (.name | startswith("cifuzz-")))
            | [.name, .id, .workflow_run.id, .workflow_run.head_branch,
               .workflow_run.head_repository_id, .workflow_run.repository_id] | @tsv')"
          foreign="$(awk -F'\t' 'NF && ($4 != "main" || $5 == "" || $5 != $6)' <<< "${rows}")"
          echo "stored cifuzz-* artifacts: $(grep -c . <<< "${rows}" || true)"
          if [ -n "${foreign}" ]; then
            echo "::error::A cifuzz-* artifact here was not made by a run of this repository's main. Nothing is fuzzed until it is deleted: run the ClusterFuzzLite artifact cleanup workflow (cflite_cleanup.yml, also every 6 hours), or gh api -X DELETE repos/${REPO}/actions/artifacts/<id>. (name, id, run, branch, head repository id, repository id):"
            printf '%s\n' "${foreign}"
            exit 1
          fi
