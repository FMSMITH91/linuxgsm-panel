name: Lighthouse

# Boot a throwaway panel, sign in (tools/lhci-login.js) and run Lighthouse over the pages
# .github/lighthouserc.json lists: the dashboard, a server, install, remotes, users, groups,
# logs and account, not only the login page. CLS, the accessibility and
# best-practices scores and redirects FAIL the check (.github/lighthouserc.json); only the
# performance score is a warning (it wobbles run-to-run). It is a required check, and a red
# result on main holds the deploy (deploy.yml's verify) and the panel's update offer like any
# other check.

on:
  # Docs-only pushes skip the Lighthouse run — a README/LICENSE edit can't change the rendered UI
  # it audits. A pull request has no path filter (a required check must report): its scope step
  # skips the audit for a docs-only one, and audits every other.
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      # Lighthouse boots the panel and audits RENDERED pages, so only things that can change what
      # a page looks like matter to it. Test files, the shell installers, the fuzzing harness and
      # the shell installers cannot — a tests-only push was paying for a full app boot and audit
      # to measure something it could not have altered. Pushes only: see pull_request below.
      - 'tests/**'
      - '.clusterfuzzlite/**'
      - '*.sh'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group, as in ci.yml and security.yml: on main a manual run shares the
# ref with a push run, and without it the manual run CANCELLED the in-progress push run, leaving a
# "cancelled" required check on that commit, which deploy.yml and the panel's update gate read as
# a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    # A required check by this name (.github/required-checks.txt): keep it.
    name: lighthouse
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # the scope step lists the pull request's files
      actions: read   # the reuse step reads the pull request run's jobs
      checks: read    # ...and the check runs on the pull request's head
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The panel and Lighthouse run here; neither needs the job token.
          persist-credentials: false

      # A pull request that changes only documentation passes here without the steps below, and
      # still reports this job by its name, as a required check must: .github/scripts/pr_scope.py
      # says what counts and why. Anything else, and anything it cannot establish, runs them all.
      - name: Does this pull request change anything but documentation?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/pr_scope.py --event "$EVENT" --repo "$GITHUB_REPOSITORY"
          --pr "$PR" --head-sha "$HEAD_SHA"

      # On a push to main: whether the pull request this push merged already passed this job on the
      # exact tree pushed. When it did, the steps below are skipped and the job still reports success
      # under its name, which the panel's update gate and deploy.yml read on main's commit like any
      # check there. What it proves, and why that is enough, is .github/scripts/reuse_pr_result.py's
      # docstring; anything it cannot establish runs every step. The work step it names is the one a
      # documentation-only pull request skips, so a pass that skipped it is never reused. It fetches
      # the pull request's head anonymously (the checkout keeps no token; this repository is public).
      - name: Did the merged pull request pass this job on the same tree?
        id: reuse
        if: github.event_name == 'push' && steps.scope.outputs.docs_only != 'true'
        env:
          CHECK_NAME: lighthouse
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/reuse_pr_result.py --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"
          --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --workflow .github/workflows/lighthouse.yml
          --check-name "$CHECK_NAME"
          --work-step "Run Lighthouse CI"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true' && steps.reuse.outputs.reuse != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true' && steps.reuse.outputs.reuse != 'true'
        # A block, not a plain scalar: `:all: ` is a YAML mapping indicator on a `run:` line.
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r panel/install/requirements.txt

      - name: Start a throwaway panel (HTTP) and wait for it
        if: steps.scope.outputs.docs_only != 'true' && steps.reuse.outputs.reuse != 'true'
        run: |
          python tools/lhci_serve.py > panel.log 2>&1 &
          echo $! > panel.pid
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:5000/healthz && { echo; echo "panel up"; break; }
            sleep 1
          done
          curl -sf http://127.0.0.1:5000/healthz > /dev/null || { echo "panel failed to start"; cat panel.log; exit 1; }

      - name: Run Lighthouse CI
        if: steps.scope.outputs.docs_only != 'true' && steps.reuse.outputs.reuse != 'true'
        # URL + puppeteer login live in .github/lighthouserc.json so we audit the real
        # (authenticated) dashboard, not just the login page.
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: .github/lighthouserc.json
          uploadArtifacts: true

      - name: Stop the panel
        if: always() && steps.scope.outputs.docs_only != 'true' && steps.reuse.outputs.reuse != 'true'
        run: kill "$(cat panel.pid)" 2>/dev/null || true
