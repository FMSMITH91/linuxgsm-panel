name: Lighthouse

# Boot a throwaway panel, sign in (tools/lhci-login.js) and run Lighthouse over the pages
# .github/lighthouserc.json lists: the dashboard, a server, install, remotes, users, groups,
# logs and account, not only the login page. CLS, the accessibility and
# best-practices scores and redirects FAIL the check (.github/lighthouserc.json); only the
# performance score is a warning (it wobbles run-to-run). It is a required check, and a red
# result on main holds the deploy (deploy.yml's verify) and the panel's update offer like any
# other check.

on:
  # Docs-only pushes skip the Lighthouse run — a README/LICENSE edit can't change the rendered UI
  # it audits. A pull request has no path filter (a required check must report): its scope step
  # skips the audit for a docs-only one, and audits every other.
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      # Lighthouse boots the panel and audits RENDERED pages, so only things that can change what
      # a page looks like matter to it. Test files, the shell installers, the fuzzing harness and
      # the shell installers cannot — a tests-only push was paying for a full app boot and audit
      # to measure something it could not have altered. Pushes only: see pull_request below.
      - 'tests/**'
      - '.clusterfuzzlite/**'
      - '*.sh'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

# The event is part of the group, as in ci.yml and security.yml: on main a manual run shares the
# ref with a push run, and without it the manual run CANCELLED the in-progress push run, leaving a
# "cancelled" required check on that commit, which deploy.yml and the panel's update gate read as
# a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    # A required check by this name (.github/required-checks.txt): keep it.
    name: lighthouse
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # the scope step lists the pull request's files
      actions: read   # the reuse step reads the pull request run's jobs
      checks: read    # ...and the check runs on the pull request's head
    steps:
      # Block mode. The hosts are the ones this job's Harden-Runner insights recorded over pull
      # request runs from 2026-11-17 and 2026-11-18, beyond the Actions service names the agent
      # allows by itself: GitHub (the scope and reuse steps), PyPI (the pip install), npm's registry
      # (Lighthouse CI's `npm ci`; setup-node takes Node from the image's tool cache), and the two the
      # throwaway PANEL fetches for the pages it renders, LinuxGSM's game list from
      # raw.githubusercontent.com and its game icons from linuxgsm.com, so the pages audited are the
      # ones a panel with its outside services on serves. What it refuses is Chrome's own traffic
      # (component updates, Safe Browsing, autofill and password-leak lookups to Google hosts). That
      # traffic is the browser's, not the page's: the page's CSP lets it reach only its own origin,
      # and Lighthouse scores the page's requests and console, so refusing it changes no measured
      # request. The js coverage job (ci.yml) has run headless Chrome under the same refusal.
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            linuxgsm.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The panel and Lighthouse run here; neither needs the job token.
          persist-credentials: false

      # A pull request that changes nothing this job measures (documentation, or only files on its
      # list in .github/scripts/pr_scope.py JOB_IRRELEVANT) passes here without the steps below, and
      # still reports this job by its name, as a required check must. Anything else, and anything
      # it cannot establish, runs them all.
      - name: Does this pull request change anything this job measures?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/pr_scope.py --event "$EVENT" --repo "$GITHUB_REPOSITORY"
          --pr "$PR" --head-sha "$HEAD_SHA" --job "lighthouse"

      # On a push to main: whether the pull request this push merged already passed this job on the
      # exact tree pushed. When it did, the steps below are skipped and the job still reports success
      # under its name, which the panel's update gate and deploy.yml read on main's commit like any
      # check there. What it proves, and why that is enough, is .github/scripts/reuse_pr_result.py's
      # docstring; anything it cannot establish runs every step. The work step it names is the one a
      # documentation-only pull request skips, so a pass that skipped it is never reused. It fetches
      # the pull request's head anonymously (the checkout keeps no token; this repository is public).
      - name: Did the merged pull request pass this job on the same tree?
        id: reuse
        if: github.event_name == 'push' && steps.scope.outputs.skip != 'true'
        env:
          CHECK_NAME: lighthouse
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/reuse_pr_result.py --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"
          --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --workflow .github/workflows/lighthouse.yml
          --check-name "$CHECK_NAME"
          --work-step "Run Lighthouse CI"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        # A block, not a plain scalar: `:all: ` is a YAML mapping indicator on a `run:` line.
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r panel/install/requirements.txt

      - name: The panel's requirements are complete (install.sh's pip check)
        if: steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        run: bash .github/scripts/panel_pip_check.sh

      - name: Start a throwaway panel (HTTP) and wait for it
        if: steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        run: |
          python tools/lhci_serve.py > panel.log 2>&1 &
          echo $! > panel.pid
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:5000/healthz && { echo; echo "panel up"; break; }
            sleep 1
          done
          curl -sf http://127.0.0.1:5000/healthz > /dev/null || { echo "panel failed to start"; cat panel.log; exit 1; }

      # Lighthouse CI comes from .github/lhci: package.json pins @lhci/cli (and the puppeteer-core
      # the sign-in script drives) exactly, and package-lock.json pins every package beneath them
      # with its sha512, which `npm ci` checks, refusing the install on any mismatch or on a lockfile
      # that disagrees with package.json. No package's install script runs (--ignore-scripts, and
      # the folder's .npmrc for anyone running npm there), and nothing downloads a browser: the
      # tree has no install scripts and the audit drives the runner image's own Chrome. Dependabot
      # moves the folder (.github/dependabot.yml); osv-scanner audits its lockfile
      # (security-code.yml). It replaced a third-party action whose newest release resolved an
      # @lhci/cli with sixteen published advisories.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        with:
          node-version: "24"

      - name: Install Lighthouse CI from its lockfile
        if: steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        working-directory: .github/lhci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Lighthouse CI
        if: steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        # URL + puppeteer login live in .github/lighthouserc.json so we audit the real
        # (authenticated) dashboard, not just the login page. collect audits the pages, and assert
        # exits non-zero on any failed "error" assertion, failing this step with each result printed
        # in the log. No upload: no artifact (nothing reads the reports, and the log holds the
        # result), and never temporaryPublicStorage, which sends the reports to a public
        # third-party host. CHROME_PATH is the browser both Lighthouse and puppeteer launch.
        run: |
          set -euo pipefail
          chrome=""
          for c in google-chrome chromium; do
            if command -v "${c}" >/dev/null; then chrome="$(command -v "${c}")"; break; fi
          done
          if [ -z "${chrome}" ]; then
            echo "::error::no Chrome on this runner image; Lighthouse did not run."
            exit 1
          fi
          export CHROME_PATH="${chrome}"
          lhci=.github/lhci/node_modules/.bin/lhci
          "${lhci}" collect --config=.github/lighthouserc.json
          "${lhci}" assert --config=.github/lighthouserc.json

      - name: Stop the panel
        if: always() && steps.scope.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        run: kill "$(cat panel.pid)" 2>/dev/null || true
