name: Deploy

# Auto-deploy to the panel host after CI passes on main. DORMANT by default: the job
# only runs when the repo variable DEPLOY_ENABLED == 'true', so committing this file
# changes nothing until you opt in. It deploys by running install.sh's UPDATE path
# (snapshot -> git pull -> restart -> health-check -> AUTO-ROLLBACK on failure), so a
# bad release can't leave the panel down.
#
# ── One-time setup to enable ──────────────────────────────────────────────────
#  1. Tailscale OAuth client (admin console -> Settings -> OAuth clients), scope
#     "auth_keys", tag: tag:ci. Save as repo SECRETS:
#        TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET
#  2. Tailnet ACL: allow tag:ci to SSH the host as the deploy user, e.g.
#        "ssh": [{ "action": "accept", "src": ["tag:ci"],
#                  "dst": ["tag:server"], "users": ["ubuntu"] }]
#     (the host must have `tailscale up --ssh`).
#  3. Repo VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#        DEPLOY_ENABLED = true
#        DEPLOY_HOST    = <the host's MagicDNS name or tailnet IP>
#        DEPLOY_USER    = ubuntu           # optional, defaults to ubuntu
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]

# Least-privilege GITHUB_TOKEN: deploy reads the repo and SSHes to the host; no write needed.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only after CI SUCCEEDED on a PUSH to main, and only when explicitly enabled.
    #
    # `event == 'push'` is the load-bearing clause. CI also runs on pull_request, and for a PR
    # from a FORK the resulting workflow_run carries the HEAD REPO's branch name — a fork's
    # default branch is main, so head_branch == 'main' was satisfied by any fork PR opened from
    # that fork's default branch, and an outside contributor's PR triggered an unattended
    # production deploy on the live host (service restart, health check, possible rollback).
    #
    # Not a code-injection vector — the deploy SSHes in and runs `git checkout origin/main --
    # install.sh`, i.e. the BASE repo's main, never the PR's code — but nobody asked for the
    # deploy. codeql-alerts.yml already distinguishes the two event kinds for its own reasons;
    # this is the mirror image of that clause.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via safe self-update (snapshot + health-check + rollback)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set repo variable DEPLOY_HOST to the tailnet host}"
          U="${DEPLOY_USER:-ubuntu}"
          # Tailscale SSH handles auth (no key needed); install.sh does the safe update.
          # PANEL_NO_UPGRADE=1: the auto-deploy is a panel-only update — it must never
          # apt-upgrade or reboot the deploy host (that would drop this SSH session and fail
          # the job). OS updates on that host stay a manual/interactive decision.
          # Refresh install.sh ITSELF to the latest before running it. The deploy executes the
          # on-disk updater, so a bug in a shipped install.sh would otherwise trap the host on that
          # broken version forever (it crashes before it can pull the fix). Updating just install.sh
          # first — the rest of the tree is still updated by install.sh under its own
          # snapshot/health-check/rollback — also means the deploy validates the CURRENT commit's
          # updater, not the previous one.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$U@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          # WHERE the panel is, asked of the host instead of assumed.
          #
          # install.sh supports two service models: a per-user install under the invoking user's
          # home (systemctl --user), and a ROOT install that runs as the dedicated 'lgsmpanel'
          # service user out of ITS home (a system unit). This step hardcoded the first —
          # `cd ~/linuxgsm-panel` — so the day a host was converted to the hardened root model the
          # deploy started failing on every single run, with `cd: No such file or directory`, and
          # kept failing 62 times before anyone read the log. The unit knows where it lives; ask it.
          PD="$(systemctl show -p WorkingDirectory --value linuxgsm-panel 2>/dev/null || true)"

          if [ -n "${PD}" ] && sudo -n test -d "${PD}"; then
              # System install. The service user's home is 0750, so the deploy user cannot even
              # stat the checkout — every read here goes through sudo. The git work runs AS THE
              # OWNER, not as root: root on a repo it does not own trips git's safe.directory.
              OWNER="$(sudo -n stat -c %U "${PD}")"
              echo "System install at ${PD} (service user ${OWNER})"
              sudo -n -u "${OWNER}" git -C "${PD}" fetch --quiet origin main
              sudo -n -u "${OWNER}" git -C "${PD}" checkout origin/main -- install.sh
              sudo -n env PANEL_NO_UPGRADE=1 bash "${PD}/install.sh"
          elif [ -d "${HOME}/linuxgsm-panel" ]; then
              echo "Per-user install at ${HOME}/linuxgsm-panel"
              cd "${HOME}/linuxgsm-panel"
              git fetch --quiet origin main
              git checkout origin/main -- install.sh
              PANEL_NO_UPGRADE=1 bash install.sh
          else
              echo "No panel install found on this host, so there was nothing to deploy to." >&2
              echo "  - the linuxgsm-panel unit reported WorkingDirectory='${PD}'" >&2
              echo "  - and there is no ${HOME}/linuxgsm-panel" >&2
              echo "A system install also needs this account to have passwordless sudo." >&2
              exit 1
          fi
          REMOTE
