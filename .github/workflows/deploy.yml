name: Deploy

# Auto-deploy to the panel host after CI passes on main. DORMANT by default: the job
# only runs when the repo variable DEPLOY_ENABLED == 'true', so committing this file
# changes nothing until you opt in. It deploys by running install.sh's UPDATE path
# (snapshot -> git pull -> restart -> health-check -> AUTO-ROLLBACK on failure), so a
# bad release can't leave the panel down.
#
# ── One-time setup to enable ──────────────────────────────────────────────────
#  1. A Tailscale OpenID Connect credential — workload identity, NO stored secret (admin
#     console -> Settings -> Trust credentials -> Credential -> OpenID Connect):
#        Issuer:  GitHub Actions
#        Subject: repo:FMSMITH91/linuxgsm-panel:environment:production
#        Scope:   Auth Keys (write), tag: tag:ci
#     Tailscale then accepts only a token GitHub signed for a job of THIS repository running in
#     the `production` environment, which only the branch main may use (step 3). Save the
#     credential's two values — neither is secret — in that ENVIRONMENT, not the repository:
#        TS_OAUTH_CLIENT_ID, TS_AUDIENCE
#     This used to be an OAuth client whose secret sat in a repository secret, readable by a
#     workflow run on ANY branch or tag pushed here — and it puts an SSH session on the deploy
#     host as a sudo-capable account. There is no longer a secret to read.
#  2. Tailnet ACL: allow tag:ci to SSH the host as the deploy user, e.g.
#        "ssh": [{ "action": "accept", "src": ["tag:ci"],
#                  "dst": ["tag:server"], "users": ["ubuntu"] }]
#     (the host must have `tailscale up --ssh`).
#  3. The `production` environment (Settings -> Environments -> New environment), created
#     BEFORE the secrets go into it: Deployment branches and tags -> "Selected branches and
#     tags" -> one BRANCH rule, `main`, and no tag rule. It holds the two values from step 1.
#     Repo VARIABLES (Settings -> Secrets and variables -> Actions -> Variables) stay at
#     repository level — the job's `if` reads DEPLOY_ENABLED before any environment applies:
#        DEPLOY_ENABLED = true
#        DEPLOY_HOST    = <the host's MagicDNS name or tailnet IP>
#        DEPLOY_USER    = ubuntu           # optional, defaults to ubuntu
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]

# Least-privilege GITHUB_TOKEN: deploy reads the repo and SSHes to the host; no write needed.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only after CI SUCCEEDED on a PUSH to main, and only when explicitly enabled.
    #
    # `event == 'push'` is the load-bearing clause. CI also runs on pull_request, and for a PR
    # from a FORK the resulting workflow_run carries the HEAD REPO's branch name — a fork's
    # default branch is main, so head_branch == 'main' was satisfied by any fork PR opened from
    # that fork's default branch, and an outside contributor's PR triggered an unattended
    # production deploy on the live host (service restart, health check, possible rollback).
    #
    # Not a code-injection vector — the deploy ships an installer only from a commit it has proved
    # is on the BASE repo's main (see the verify step), never the PR's code — but nobody asked for
    # the deploy. codeql-alerts.yml already distinguishes the two event kinds for its own reasons;
    # this is the mirror image of that clause.
    #
    # This `if` decides WHETHER to deploy. It cannot prove WHAT: head_branch is a SHORT name, and
    # GitHub compares strings IGNORING CASE, so any ref whose short name matches main
    # case-insensitively passes it — a TAG `main`, a branch `Main`, a tag `MAIN`. One of those
    # pushed with a commit that carries its own workflow named "CI" (on: push) completes as event
    # 'push', head_branch 'main' (or 'Main'), head_repository this repository — every clause below
    # true, and head_sha a commit that was never on main. The repository's ruleset protects
    # refs/heads/main; none of those is that ref. So the verify step requires head_branch to be
    # exactly `main` and proves head_sha is on main itself, before anything is taken from it or the
    # tailnet is joined.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    # The Tailscale login is bound to this environment twice. Its deployment-branch rule admits only
    # the branch main (header, step 3), so no workflow run on another branch or a tag can use it;
    # and the Tailscale credential (header, step 1) accepts only a GitHub OIDC token whose subject
    # names this environment, so there is no secret for any other run to read in the first place.
    # A workflow_run job runs with GITHUB_REF set to the default branch, so this job qualifies.
    environment: production
    # id-token: write lets the Tailscale step ask GitHub for a signed OIDC token (sub
    # repo:FMSMITH91/linuxgsm-panel:environment:production), which Tailscale's credential
    # (header, step 1) exchanges for a one-off auth key. Granted to this job only.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The installer root runs on a system install comes from the commit CI just verified, carried
      # to the host inside the SSH session — not from the host's own checkout (the system-install
      # branch below says why that one cannot be trusted).
      #
      # This step fetches MAIN'S HISTORY, not that commit. It used to check out head_sha directly,
      # which fetches any commit id GitHub will serve: a tag's, another branch's, even a fork's
      # (forks share one object store). The job's `if` cannot rule those out (see above). What
      # makes head_sha safe to ship is being ON MAIN, and only history fetched from
      # refs/heads/main can show that — the verify step checks it there, then reads install.sh out
      # of that commit. Nothing is executed on the runner. Full history, not sparse: a sparse
      # checkout implies a blob-less partial clone, and reading the installer out of an older
      # commit would then need another fetch.
      - name: Fetch main's history (to prove the verified commit is on it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      # BEFORE the tailnet is joined: a run this step refuses never holds a tailnet identity at
      # all, instead of joining and then declining to use it. It hands the deploy step exactly one
      # thing, the path of the installer it read out of the proven commit.
      - name: Verify the commit is on main, and take its installer
        id: verify
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The job's `if` compared head_branch with 'main' IGNORING CASE (GitHub's expressions
          # do), so a branch `Main` or a tag `MAIN` passed it. Compared here exactly, in bash.
          if [ "${HEAD_BRANCH:-}" != "main" ]; then
              echo "::error::head_branch '${HEAD_BRANCH:-}' is not exactly main; nothing was deployed."
              exit 1
          fi
          # The commit whose installer is shipped is the commit the code is pinned to. Carried as
          # a variable, so it has to be exactly a commit id — checked before git ever sees it. A
          # full 40-hex id is also never read as a ref name, whatever tags exist.
          case "${HEAD_SHA:-}" in
              ""|*[!0-9a-f]*) echo "::error::head_sha '${HEAD_SHA:-}' is not a commit id."; exit 1 ;;
          esac
          [ "${#HEAD_SHA}" -eq 40 ] || { echo "::error::head_sha '${HEAD_SHA}' is not a commit id."; exit 1; }
          # PROVE head_sha is on this repository's main before anything is taken from it. The
          # job's `if` cannot (a tag named `main` passes it, and the name check above says only
          # which ref the run CLAIMS to be for).
          #
          # MAIN is spelled out in full: the checkout also fetched every tag, and git resolves a
          # bare `origin/main` as refs/tags/origin/main ahead of the remote-tracking branch, so a
          # pushed tag of that name would answer this check. And it must EXIST by that name before
          # it is read — a missing refs/remotes/origin/main falls through git's lookup to
          # refs/tags/refs/remotes/origin/main, and show-ref --verify is the one read that does not.
          MAIN=refs/remotes/origin/main
          git show-ref --verify --quiet "${MAIN}" \
              || { echo "::error::The checkout has no ${MAIN} to check head_sha against; nothing was deployed."; exit 1; }
          # ON main means on its FIRST-PARENT line, not merely an ancestor. A pull request merged
          # with a merge commit brings every one of its commits into main's ancestry, including an
          # intermediate one whose change was reverted before the merge; a tag `main` on that
          # commit passes the `if` and would pass an ancestry check, and ship an installer main
          # never had. The line holds the commits main's tip has been at — an older one whose CI
          # finished late or was re-run passes (main is append-only: the ruleset blocks force-push
          # and deletion) — plus each commit of a multi-commit push or a rebase merge. One reachable
          # only from a tag, another branch, a fork or the side of a merge does not pass. Nor, since
          # the rule is first-parent, do the commits main was at before a "foxtrot" push: one that
          # fast-forwards main onto a branch that had main merged into it (7e38da7 did this once)
          # moves them to that merge's second parent, and a re-run deploy of one is refused here.
          #
          # Streamed through awk, which reads to the end whatever it finds. `rev-list | grep -q`
          # lets grep exit at the first match, rev-list then dies of SIGPIPE writing the rest, and
          # pipefail fails the check exactly when it holds. A here-string (`grep <<< "$(rev-list)"`)
          # needs a temp file once main's line passes 64 KiB, about 1,600 commits, and fails with
          # nothing read when it cannot write one. `($0 "")` compares as STRINGS: awk compares two
          # values that both look numeric as numbers, and an id of digits and one 'e' does.
          if ! git rev-list --first-parent "${MAIN}" \
               | awk -v want="${HEAD_SHA}" '($0 "") == want { found = 1 } END { exit !found }'; then
              echo "::error::head_sha ${HEAD_SHA} is not on this repository's main; nothing was deployed."
              exit 1
          fi
          # ...and NO OLDER than root's source floor. Every commit main was ever at passes the check
          # above, and a re-run of an old CI run deploys its commit: the installer shipped below runs
          # as root on a system install, pinned to that commit, and can leave that commit's installer
          # in place root-owned. One from before e26a644 read the helper out of the panel-owned .git,
          # so a compromised panel could then plant the helper root installs. install.sh keeps the
          # same floor on the host (ROOT_SRC_FLOOR_SEED; a unit test holds the two equal).
          FLOOR=e26a64417c7992a6d0a0de39e33437a1949efe7f
          if ! git merge-base --is-ancestor "${FLOOR}" "${HEAD_SHA}" 2>/dev/null; then
              echo "::error::head_sha ${HEAD_SHA} predates ${FLOOR}, root's source floor; its installer is not shipped and nothing was deployed."
              exit 1
          fi
          # The installer is read out of THAT commit as committed bytes — not the working tree,
          # which is main's tip and may be a later push whose CI has not finished. A commit with no
          # install.sh, or an empty one, is refused here: an empty file would be sent, run as
          # nothing on the host, and the job would go green having deployed nothing.
          INSTALLER="${RUNNER_TEMP:?}/verified-install.sh"
          if ! git cat-file blob "${HEAD_SHA}:install.sh" > "${INSTALLER}" 2>/dev/null \
             || [ ! -s "${INSTALLER}" ]; then
              echo "::error::${HEAD_SHA} has no install.sh to ship; nothing was deployed."
              exit 1
          fi
          # ...and one that ENFORCES that floor. A commit after e26a644 but before the floor existed
          # passes the ancestry check, and its installer ignores the floor: run as root and placed
          # root-owned, it would let the panel roll root back below e26a644 on the next
          # self-update. Every installer that enforces the floor carries this exact line (install.sh
          # says never to change it, and a unit test holds this copy to it).
          # shellcheck disable=SC2016  # matched literally: ${HELPER_DIR} is text in that line
          if ! grep -qxF 'ROOT_SRC_FLOOR_FILE="${HELPER_DIR}/.source-floor"' "${INSTALLER}"; then
              echo "::error::${HEAD_SHA}'s install.sh predates root's source floor, so it is not shipped; nothing was deployed."
              exit 1
          fi
          echo "installer=${INSTALLER}" >> "${GITHUB_OUTPUT:?}"
          echo "Verified ${HEAD_SHA} on main (tip $(git rev-parse --short "${MAIN}"))."

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          # OIDC workload identity: no secret. The client id and audience are not secret either;
          # what admits this job is GitHub's signed token naming the production environment.
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Deploy via safe self-update (snapshot + health-check + rollback)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INSTALLER: ${{ steps.verify.outputs.installer }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set repo variable DEPLOY_HOST to the tailnet host}"
          U="${DEPLOY_USER:-ubuntu}"
          # Only what the verify step proved: HEAD_SHA is the id it checked, and INSTALLER the file
          # it read out of that commit.
          [ -s "${INSTALLER:-}" ] || { echo "::error::The verify step handed over no installer; nothing was deployed."; exit 1; }
          trap 'rm -f -- "${INSTALLER}"' EXIT
          echo "Deploying ${HEAD_SHA}, verified on main."
          # Tailscale SSH handles auth (no key needed); install.sh does the safe update.
          # PANEL_NO_UPGRADE=1: the auto-deploy is a panel-only update — it must never
          # apt-upgrade or reboot the deploy host (that would drop this SSH session and fail
          # the job). OS updates on that host stay a manual/interactive decision.
          # Run THIS COMMIT'S install.sh, not the one already on the host. The deploy executes the
          # updater, so a bug in a shipped install.sh would otherwise trap the host on that
          # broken version forever (it crashes before it can pull the fix). Taking just install.sh
          # first — the rest of the tree is still updated by install.sh under its own
          # snapshot/health-check/rollback — also means the deploy validates the CURRENT commit's
          # updater, not the previous one.
          #
          # ...and pin the code to that same commit (PANEL_UPDATE_REF), on the system branch below,
          # which is the one that ships an installer. Left to itself install.sh resets to
          # main's tip, so when a second push landed before this run, this commit's
          # installer installed the NEXT commit's code — and that commit's own deploy then found the
          # host already current and took the no-op branch, so its update steps never ran on the
          # host. It also installed a tip whose CI had not finished. install.sh honours the pin
          # only when it is on the first-parent line of the branch it fetched
          # (refs/remotes/origin/main, spelled out in full there too), and moves a checkout on main
          # only forward to it — never backwards, and never sideways onto a pin that does not
          # contain it (a foxtrot push can leave one on the line) — so a run that finishes late (a
          # re-run of an old commit's CI) leaves a newer host where it is, and says why in this log
          # when it holds. A pin it cannot verify on its own fetch (a foxtrot push landed
          # in between) is not replaced by the tip either: the host stays where it is, with a
          # warning in this log, or — when its checkout is not on main — the update stops with an
          # error and this job fails.
          #
          # INSTALLER_B64 is that commit's install.sh, read out by the verify step, prepended to the remote
          # script as a variable, and PANEL_UPDATE_REF beside it. base64 output and a commit id need
          # no quoting, and stdin stays a single stream: under `bash -s` stdin IS the remote script.
          {
              printf 'INSTALLER_B64=%s\n' "$(base64 -w0 "${INSTALLER}")"
              printf 'PANEL_UPDATE_REF=%s\n' "${HEAD_SHA}"
              cat <<'REMOTE'
          set -eu
          # WHERE the panel is, asked of the host instead of assumed.
          #
          # install.sh supports two service models: a per-user install under the invoking user's
          # home (systemctl --user), and a ROOT install that runs as the dedicated 'lgsmpanel'
          # service user out of ITS home (a system unit). This step hardcoded the first —
          # `cd ~/linuxgsm-panel` — so the day a host was converted to the hardened root model the
          # deploy started failing on every single run, with `cd: No such file or directory`, and
          # kept failing 62 times before anyone read the log. The unit knows where it lives; ask it.
          PD="$(systemctl show -p WorkingDirectory --value linuxgsm-panel 2>/dev/null || true)"

          if [ -n "${PD}" ] && sudo -n test -d "${PD}"; then
              # System install. The service user's home is 0750, so the deploy user cannot even
              # stat the checkout — every read here goes through sudo.
              #
              # ROOT RUNS NOTHING OUT OF ${PD}. The checkout belongs to the service user: the
              # working tree AND .git, meaning its config, hooks, refs and object store. That is
              # the account the helper boundary exists to contain. This step used to refresh
              # ${PD}/install.sh with `git checkout` as that user and then run it with `sudo bash`.
              # So on every green merge to main, root executed bytes a compromised panel could
              # choose (rewrite the file, repoint origin, add a hook or a smudge filter), and every
              # check inside install.sh ran too late to matter.
              #
              # Root runs the copy this job shipped instead, staged in a directory root created
              # 0700. install.sh then fetches the code and places the root-owned helper itself,
              # under its own origin and commit checks.
              OWNER="$(sudo -n stat -c %U "${PD}")"
              echo "System install at ${PD} (service user ${OWNER})"
              STAGE="$(sudo -n mktemp -d /tmp/lgsm-deploy.XXXXXXXX)"
              trap 'sudo -n rm -rf -- "${STAGE}"' EXIT
              printf '%s' "${INSTALLER_B64}" | base64 -d | sudo -n tee "${STAGE}/install.sh" >/dev/null
              # From /, not this account's home: install.sh treats a working directory that holds
              # app.py as the source to install FROM.
              cd /
              sudo -n env PANEL_NO_UPGRADE=1 PANEL_UPDATE_REF="${PANEL_UPDATE_REF}" \
                  bash "${STAGE}/install.sh" </dev/null
          elif [ -d "${HOME}/linuxgsm-panel" ]; then
              echo "Per-user install at ${HOME}/linuxgsm-panel"
              cd "${HOME}/linuxgsm-panel"
              # The same pin as the system branch. This took install.sh from origin/main and ran
              # it unpinned, so it installed whatever main's tip was when the SSH session ran —
              # including a later push whose CI had not finished, or had failed — under the deploy
              # of a commit that passed. It runs the installer this job shipped (the verified
              # commit's), pinned to that commit; install.sh never moves a checkout backwards to
              # the pin, so a late run of an old commit leaves a newer host where it is — and the
              # older installer written over the checkout's own is then put back from HEAD.
              printf '%s' "${INSTALLER_B64}" | base64 -d > install.sh
              rc=0
              PANEL_NO_UPGRADE=1 PANEL_UPDATE_REF="${PANEL_UPDATE_REF}" bash install.sh || rc=$?
              git checkout -q HEAD -- install.sh 2>/dev/null || true
              exit "${rc}"
          else
              echo "No panel install found on this host, so there was nothing to deploy to." >&2
              echo "  - the linuxgsm-panel unit reported WorkingDirectory='${PD}'" >&2
              echo "  - and there is no ${HOME}/linuxgsm-panel" >&2
              echo "A system install also needs this account to have passwordless sudo." >&2
              exit 1
          fi
          REMOTE
          } | ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
                "$U@$DEPLOY_HOST" 'bash -s'
