name: ClusterFuzzLite batch

# The long-running counterpart to cflite_pr.yml. That one fuzzes what a PR changed; this fuzzes
# EVERYTHING on a schedule and — the point of it — keeps the corpus it builds, so each run starts
# smarter than the last instead of from the committed seeds.
#
# The corpus is kept as Actions artifacts (cifuzz-corpus-<target>), with no storage repository and
# no secret. The ClusterFuzzLite docs call a storage repo "optional but recommended" and say that
# without one "corpora and coverage reports will be uploaded as GitHub artifacts instead"
# (https://google.github.io/clusterfuzzlite/running-clusterfuzzlite/github-actions/). Until
# 2026-10 every step here waited on a CFL_STORAGE_REPO secret that was never set, so this job had
# reported success since 2026-08-09 having fuzzed nothing. cflite_pr.yml reads the corpus back,
# and cflite_cron.yml prunes it and reports its coverage.
#
# Artifacts expire after this repository's 90-day retention; the nightly run keeps the corpus.
on:
  schedule:
    - cron: '17 3 * * *'     # daily, off the hour so it does not collide with everything else
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch:
    name: batch fuzz (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Never in a fork, and only on main: what this uploads is what every pull request's fuzzing
    # reads back, and the artifact check below refuses any cifuzz-* artifact not made on main.
    if: github.repository == 'FMSMITH91/linuxgsm-panel' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read   # the corpus it starts from is an Actions artifact (the vendor's read-all)
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address ]
    steps:
      # What cflite_pr.yml says about this step holds here too: the run step below unpacks the
      # stored corpus unchecked, so every stored cifuzz-* artifact must be main's first.
      - name: Every stored fuzz artifact was made on main here
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rows="$(gh api "repos/${REPO}/actions/artifacts?per_page=100" --paginate --jq '
            .artifacts[] | select((.expired | not) and (.name | startswith("cifuzz-")))
            | [.name, .id, .workflow_run.id, .workflow_run.head_branch,
               .workflow_run.head_repository_id, .workflow_run.repository_id] | @tsv')"
          foreign="$(awk -F'\t' 'NF && ($4 != "main" || $5 == "" || $5 != $6)' <<< "${rows}")"
          echo "stored cifuzz-* artifacts: $(grep -c . <<< "${rows}" || true)"
          if [ -n "${foreign}" ]; then
            echo "::error::A cifuzz-* artifact here was not made by a run of this repository's main. Nothing is fuzzed until it is deleted: run the ClusterFuzzLite artifact cleanup workflow (cflite_cleanup.yml, also every 6 hours), or gh api -X DELETE repos/${REPO}/actions/artifacts/<id>. (name, id, run, branch, head repository id, repository id):"
            printf '%s\n' "${foreign}"
            exit 1
          fi

      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: ${{ matrix.sanitizer }}

      - name: Fuzz everything (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python   # run_fuzzers defaults to c++ and does not inherit the build's setting
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 900
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}

      # ClusterFuzzLite catches every upload failure, logs it and goes on (oss-fuzz
      # infra/cifuzz/clusterfuzz_deployment.py upload_build/upload_corpus; the filestore ignores
      # upload.js's exit code), so the step above passes having stored nothing. Its artifacts use
      # @actions/artifact 2, whose uploads the REST API lists at once, mid-run (actions/toolkit
      # packages/artifact/README.md). So this lists THIS run's artifacts and fails, naming each,
      # on any it should have made. part30 holds the copies equal and the names to the targets.
      - name: This run stored the fuzz artifacts it made
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: >-
            cifuzz-corpus-fuzz_config cifuzz-corpus-fuzz_console cifuzz-corpus-fuzz_cron
            cifuzz-corpus-fuzz_fail2ban cifuzz-corpus-fuzz_firewall cifuzz-corpus-fuzz_game_status
        run: |
          set -euo pipefail
          read -ra want <<< "${EXPECT}"
          stored="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                      --paginate --jq '.artifacts[] | select(.expired | not) | .name')"
          missing=()
          for name in "${want[@]}"; do
            grep -qxF -- "${name}" <<< "${stored}" || missing+=("${name}")
          done
          echo "this run stored $(grep -c . <<< "${stored}" || true) artifact(s); expected ${#want[@]}, missing ${#missing[@]}"
          if [ "${#want[@]}" -eq 0 ] || [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::This run stored no artifact named: ${missing[*]:-(nothing was expected)}. ClusterFuzzLite logs a failed upload and goes on, so the step above passed without keeping it."
            exit 1
          fi
