name: ClusterFuzzLite prune and coverage

# Corpus pruning and a coverage report for the fuzz targets. Both need the corpus that
# cflite_batch.yml accumulates, so both self-disable without CFL_STORAGE_REPO — see that file for
# what to create. Inert until then; live the moment the secret exists.
on:
  schedule:
    - cron: '43 4 * * 0'     # weekly, after a few nightly batch runs have fed the corpus
  workflow_dispatch:

permissions:
  contents: read

env:
  CFL_STORAGE_REPO: ${{ secrets.CFL_STORAGE_REPO }}

jobs:
  prune:
    name: prune the corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'FMSMITH91/linuxgsm-panel'
    steps:
      # A job whose steps are all skipped concludes SUCCESS, not "skipped" — and with no required
      # status checks on this repo, three green ticks per cycle for zero work is indistinguishable
      # from three green ticks for a clean fuzz. CFL_STORAGE_REPO is unset, so every step below is
      # skipped and has been since 2026-08-09. `secrets` and `env` are not available in a
      # job-level `if:`, so the honest fix at this level is to SAY SO in the summary, ungated.
      - name: Say whether this job is actually doing anything
        run: |
          if [ -z "${CFL_STORAGE_REPO}" ]; then
            echo "DISABLED: CFL_STORAGE_REPO is not set, so every fuzzing step below is skipped." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ClusterFuzzLite is disabled (CFL_STORAGE_REPO unset) — this green tick means no fuzzing ran."
          else
            echo "Corpus storage: ${CFL_STORAGE_REPO}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build fuzzers
        id: build
        if: env.CFL_STORAGE_REPO != ''
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python

      - name: Prune
        # Drops inputs that no longer reach anything new, so the corpus stays fast to replay.
        if: env.CFL_STORAGE_REPO != '' && steps.build.outcome == 'success'
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune
          storage-repo: ${{ secrets.CFL_STORAGE_REPO }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

  coverage:
    name: fuzzing coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'FMSMITH91/linuxgsm-panel'
    steps:
      # Same as the prune job above: all-skipped steps conclude SUCCESS, so say what happened.
      - name: Say whether this job is actually doing anything
        run: |
          if [ -z "${CFL_STORAGE_REPO}" ]; then
            echo "DISABLED: CFL_STORAGE_REPO is not set, so the coverage run below is skipped." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ClusterFuzzLite is disabled (CFL_STORAGE_REPO unset) — this green tick means no coverage report was produced."
          fi

      - name: Build fuzzers (coverage)
        id: build
        if: env.CFL_STORAGE_REPO != ''
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: coverage

      - name: Report
        # Which lines the fuzzers actually reach — a different question from tests/ coverage, and
        # the honest way to tell whether a target is exercising the parser or bouncing off a guard.
        if: env.CFL_STORAGE_REPO != '' && steps.build.outcome == 'success'
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
          storage-repo: ${{ secrets.CFL_STORAGE_REPO }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
