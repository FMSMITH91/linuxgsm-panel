name: ClusterFuzzLite prune and coverage

# Corpus pruning and a coverage report for the fuzz targets, over the corpus cflite_batch.yml keeps
# as Actions artifacts (see that file: no storage repository, no secret). Prune replaces each
# cifuzz-corpus-<target> with a smaller one that reaches the same code; coverage uploads
# cifuzz-coverage-latest, which cflite_pr.yml's build step reads to fuzz only the targets a pull
# request's diff touches.
on:
  schedule:
    - cron: '43 4 * * 0'     # weekly, after a few nightly batch runs have fed the corpus
  workflow_dispatch:
  # zizmor: ignore[concurrency-limits] its check lands on main's head, where a cancelled pending run reads as a failure

permissions:
  contents: read

jobs:
  prune:
    name: prune the corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Never in a fork, and only on main: cflite_pr.yml reads back what this uploads, and refuses any
    # cifuzz-* artifact that was not made on main.
    if: github.repository == 'FMSMITH91/linuxgsm-panel' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read   # the corpus is an Actions artifact (the vendor's read-all)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # See cflite_pr.yml: the prune step unpacks the stored corpus unchecked, so every stored
      # cifuzz-* artifact must be main's first.
      - name: Every stored fuzz artifact was made on main here
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rows="$(gh api "repos/${REPO}/actions/artifacts?per_page=100" --paginate --jq '
            .artifacts[] | select((.expired | not) and (.name | startswith("cifuzz-")))
            | [.name, .id, .workflow_run.id, .workflow_run.head_branch,
               .workflow_run.head_repository_id, .workflow_run.repository_id] | @tsv')"
          foreign="$(awk -F'\t' 'NF && ($4 != "main" || $5 == "" || $5 != $6)' <<< "${rows}")"
          echo "stored cifuzz-* artifacts: $(grep -c . <<< "${rows}" || true)"
          if [ -n "${foreign}" ]; then
            echo "::error::A cifuzz-* artifact here was not made by a run of this repository's main. Nothing is fuzzed until it is deleted: run the ClusterFuzzLite artifact cleanup workflow (cflite_cleanup.yml, also every 6 hours), or gh api -X DELETE repos/${REPO}/actions/artifacts/<id>. (name, id, run, branch, head repository id, repository id):"
            printf '%s\n' "${foreign}"
            exit 1
          fi

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python

      - name: Prune
        # Drops inputs that no longer reach anything new, so the corpus stays fast to replay.
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune

      # ClusterFuzzLite catches every upload failure, logs it and goes on (oss-fuzz
      # infra/cifuzz/clusterfuzz_deployment.py upload_build/upload_corpus; the filestore ignores
      # upload.js's exit code), so the step above passes having stored nothing. Its artifacts use
      # @actions/artifact 2, whose uploads the REST API lists at once, mid-run (actions/toolkit
      # packages/artifact/README.md). So this lists THIS run's artifacts and fails, naming each,
      # on any it should have made. part30 holds the copies equal and the names to the targets.
      - name: This run stored the fuzz artifacts it made
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: >-
            cifuzz-corpus-fuzz_config cifuzz-corpus-fuzz_console cifuzz-corpus-fuzz_cron
            cifuzz-corpus-fuzz_fail2ban cifuzz-corpus-fuzz_firewall cifuzz-corpus-fuzz_game_status
        run: |
          set -euo pipefail
          read -ra want <<< "${EXPECT}"
          stored="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                      --paginate --jq '.artifacts[] | select(.expired | not) | .name')"
          missing=()
          for name in "${want[@]}"; do
            grep -qxF -- "${name}" <<< "${stored}" || missing+=("${name}")
          done
          echo "this run stored $(grep -c . <<< "${stored}" || true) artifact(s); expected ${#want[@]}, missing ${#missing[@]}"
          if [ "${#want[@]}" -eq 0 ] || [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::This run stored no artifact named: ${missing[*]:-(nothing was expected)}. ClusterFuzzLite logs a failed upload and goes on, so the step above passed without keeping it."
            exit 1
          fi

  coverage:
    name: fuzzing coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'FMSMITH91/linuxgsm-panel' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read   # the corpus it replays is an Actions artifact
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Same as the prune job above.
      - name: Every stored fuzz artifact was made on main here
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rows="$(gh api "repos/${REPO}/actions/artifacts?per_page=100" --paginate --jq '
            .artifacts[] | select((.expired | not) and (.name | startswith("cifuzz-")))
            | [.name, .id, .workflow_run.id, .workflow_run.head_branch,
               .workflow_run.head_repository_id, .workflow_run.repository_id] | @tsv')"
          foreign="$(awk -F'\t' 'NF && ($4 != "main" || $5 == "" || $5 != $6)' <<< "${rows}")"
          echo "stored cifuzz-* artifacts: $(grep -c . <<< "${rows}" || true)"
          if [ -n "${foreign}" ]; then
            echo "::error::A cifuzz-* artifact here was not made by a run of this repository's main. Nothing is fuzzed until it is deleted: run the ClusterFuzzLite artifact cleanup workflow (cflite_cleanup.yml, also every 6 hours), or gh api -X DELETE repos/${REPO}/actions/artifacts/<id>. (name, id, run, branch, head repository id, repository id):"
            printf '%s\n' "${foreign}"
            exit 1
          fi

      - name: Build fuzzers (coverage)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: coverage

      - name: Report
        # Which lines the fuzzers actually reach — a different question from tests/ coverage, and
        # the honest way to tell whether a target is exercising the parser or bouncing off a guard.
        # The report is the cifuzz-coverage-latest artifact on this run.
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage

      # ClusterFuzzLite catches every upload failure, logs it and goes on (oss-fuzz
      # infra/cifuzz/clusterfuzz_deployment.py upload_build/upload_corpus; the filestore ignores
      # upload.js's exit code), so the step above passes having stored nothing. Its artifacts use
      # @actions/artifact 2, whose uploads the REST API lists at once, mid-run (actions/toolkit
      # packages/artifact/README.md). So this lists THIS run's artifacts and fails, naming each,
      # on any it should have made. part30 holds the copies equal and the names to the targets.
      - name: This run stored the fuzz artifacts it made
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: cifuzz-coverage-latest
        run: |
          set -euo pipefail
          read -ra want <<< "${EXPECT}"
          stored="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                      --paginate --jq '.artifacts[] | select(.expired | not) | .name')"
          missing=()
          for name in "${want[@]}"; do
            grep -qxF -- "${name}" <<< "${stored}" || missing+=("${name}")
          done
          echo "this run stored $(grep -c . <<< "${stored}" || true) artifact(s); expected ${#want[@]}, missing ${#missing[@]}"
          if [ "${#want[@]}" -eq 0 ] || [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::This run stored no artifact named: ${missing[*]:-(nothing was expected)}. ClusterFuzzLite logs a failed upload and goes on, so the step above passed without keeping it."
            exit 1
          fi
