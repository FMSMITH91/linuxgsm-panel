# osv-scanner's configuration for package-lock.json beside it (security-code.yml, the dependency
# audit). It applies to the lockfiles in THIS directory only; it does not propagate.
#
# Every entry is a reviewed advisory that cannot be fixed by a bump, and every one EXPIRES: on its
# ignoreUntil date the audit fails again and it is looked at afresh. A unit check (part27) holds each
# entry to a reason and a date, and Dependency Review's allow-ghsas to this list.

# None at the moment. GHSA-ch52-4w7c-c8xp (CVE-2026-93748, http-cache-semantics) was exempted here
# until #417 moved the lock to 4.3.0, outside the advisory's <= 4.2.0 range; left in place, it would
# have let a later lock that brought 4.2.0 back pass this audit and Dependency Review silently.
# 4.3.0 is NOT fixed, though: its max-stale lines are identical to 4.2.0's and the upstream fix (#58)
# was closed unmerged — the range only predates 4.3.0. It stays unreachable here (gamedig never sets
# got's `cache` option, so no cache exists). If the advisory's range is widened to cover 4.3.0, put
# the entry back with that reachability reason and an ignoreUntil, and its two twins with it
# (dependency-review.yml's allow-ghsas, .github/codacy-accepted-errors.json).
